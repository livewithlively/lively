name: test
# 테스트 CI (#880) — 종전엔 release.yml(태그 빌드)뿐이라 테스트가 CI 에서 안 돌았다.
#  ① 목 유닛 체인(npm test, DB 불요)  ② **device-auth PG 통합 테스트**(실제 Postgres 필요 — 원자적 발급·
#     slow_down·ON-CONFLICT·DB시각 만료는 목 pg 로 검증 불가, #880 설계 R2-NEW2).
#  ⚠ items DB 는 pgvector 이미지여야 한다(items-db-pgvector-image-invariant, #172) — plain postgres 금지.
# ⚠ 트리거 설계(#1508) — push 를 '**' 로 두면 PR 브랜치 하나에 CI 가 **두 번** 붙는다(push 이벤트 + pull_request
#  이벤트). 실측 2026-08-04: 06:08:28 push / 06:08:30 pull_request 가 같은 커밋에 각각 돌았다(2분 22초짜리가 2배).
#  게다가 pull_request 이벤트는 브랜치가 아니라 **base 에 머지한 결과**(refs/pull/N/merge)를 검사하므로 push 쪽보다
#  엄밀하다 — 중복 중 버릴 쪽은 push 다. 그래서 push 는 PR 을 안 거치는 브랜치(main·stage)만 남긴다.
on:
  push:
    branches: [main, stage]
  pull_request:
  merge_group:      # merge queue 를 켜면 큐가 이 이벤트로 최종 검증한다(안 켠 동안은 발화하지 않음 — 무해)

# 같은 ref 에 새 커밋이 오면 앞의 run 은 쓸모없다(force push·연타). 다만 main 은 커밋마다 '그 커밋이 통과했다'는
#  기록 자체가 자산이라 취소하지 않는다. PR(refs/pull/N/merge)과 브랜치 push(refs/heads/*)는 ref 가 달라 서로 안 건드린다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lively_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: deps
        run: npm ci
      - run: npm run build
      # ⚠ 아래 검증 스텝의 게이트는 `!cancelled() && steps.deps.outcome == 'success'` 다(#1431).
      #  · **왜 `success()`(기본)가 아닌가** — 기본값은 앞 스텝이 하나 깨지면 뒤를 통째로 skip 한다. 가장 흔한
      #    케이스(산출물 재빌드 누락 → 신선도 게이트 실패)에서 테스트 160건이 한 건도 안 돌아, 고치고 push 하고
      #    또 기다리는 왕복이 반복됐다. 한 번의 런에서 모든 실패를 보는 게 목적이다(러너 자체도 같은 원칙).
      #  · **왜 `!cancelled()` 만으로는 안 되나** — 2026-08-03 실측: `services.postgres` 컨테이너 init 이 실패해
      #    checkout·npm ci 가 skip 된 런에서, 이 스텝들이 **소스도 없는 워크스페이스에서 그대로 돌아**
      #    `Cannot find module dist/…` 를 4개 쏟았다. 원인은 인프라인데 로그가 우리 코드 탓처럼 보였다.
      #    그래서 **전제(체크아웃·의존성)** 를 조건으로 건다 — 전제가 없으면 조용히 skip, 빌드 실패는 여전히 통과.
      #    (빌드가 깨진 런에선 dist 의존 스텝이 시끄러울 수 있으나, 그 원인은 같은 로그에 바로 위에 찍힌다.)
      # ⓘ 여기 있던 "산출물 신선도 (public/app 드리프트 0)" 게이트는 #2054 에서 **제거**했다.
      #  그 게이트는 웹 산출물을 커밋하던 관례가 만든 위험("소스는 새 판인데 커밋된 산출물은 옛 판")을
      #  막으려던 방어장치였다. 이제 산출물이 git 밖이라(.gitignore) 그 어긋남이 **성립할 수 없다** —
      #  존재하는 public/app 은 바로 위 `npm run build` 가 방금 만든 것 하나뿐이다.
      #  ⚠ 그러니 되살리지 마라: 추적 파일이 없으면 `git diff` 는 **항상 통과**하는 빈 게이트가 된다.
      # ① 전체 유닛 체인(#1313 R4) — scripts/run-tests.mjs 가 소스 글롭으로 자동 발견(145+건, 실 DB 불요:
      #    DB 필요한 것은 *.itest.mjs/*.pg-test.mjs 로 제외 관례, static-context 는 env 없으면 자체 skip).
      #    종전엔 케이스 ⑨(detached 훅) flaky 우려로 device-auth+CLI 2건만 돌렸으나(#880 주석), 그 테스트에는
      #    폴링 대기 하드닝(waitFor 60s — kit/setup/self-update.test.mjs ⑨ 주석)이 들어가 전체를 승격한다.
      # --budget: 유닛 파일 하나가 45초를 넘으면 **통과해도 실패**다(#2457). 넘는다는 건 그 파일이
      #  유닛이 아니거나 무언가를 기다린다는 뜻이다. 실측 2026-08-31: DB 주소가 없는데 pg 가 기본값
      #  localhost:5432 로 붙어(= 이 잡의 services.postgres) 6개 파일이 60초씩 대기했고, 그게 유닛
      #  CPU 604초의 60%였다. 아무도 몰랐던 건 **아무도 안 재고 있었기 때문**이다.
      - name: 전체 유닛 테스트 (run-tests 러너)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/run-tests.mjs --budget=45
      # ② 테스트 DB 스키마 자가마이그레이션 — **initAllSchemas 전체 체인**(item→org→domainmap→v6, 부팅과 동일
      #    단일 출처 boot/schemas.ts 경유, #1313 R19a). 종전엔 item+org 2계열만 돌아, 시드 한 줄이 제약을 어겨
      #    뒤 계열(v6 ALTER)이 통째로 안 도는 회귀(2026-07-20 실사고 계열)를 CI 가 못 잡았다. 신규 DB init 스모크 겸용.
      #    ITEMS_DATABASE_URL 은 이 스텝부터. (services.postgres 가 pgvector 이미지라 v6 임베딩 스키마도 실경로로 돈다.)
      - name: 스키마 마이그레이션 (테스트 Postgres · initAllSchemas 전체 체인)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: >-
          node --input-type=module -e "
          import('./dist/boot/schemas.js').then(m => m.initAllSchemas())
            .then(() => { console.log('schema ready'); process.exit(0); })
            .catch(e => { console.error(e); process.exit(1); });"
      # ③ device-auth PG 통합(실 트랜잭션·now()·RETURNING rowCount) — 두 HIGH 통제(원자성·PKCE 바인딩) 검증.
      - name: device-auth PG 통합 테스트
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node src/org/auth/device-auth.pg-test.mjs
      # ④ OAuth 인가서버 스토어(#1473 T2) — 목으로는 못 보는 것들: now() 기준 만료, 인가코드 1회성(RETURNING
      #    rowCount), 코드·리프레시 재사용 시 **연쇄 회수**, 클라이언트 해제 kill-switch.
      - name: OAuth 인가서버 PG 통합 테스트
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node src/org/auth/oauth.pg-test.mjs
      # ④-b 토큰 회수(#2646) — 목으로는 못 보는 것: **회수했다는 말이 아니라 실제로 죽었는가**.
      #    실측 사고(2026-09-04)가 정확히 여기였다 — 회수가 {ok:true} 를 답했는데 그 토큰으로 API 가 200 이었다.
      #    그래서 이 계층은 부작용으로 판정한다: 발급 → verifyDbToken 유효 → 회수 → verifyDbToken null.
      #    UPDATE rowCount 0 을 성공으로 답하지 않는가, 감사는 실제로 지운 경우에만 남는가도 실 DB 라야 본다.
      - name: 토큰 회수 PG 통합 테스트
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node src/org/store/token-revoke.pg-test.mjs
      # ⑤ 프로젝트↔카테고리 연결의 정직성 — 반영 못 하면 성공을 가장하지 않고 409/404 로 끊는지.
      #    이 버그는 반환값이 거짓말한 것이라(스토어는 정직, 핸들러가 그 값을 버림) **핸들러 호출 + DB
      #    read-back** 이 아니면 못 잡는다.
      - name: 프로젝트 카테고리 반영 PG 통합 테스트
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node src/v6/project-category-apply.pg-test.mjs
      # ⑥ OAuth 전 구간(#1473 T2) — 실제 게이트웨이 프로세스를 띄워 MCP 클라이언트가 밟는 순서를 그대로:
      #    401 발견 → PRM/AS 메타데이터 → DCR → 동의 → PKCE 토큰교환 → /mcp 호출 → 리프레시 회전.
      #    라우터 마운트 순서·메타데이터 경로·쿠키 세션은 이 계층이 아니면 아무도 안 본다.
      - name: OAuth 전 구간 통합 테스트 (실 게이트웨이)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node scripts/oauth-flow.itest.mjs

  # ── 윈도우 커버리지 (#1475) ────────────────────────────────────────────────────
  #  왜: 멤버 대상 코드(kit/)는 **윈도우에서 실행된 적이 없다**. 그 사이 같은 클래스의 결함이 반복해서
  #   고객에게 나갔다 — 2026-08-04 하루에 두 건:
  #     · `writable_roots` 에 윈도우 경로를 TOML 이스케이프 없이 써서 **codex 가 통째로 안 뜸**
  #     · 자산 containment 검사가 `/` 를 하드코딩해 **조직 스킬 26개가 한 개도 안 깔림**(게다가 무음)
  #   둘 다 mac/linux 에선 **절대 재현되지 않는다**. 사람이 윈도우 PC 를 열어 확인하는 방식은 지속되지 않는다
  #   (실제로 사용자 신고로만 발견됐다) → 러너로 자동화한다. public 레포라 windows 러너는 무료다.
  #
  #  범위: kit/**/*.test.mjs 만. 이 계층은 외부 의존성이 없어(node 내장 + 자기 모듈) `npm ci` 가 불필요하고,
  #   그래서 네이티브 모듈(node-pty) 빌드 리스크 없이 1분 안에 끝난다. 서버(src/) 는 리눅스 박스에서만 도므로
  #   윈도우에서 돌릴 이유가 없다.
  #
  #  ⚠ 2026-08-04 **필수 게이트로 승격**(#1510) — continue-on-error 를 제거했다. 첫 실행에서 18/33 이 깨졌고
  #   그걸 전수 분류해 제품 2건(트랜스크립트 경로 인코딩 · 훅 엔트리 중복 수렴)을 고치고, 나머지는 테스트의
  #   POSIX 가정(절대경로 동적 import · CRLF · HOME/TMPDIR 샌드박스 · sh 스텁 바이너리)을 걷어냈다.
  #   POSIX 전용 기능(`lively node` — tmux·launchd/systemd)은 테스트 안에서 **명시적으로 skip** 한다.
  #   → 이제 여기 초록불은 '통과'를 뜻한다. 깨지면 고치거나, 비목표임을 테스트에 skip 으로 적어라.
  test-windows:
    runs-on: windows-latest
    steps:
      # ⚠ 줄끝은 .gitattributes(`* text=auto eol=lf`)가 LF 로 고정한다 — kit 의 정적 계약 테스트가
      #  '우리 소스 텍스트'를 읽어 단언하므로, 체크아웃이 CRLF 로 바뀌면 주석 제거 정규식이 무력화된다.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 테스트 격리 preflight (호스트 효과 권한 상승 금지)
        run: node kit/testlib/test-isolation-lint.test.mjs
      # 끝까지 실행하고 실패를 모아 보고(run-tests 러너와 같은 정책 — 실패 1건이 나머지를 가리지 않게).
      # ⚠ desktop/ 도 포함한다 (#1541, 2026-08-11). 데스크톱 앱 코어는 kit 과 같은 성질이다 —
      #  **멤버 PC 에서 실행되고, 외부 의존성이 없다**(node 내장 + 자기 모듈). 그런데 여기서 빠져 있어서
      #  Windows 전용 결함이 실기기까지 나갔다: 심이 `lively.cmd` 인데 Node 는 CVE-2024-27980 이후
      #  shell 없는 배치 실행을 거부한다 → 앱이 CLI 를 **한 번도** 못 불렀다(`spawn EINVAL` 반복).
      #  스텁 spawn 으로 도는 단위테스트도, mac 에서 도는 실동작 검증도 이 층을 원리적으로 못 본다.
      #  이제 desktop-core 의 J8('진짜로 띄워 본다')이 이 러너에서 돌아 같은 계열을 막는다.
      # ⚠ 2026-08-31 (#2457) — 여기 있던 PowerShell foreach 순회를 **공통 러너로 바꿨다.**
      #  종전 루프의 문제는 느린 게 아니었다(직렬이라 194초, 이 잡이 CI 벽시계를 잡고 있었다).
      #  진짜 문제는 **러너를 지나지 않아 러너가 심는 가드가 윈도우에서 하나도 안 돌았다**는 것이다:
      #    · 실 홈 오염 런타임 가드(scripts/testguard-real-home.mjs) · 격리 preflight · 빌드 산출물 누락 검사
      #  그래서 windows 잡은 '초록인데 아무도 안 보는 면' 이었다. --scope 는 src→dist 매핑을 건너뛰므로
      #  이 잡이 npm ci·빌드 없이(=kit/desktop 은 node 내장 + 자기 모듈뿐) 러너를 그대로 쓸 수 있다.
      #  실패 수집·병렬·느린 파일 보고도 리눅스와 같은 규칙으로 따라온다.
      - name: kit·desktop 테스트 (윈도우 · 공통 러너)
        run: node scripts/run-tests.mjs --scope=kit,desktop
      # 실제 HKCU User PATH는 개발자 PC가 아니라 이 disposable 러너에서만 건드린다. 스크립트 자체도
      # GITHUB_ACTIONS+RUNNER_OS+명시 capability 네 조건이 아니면 exit 2로 거부하며 install→uninstall 원복을 단언한다.
      - name: Windows User PATH 호스트 효과 왕복 (disposable runner)
        shell: pwsh
        env:
          LIVELY_HOST_EFFECTS: allow
        run: node scripts/windows-host-effects.ci.mjs
