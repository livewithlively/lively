name: test
# 테스트 CI (#880) — 종전엔 release.yml(태그 빌드)뿐이라 테스트가 CI 에서 안 돌았다.
#  ① 목 유닛 체인(npm test, DB 불요)  ② **device-auth PG 통합 테스트**(실제 Postgres 필요 — 원자적 발급·
#     slow_down·ON-CONFLICT·DB시각 만료는 목 pg 로 검증 불가, #880 설계 R2-NEW2).
#  ⚠ items DB 는 pgvector 이미지여야 한다(items-db-pgvector-image-invariant, #172) — plain postgres 금지.
# ⚠ 트리거 설계(#1508) — push 를 '**' 로 두면 PR 브랜치 하나에 CI 가 **두 번** 붙는다(push 이벤트 + pull_request
#  이벤트). 실측 2026-08-04: 06:08:28 push / 06:08:30 pull_request 가 같은 커밋에 각각 돌았다(2분 22초짜리가 2배).
#  게다가 pull_request 이벤트는 브랜치가 아니라 **base 에 머지한 결과**(refs/pull/N/merge)를 검사하므로 push 쪽보다
#  엄밀하다 — 중복 중 버릴 쪽은 push 다. 그래서 push 는 PR 을 안 거치는 브랜치(main·stage)만 남긴다.
on:
  push:
    branches: [main, stage]
  pull_request:
  merge_group:      # merge queue 를 켜면 큐가 이 이벤트로 최종 검증한다(안 켠 동안은 발화하지 않음 — 무해)

# 같은 ref 에 새 커밋이 오면 앞의 run 은 쓸모없다(force push·연타). 다만 main 은 커밋마다 '그 커밋이 통과했다'는
#  기록 자체가 자산이라 취소하지 않는다. PR(refs/pull/N/merge)과 브랜치 push(refs/heads/*)는 ref 가 달라 서로 안 건드린다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lively_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: deps
        run: npm ci
      - run: npm run build
      # ⚠ 아래 검증 스텝의 게이트는 `!cancelled() && steps.deps.outcome == 'success'` 다(#1431).
      #  · **왜 `success()`(기본)가 아닌가** — 기본값은 앞 스텝이 하나 깨지면 뒤를 통째로 skip 한다. 가장 흔한
      #    케이스(산출물 재빌드 누락 → 신선도 게이트 실패)에서 테스트 160건이 한 건도 안 돌아, 고치고 push 하고
      #    또 기다리는 왕복이 반복됐다. 한 번의 런에서 모든 실패를 보는 게 목적이다(러너 자체도 같은 원칙).
      #  · **왜 `!cancelled()` 만으로는 안 되나** — 2026-08-03 실측: `services.postgres` 컨테이너 init 이 실패해
      #    checkout·npm ci 가 skip 된 런에서, 이 스텝들이 **소스도 없는 워크스페이스에서 그대로 돌아**
      #    `Cannot find module dist/…` 를 4개 쏟았다. 원인은 인프라인데 로그가 우리 코드 탓처럼 보였다.
      #    그래서 **전제(체크아웃·의존성)** 를 조건으로 건다 — 전제가 없으면 조용히 skip, 빌드 실패는 여전히 통과.
      #    (빌드가 깨진 런에선 dist 의존 스텝이 시끄러울 수 있으나, 그 원인은 같은 로그에 바로 위에 찍힌다.)
      # 산출물 신선도 게이트(#1313 R4) — public/app 은 web/*.ts 의 tsc 산출물을 **커밋하는 관례**다
      #  (라이브 박스가 working tree 를 정적 서빙 → git pull 만으로 프론트 갱신). 소스만 고치고 재빌드를
      #  빠뜨린 커밋은 방금 빌드한 산출물과 어긋나 여기서 실패한다 — 관례를 기계로 강제.
      - name: 산출물 신선도 (public/app 드리프트 0)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: git diff --exit-code -- public/app
      # ① 전체 유닛 체인(#1313 R4) — scripts/run-tests.mjs 가 소스 글롭으로 자동 발견(145+건, 실 DB 불요:
      #    DB 필요한 것은 *.itest.mjs/*.pg-test.mjs 로 제외 관례, static-context 는 env 없으면 자체 skip).
      #    종전엔 케이스 ⑨(detached 훅) flaky 우려로 device-auth+CLI 2건만 돌렸으나(#880 주석), 그 테스트에는
      #    폴링 대기 하드닝(waitFor 60s — kit/setup/self-update.test.mjs ⑨ 주석)이 들어가 전체를 승격한다.
      - name: 전체 유닛 테스트 (run-tests 러너)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/run-tests.mjs
      # ② 테스트 DB 스키마 자가마이그레이션 — **initAllSchemas 전체 체인**(item→org→domainmap→v6, 부팅과 동일
      #    단일 출처 boot/schemas.ts 경유, #1313 R19a). 종전엔 item+org 2계열만 돌아, 시드 한 줄이 제약을 어겨
      #    뒤 계열(v6 ALTER)이 통째로 안 도는 회귀(2026-07-20 실사고 계열)를 CI 가 못 잡았다. 신규 DB init 스모크 겸용.
      #    ITEMS_DATABASE_URL 은 이 스텝부터. (services.postgres 가 pgvector 이미지라 v6 임베딩 스키마도 실경로로 돈다.)
      - name: 스키마 마이그레이션 (테스트 Postgres · initAllSchemas 전체 체인)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: >-
          node --input-type=module -e "
          import('./dist/boot/schemas.js').then(m => m.initAllSchemas())
            .then(() => { console.log('schema ready'); process.exit(0); })
            .catch(e => { console.error(e); process.exit(1); });"
      # ③ device-auth PG 통합(실 트랜잭션·now()·RETURNING rowCount) — 두 HIGH 통제(원자성·PKCE 바인딩) 검증.
      - name: device-auth PG 통합 테스트
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node src/org/auth/device-auth.pg-test.mjs

  # ── 윈도우 커버리지 (#1475) ────────────────────────────────────────────────────
  #  왜: 멤버 대상 코드(kit/)는 **윈도우에서 실행된 적이 없다**. 그 사이 같은 클래스의 결함이 반복해서
  #   고객에게 나갔다 — 2026-08-04 하루에 두 건:
  #     · `writable_roots` 에 윈도우 경로를 TOML 이스케이프 없이 써서 **codex 가 통째로 안 뜸**
  #     · 자산 containment 검사가 `/` 를 하드코딩해 **조직 스킬 26개가 한 개도 안 깔림**(게다가 무음)
  #   둘 다 mac/linux 에선 **절대 재현되지 않는다**. 사람이 윈도우 PC 를 열어 확인하는 방식은 지속되지 않는다
  #   (실제로 사용자 신고로만 발견됐다) → 러너로 자동화한다. public 레포라 windows 러너는 무료다.
  #
  #  범위: kit/**/*.test.mjs 만. 이 계층은 외부 의존성이 없어(node 내장 + 자기 모듈) `npm ci` 가 불필요하고,
  #   그래서 네이티브 모듈(node-pty) 빌드 리스크 없이 1분 안에 끝난다. 서버(src/) 는 리눅스 박스에서만 도므로
  #   윈도우에서 돌릴 이유가 없다.
  #
  #  ⚠ continue-on-error 는 **1단계 한정**이다. 지금은 "윈도우에서 무엇이 깨지는지" 목록을 만드는 게 목적이고,
  #   그 목록을 정리(수정 또는 POSIX 전용 skip 가드)한 뒤 이 줄을 지워 **필수 게이트로 승격**한다.
  #   이 줄이 남아 있는 동안은 초록불이 '통과'를 뜻하지 않는다 — 로그의 실패 목록을 직접 읽어야 한다.
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 끝까지 실행하고 실패를 모아 보고(run-tests 러너와 같은 정책 — 실패 1건이 나머지를 가리지 않게).
      - name: kit 테스트 (윈도우)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path kit -Recurse -Filter *.test.mjs |
                   Where-Object { $_.Name -notlike '*.itest.mjs' } | Sort-Object FullName
          Write-Host "수집 $($files.Count)건"
          $failed = @()
          foreach ($f in $files) {
            $rel = Resolve-Path -Relative $f.FullName
            node $f.FullName 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { $failed += $rel; Write-Host "FAIL($LASTEXITCODE) $rel" }
            else { Write-Host "ok   $rel" }
          }
          Write-Host ""
          if ($failed.Count) {
            Write-Host "=== 윈도우 실패 $($failed.Count)/$($files.Count) ==="
            $failed | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "=== 윈도우 $($files.Count)건 전부 통과 ==="
