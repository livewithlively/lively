name: test
# 테스트 CI (#880) — 종전엔 release.yml(태그 빌드)뿐이라 테스트가 CI 에서 안 돌았다.
#  ① 목 유닛 체인(scripts/run-tests.mjs, DB 불요)  ② **PG 통합 테스트**(`*.pg-test.mjs` — 실제 Postgres 필요. 원자적
#     발급·ON-CONFLICT·RETURNING rowCount·DB시각 만료·RLS 조건은 목 pg 로 검증 불가, #880 설계 R2-NEW2).
#  ⚠ items DB 는 pgvector 이미지여야 한다(items-db-pgvector-image-invariant, #172) — plain postgres 금지.
#
# ★ 잡 구조(#5603, 2026-11-18) — **한 벌을 여러 러너가 나눠 돈다.**
#  종전엔 `test` 잡 하나가 전부를 차례로 돌았다: 빌드 56초 → 유닛 1,211 파일 511초(4코어 · CPU 합 1,749초) → PG 통합 106 스텝 429초
#  = **1,036초(17분)**. 그게 PR · 머지 큐 · main push 로 세 번 돌아 변경 하나가 50분을 기다렸다. 러너의 코어는 늘릴 수 없으니
#  러너를 늘린다(public 레포라 러너는 무료다):
#    · `unit`  — 유닛을 조각으로 나눈 잡들. Postgres 가 없다(유닛은 DB 를 안 쓴다 — 5432 가 열려 있으면 오히려 사고였다, #2457).
#    · `pg`    — PG 통합을 조각으로 나눈 잡들. **조각마다 제 Postgres** 라 서로의 행을 못 본다.
#    · `test`  — 위 둘이 전부 초록인지 모으는 문. **브랜치 보호의 필수 체크 이름이 `test` 다** — 이 이름을 바꾸거나 지우면
#                머지 큐가 영영 기다린다.
#  조각은 러너가 나눈다(`--shard=i/N` — scripts/test-runner-schedule.mjs shardFiles). N 은 matrix 의 줄 수에서 온다
#  (`strategy.job-total`) — 조각을 늘리려면 matrix.shard 에 번호 하나를 더하면 된다. 번호를 건너뛰면(1,2,4) 러너가 그 조각을
#  exit 2 로 죽인다(빠진 조각이 초록으로 지나가지 않는다).
#
# ⚠ 트리거 설계(#1508) — push 를 '**' 로 두면 PR 브랜치 하나에 CI 가 **두 번** 붙는다(push 이벤트 + pull_request
#  이벤트). 실측 2026-08-04: 06:08:28 push / 06:08:30 pull_request 가 같은 커밋에 각각 돌았다(2분 22초짜리가 2배).
#  게다가 pull_request 이벤트는 브랜치가 아니라 **base 에 머지한 결과**(refs/pull/N/merge)를 검사하므로 push 쪽보다
#  엄밀하다 — 중복 중 버릴 쪽은 push 다. 그래서 push 는 PR 을 안 거치는 브랜치만 남긴다.
# ⚠ **main 은 push 로 돌리지 않는다**(#5603). main 은 머지 큐로만 전진하고(직접 push 는 GH006 거부 · enforce_admins),
#  큐는 `merge_group` 으로 **main 이 될 바로 그 커밋**을 검증한 뒤 main 을 그 커밋으로 옮긴다. 그래서 main push 실행은
#  이미 초록인 SHA 를 한 번 더 도는 순수 중복이었다 — 실측 2026-11-17~18: main push 12건 전부 직전 merge_group 실행과
#  headSha 가 같았고, 그중 2건은 같은 커밋인데 push 쪽만 빨갰다(흔들림이 main 에 빨간불만 남겼다).
#  체크 결과는 커밋에 붙으므로 main 의 커밋에는 큐가 남긴 초록이 그대로 보인다.
on:
  push:
    branches: [stage]
  pull_request:
  merge_group:      # 머지 큐의 최종 검증 — main 에 들어갈 커밋 그대로

# 같은 ref 에 새 커밋이 오면 앞의 run 은 쓸모없다(force push·연타). PR(refs/pull/N/merge) · stage(refs/heads/stage) ·
#  큐 항목(refs/heads/gh-readonly-queue/main/pr-N-…)은 ref 가 달라 서로 안 건드린다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 유닛 — scripts/run-tests.mjs 가 소스 글롭으로 자동 발견(실 DB 불요: DB 가 필요한 것은 *.itest.mjs/*.pg-test.mjs 로
  #    제외 관례, static-context 는 env 없으면 자체 skip). 조각 6개 ≈ 조각당 CPU 290초(4코어에 85초 안팎).
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # 조각 하나가 깨져도 나머지는 끝까지 — 한 번의 실행에서 모든 실패를 본다(러너와 같은 원칙, #1431)
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: deps
        run: npm ci
      - run: npm run build
      # ⚠ 아래 검증 스텝의 게이트는 `!cancelled() && steps.deps.outcome == 'success'` 다(#1431).
      #  · **왜 `success()`(기본)가 아닌가** — 기본값은 앞 스텝이 하나 깨지면 뒤를 통째로 skip 한다. 빌드(웹 타입 오류 등)가
      #    깨져도 돌 수 있는 테스트는 돌려, 한 번의 런에서 모든 실패를 본다(러너 자체도 같은 원칙).
      #  · **왜 `!cancelled()` 만으로는 안 되나** — 2026-08-03 실측: 컨테이너 init 이 실패해 checkout·npm ci 가 skip 된 런에서
      #    검증 스텝이 **소스도 없는 워크스페이스에서 그대로 돌아** `Cannot find module dist/…` 를 쏟았다. 원인은 인프라인데
      #    로그가 우리 코드 탓처럼 보였다. 그래서 **전제(체크아웃·의존성)** 를 조건으로 건다.
      # ⓘ "산출물 신선도 (public/app 드리프트 0)" 게이트는 #2054 에서 제거했다 — 산출물이 git 밖이라(.gitignore) 그 어긋남이
      #  성립할 수 없다. 되살리지 마라: 추적 파일이 없으면 `git diff` 는 항상 통과하는 빈 게이트다.
      # --budget: 유닛 파일 하나가 45초를 넘으면 **통과해도 실패**다(#2457). 넘는다는 건 그 파일이 유닛이 아니거나 무언가를
      #  기다린다는 뜻이다. 실측 2026-08-31: DB 주소가 없는데 pg 가 기본값 localhost:5432 로 붙어 6개 파일이 60초씩 대기했고,
      #  그게 유닛 CPU 의 60%였다. 아무도 몰랐던 건 **아무도 안 재고 있었기 때문**이다.
      - name: 유닛 테스트 (run-tests 러너 · 조각 ${{ matrix.shard }}/${{ strategy.job-total }})
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/run-tests.mjs --budget=45 --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # ── PG 통합 — `src/**/*.pg-test.mjs` 전부. 목으로는 못 보는 것(실 트랜잭션 · now() · RETURNING rowCount · RLS · GUC · 잠금)을
  #    진짜 Postgres 에서 잰다. 무엇을 왜 재는지는 **각 파일의 머리말**이 정본이다.
  #  ★ 종전엔 파일마다 스텝을 손으로 적었다(106 스텝 · 직렬 429초). 등록을 빠뜨리면 파일은 레포에 있고 CI 는 초록인데 한 번도
  #    안 도는 무음 실패가 됐다(16개 중 5개가 그랬다). 이제 러너가 `--pg` 로 **자동 수집**한다 — 빠뜨릴 자리가 없다.
  #    `scripts/ci-test-jobs.test.mjs` 가 «이 잡이 러너를 --pg 로 부른다 · 손으로 적은 스텝이 남아 있지 않다 · 문이 skip 되지 않는다» 를 지킨다.
  #  조각 안에서는 직렬이다(DB 하나를 나눠 쓴다). 조각 수의 하한은 가장 긴 파일 하나다(app-servers ≈ 115초).
  pg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lively_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: deps
        run: npm ci
      - run: npm run build
      # 테스트 DB 스키마 자가마이그레이션 — **initAllSchemas 전체 체인**(item→org→domainmap→v6, 부팅과 동일 단일 출처
      #  boot/schemas.ts 경유, #1313 R19a). 종전엔 item+org 2계열만 돌아, 시드 한 줄이 제약을 어겨 뒤 계열(v6 ALTER)이 통째로
      #  안 도는 회귀(2026-07-20 실사고 계열)를 CI 가 못 잡았다. 신규 DB init 스모크 겸용(조각마다 빈 DB 에서 한 번씩 돈다).
      #  (services.postgres 가 pgvector 이미지라 v6 임베딩 스키마도 실경로로 돈다.)
      - name: 스키마 마이그레이션 (테스트 Postgres · initAllSchemas 전체 체인)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: >-
          node --input-type=module -e "
          import('./dist/boot/schemas.js').then(m => m.initAllSchemas())
            .then(() => { console.log('schema ready'); process.exit(0); })
            .catch(e => { console.error(e); process.exit(1); });"
      # 분류 런북(runbooks/knowledge-types.md)은 시드(kind_registry·data_source)와 knowledge_save 의 type 선언에서 생성된다.
      #  시드만 고치고 재생성을 잊으면 런북이 조용히 낡는다 — 방금 시드된 빈 DB 로 --check 한다. 한 번이면 되므로 첫 조각에서만.
      #  PG 통합 테스트보다 앞에 둔다(그 테스트들이 같은 DB 를 쓴다).
      - name: 분류 런북이 시드와 일치하나 (build-classify-runbook --check)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.shard == 1 }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node scripts/build-classify-runbook.mjs --check
      - name: PG 통합 테스트 (run-tests --pg · 조각 ${{ matrix.shard }}/${{ strategy.job-total }})
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node scripts/run-tests.mjs --pg --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # OAuth 전 구간(#1473 T2) — 실제 게이트웨이 프로세스를 띄워 MCP 클라이언트가 밟는 순서를 그대로:
      #  401 발견 → PRM/AS 메타데이터 → DCR → 동의 → PKCE 토큰교환 → /mcp 호출 → 리프레시 회전.
      #  라우터 마운트 순서·메타데이터 경로·쿠키 세션은 이 계층이 아니면 아무도 안 본다. 한 번이면 되므로 첫 조각에서만 돈다.
      - name: OAuth 전 구간 통합 테스트 (실 게이트웨이)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.shard == 1 }}
        env:
          ITEMS_DATABASE_URL: postgres://postgres:test@localhost:5432/lively_test
        run: node scripts/oauth-flow.itest.mjs

  # ── 문 — 브랜치 보호의 필수 체크(`test`). 조각이 전부 초록일 때만 초록이다.
  #  ⚠ `if: always()` 를 떼지 마라. needs 가 하나라도 깨지면 이 잡은 기본으로 **skip** 되는데, GitHub 은 skip 된 필수 체크를
  #   **통과로 센다** — 조각이 빨간데 머지 큐가 열린다. always() 로 반드시 돌려 결과를 직접 판정한다(취소도 실패로 읽는다).
  test:
    if: ${{ always() }}
    needs: [unit, pg]
    runs-on: ubuntu-latest
    steps:
      - name: 유닛 · PG 조각이 전부 통과했나
        env:
          UNIT: ${{ needs.unit.result }}
          PG: ${{ needs.pg.result }}
        run: |
          echo "unit=$UNIT pg=$PG"
          [ "$UNIT" = "success" ] && [ "$PG" = "success" ]

  # ── 윈도우 커버리지 (#1475) ────────────────────────────────────────────────────
  #  왜: 멤버 대상 코드(kit/)는 **윈도우에서 실행된 적이 없다**. 그 사이 같은 클래스의 결함이 반복해서
  #   고객에게 나갔다 — 2026-08-04 하루에 두 건:
  #     · `writable_roots` 에 윈도우 경로를 TOML 이스케이프 없이 써서 **codex 가 통째로 안 뜸**
  #     · 자산 containment 검사가 `/` 를 하드코딩해 **조직 스킬 26개가 한 개도 안 깔림**(게다가 무음)
  #   둘 다 mac/linux 에선 **절대 재현되지 않는다**. 사람이 윈도우 PC 를 열어 확인하는 방식은 지속되지 않는다
  #   (실제로 사용자 신고로만 발견됐다) → 러너로 자동화한다. public 레포라 windows 러너는 무료다.
  #
  #  범위: kit/**/*.test.mjs 만. 이 계층은 외부 의존성이 없어(node 내장 + 자기 모듈) `npm ci` 가 불필요하고,
  #   그래서 네이티브 모듈(node-pty) 빌드 리스크 없이 1분 안에 끝난다. 서버(src/) 는 리눅스 박스에서만 도므로
  #   윈도우에서 돌릴 이유가 없다.
  #
  #  ⚠ 2026-08-04 **필수 게이트로 승격**(#1510) — continue-on-error 를 제거했다. 첫 실행에서 18/33 이 깨졌고
  #   그걸 전수 분류해 제품 2건(트랜스크립트 경로 인코딩 · 훅 엔트리 중복 수렴)을 고치고, 나머지는 테스트의
  #   POSIX 가정(절대경로 동적 import · CRLF · HOME/TMPDIR 샌드박스 · sh 스텁 바이너리)을 걷어냈다.
  #   POSIX 전용 기능(`lively node` — tmux·launchd/systemd)은 테스트 안에서 **명시적으로 skip** 한다.
  #   → 이제 여기 초록불은 '통과'를 뜻한다. 깨지면 고치거나, 비목표임을 테스트에 skip 으로 적어라.
  #  ⚠ 2026-11-18(#5603) — 이 잡도 조각으로 나눴다(종전 한 잡 299초: kit·desktop 213초 + 설치 도우미 62초가 차례로).
  #   설치 도우미 빌드와 HKCU 왕복은 시험 조각과 상관없는 일이라 아래 `test-windows-installer` 로 뗐다.
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # ⚠ 줄끝은 .gitattributes(`* text=auto eol=lf`)가 LF 로 고정한다 — kit 의 정적 계약 테스트가
      #  '우리 소스 텍스트'를 읽어 단언하므로, 체크아웃이 CRLF 로 바뀌면 주석 제거 정규식이 무력화된다.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ⓘ 여기 있던 «테스트 격리 preflight» 스텝은 뺐다 — 러너가 어떤 시험보다 먼저 같은 린트를 돌린다(run-tests.mjs,
      #  test-runner-env.test.mjs E11 이 그 순서를 지킨다). 스텝으로 한 번 더 돌리면 같은 일을 두 번 할 뿐이다.
      # 끝까지 실행하고 실패를 모아 보고(run-tests 러너와 같은 정책 — 실패 1건이 나머지를 가리지 않게).
      # ⚠ desktop/ 도 포함한다 (#1541, 2026-08-11). 데스크톱 앱 코어는 kit 과 같은 성질이다 —
      #  **멤버 PC 에서 실행되고, 외부 의존성이 없다**(node 내장 + 자기 모듈). 그런데 여기서 빠져 있어서
      #  Windows 전용 결함이 실기기까지 나갔다: 심이 `lively.cmd` 인데 Node 는 CVE-2024-27980 이후
      #  shell 없는 배치 실행을 거부한다 → 앱이 CLI 를 **한 번도** 못 불렀다(`spawn EINVAL` 반복).
      #  스텁 spawn 으로 도는 단위테스트도, mac 에서 도는 실동작 검증도 이 층을 원리적으로 못 본다.
      #  이제 desktop-core 의 J8('진짜로 띄워 본다')이 이 러너에서 돌아 같은 계열을 막는다.
      # ⚠ 2026-08-31 (#2457) — 여기 있던 PowerShell foreach 순회를 **공통 러너로 바꿨다.**
      #  종전 루프의 문제는 느린 게 아니었다(직렬이라 194초, 이 잡이 CI 벽시계를 잡고 있었다).
      #  진짜 문제는 **러너를 지나지 않아 러너가 심는 가드가 윈도우에서 하나도 안 돌았다**는 것이다:
      #    · 실 홈 오염 런타임 가드(scripts/testguard-real-home.mjs) · 격리 preflight · 빌드 산출물 누락 검사
      #  그래서 windows 잡은 '초록인데 아무도 안 보는 면' 이었다. --scope 는 src→dist 매핑을 건너뛰므로
      #  이 잡이 npm ci·빌드 없이(=kit/desktop 은 node 내장 + 자기 모듈뿐) 러너를 그대로 쓸 수 있다.
      #  실패 수집·병렬·느린 파일 보고도 리눅스와 같은 규칙으로 따라온다.
      - name: kit·desktop 테스트 (윈도우 · 공통 러너)
        run: node scripts/run-tests.mjs --scope=kit,desktop --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # ── 윈도우 — 설치 도우미 · HKCU 왕복. 시험 조각과 나란히 돈다(서로 기다리지 않는다).
  test-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 설치 도우미(#4066)의 C# 판정 규칙을 PR 마다 사례 표(selftest-cases.tsv)로 점검한다. 같은 표의 JS 쪽은 위 desktop-core Z8d 가 본다.
      #  이게 없으면 한쪽 규칙만 고친 PR 이 초록으로 지나가고, 수동 워크플로를 돌릴 때에야 둘이 갈라진 게 드러난다.
      #  여기서 만든 exe 는 서명·게시하지 않고 버린다 — 게시는 desktop-installer-helper.yml 수동 실행만 한다(다시 빌드한 파일은 평판이 0 이다).
      - name: 설치 도우미 빌드·자가 점검 (서명·게시 없음)
        shell: pwsh
        working-directory: desktop/installer-helper
        run: |
          dotnet build -c Release -o out
          if ($LASTEXITCODE -ne 0) { throw "설치 도우미 빌드 실패" }
          $p = Start-Process -FilePath .\out\Lively-Setup.exe -ArgumentList '--self-test', '--log', 'selftest.log' -Wait -PassThru
          Get-Content selftest.log -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "설치 도우미 자가 점검 실패 (종료 코드 $($p.ExitCode))" }
      # 실제 HKCU User PATH는 개발자 PC가 아니라 이 disposable 러너에서만 건드린다. 스크립트 자체도
      # GITHUB_ACTIONS+RUNNER_OS+명시 capability 네 조건이 아니면 exit 2로 거부하며 install→uninstall 원복을 단언한다.
      - name: Windows User PATH 호스트 효과 왕복 (disposable runner)
        shell: pwsh
        env:
          LIVELY_HOST_EFFECTS: allow
        run: node scripts/windows-host-effects.ci.mjs
