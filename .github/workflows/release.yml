name: release
# 태그 푸쉬(vX.Y.Z) → 빌드 → GitHub Release + 설치 번들(context-ontology.tgz) 발행.
#  번들 = dist + public + kit + deploy + package*.json + scripts/backfill-embeddings.mjs (node_modules 미포함 = arch 무관).
#  박스에선 bootstrap.sh 가 이 에셋을 받아 install.sh 실행 → npm ci --omit=dev 로 deps(node-pty) 설치.
#  설치: curl -fsSL <bootstrap-url> | LIVELY_VERSION=latest PUBLIC_URL=… BOOTSTRAP_ADMIN_EMAIL=… sh
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 릴리스 생성·에셋 업로드
  id-token: write   # OIDC — AWS 롤 assume(S3 tokenless 업로드). 장기키 없음.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build          # dist/ + public/app/ (arch 무관 JS)
      - name: 설치 번들 패키징 (node_modules 미포함 — 박스에서 npm ci 로 받음)
        run: |
          tar -czf context-ontology.tgz \
            dist public kit deploy docker-compose.yml package.json package-lock.json README.md \
            scripts/backfill-embeddings.mjs
          ls -la context-ontology.tgz
      - name: GitHub Release 발행 + 에셋 업로드
        uses: softprops/action-gh-release@v2
        with:
          files: context-ontology.tgz
          generate_release_notes: true

      # ── tokenless 상용 배포: 같은 tgz 를 private S3 에도 올린다(OIDC — GitHub 에 장기 AWS 키 없음). ──
      #  고객 설치용 presigned URL 은 온보딩 때 별도 발급(lively-infra/projects/lively-releases/presign.sh).
      #  롤/버킷: lively-infra/projects/lively-releases. 근거: 배포 런북(context-ontology-셀프호스트-배포-…).
      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::425515538094:role/lively-releases-ci-upload
          aws-region: ap-northeast-2
      - name: 릴리스 번들 S3 업로드 (tokenless 전달)
        run: |
          aws s3 cp context-ontology.tgz \
            "s3://lively-releases-425515538094/context-ontology/${GITHUB_REF_NAME}/context-ontology.tgz"
          echo "→ s3://lively-releases-425515538094/context-ontology/${GITHUB_REF_NAME}/context-ontology.tgz"
