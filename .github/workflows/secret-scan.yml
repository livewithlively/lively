name: secret-scan
# 자격증명 유출 게이트 — 두 축으로 본다. 둘 다 실패 시 머지를 막는다.
#  ① 내용 스캔(gitleaks): 커밋된 값이 토큰·키 형태인가. 규칙·예외는 루트 .gitleaks.toml 단일 소스.
#  ② 파일명 스캔: '있으면 안 되는 파일'이 히스토리에 추가된 적 있는가.
#
# ⚠ ②가 왜 따로 있나 — 공개 준비 때 실제로 걸린 건 내용이 아니라 **파일명**이었다. 워킹트리에서 이미
#  지워진 .env 백업은 내용 스캔의 시야 밖(현재 트리에 없음)이지만 히스토리에는 남아 있었다.
#  `--diff-filter=A` 로 '한 번이라도 추가된 적 있는 파일'을 보는 이 검사가 그걸 잡는다.
# ⚠ 트리거는 test.yml 과 같은 이유로 좁혔다(#1508) — push:'**' + pull_request 는 PR 커밋마다 CI 를 2번 돌린다.
#  pull_request 쪽이 base 머지 결과(refs/pull/N/merge)를 보므로 더 엄밀하고, push 는 PR 을 안 거치는 브랜치만 남긴다.
on:
  push:
    branches: [main, stage]
  pull_request:
  merge_group:      # merge queue 를 켜면 큐가 이 이벤트로 최종 검증한다(안 켠 동안은 발화하지 않음 — 무해)
  schedule:
    - cron: '17 3 * * 1'   # 주 1회 전수 — 규칙이 갱신되면 과거 커밋에서 새로 걸릴 수 있다

# schedule 은 기본 브랜치(main) ref 로 도는데 main 은 취소 대상이 아니라(아래 조건) 주간 전수 스캔이 잘리지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 히스토리 전수 — shallow 면 과거 커밋을 못 본다

      - name: gitleaks 설치
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # ★ 스캔 범위를 정한다 (#2044) — PR·머지큐는 **이 변경이 더하는 커밋만**, push·schedule 은 전수.
      #
      # 왜: gitleaks 는 기본이 **모든 ref 전수**다(실측 — 옛 브랜치를 품은 클론에서 같은 leak 이 나온다).
      #  그래서 누군가 옛 히스토리를 품은 브랜치를 origin 에 잠깐 올리면, 그 커밋과 아무 상관 없는
      #  **모든 PR 이 머지큐에서 쫓겨난다**(실측 2026-08-26 08:22~08:23: main 에 없는 2026-06 커밋의
      #  .env.bak 때문에 리포 전역 머지가 막혔고, 그 ref 가 사라진 08:41 이후 저절로 풀렸다.
      #  사후 추적도 불가능했다 — 원인 ref 가 이미 없다).
      #
      # 보안은 안 약해진다:
      #  · PR 이 시크릿을 **더하면** 범위 안이라 잡힌다.
      #  · PR 이 시크릿 품은 옛 브랜치를 **머지해도** 그 커밋들이 base..HEAD 에 들어와 잡힌다.
      #  · 이미 main 에 있는 것은 아래 push(main/stage) 전수와 주 1회 schedule 전수가 잡는다.
      #  · 범위가 비면 **전수로 되돌아간다**(느슨한 쪽이 아니라 엄한 쪽이 기본값이다).
      - name: 스캔 범위 결정
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "${BASE:-}" ]; then
            echo "range=" >> "$GITHUB_OUTPUT"
            echo "히스토리 전수(push/schedule 또는 base 미상)"
            exit 0
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || { echo "::error::base 커밋을 못 찾음: $BASE"; exit 1; }
          N=$(git rev-list --count "$BASE..HEAD")
          # 0커밋이면 스캔이 **조용한 무동작**이 된다 — 통과가 아니라 실패로 만든다(공허한 게이트 방지).
          [ "$N" -ge 1 ] || { echo "::error::스캔할 커밋이 0개다($BASE..HEAD) — 범위 계산이 틀렸다"; exit 1; }
          echo "range=$BASE..HEAD" >> "$GITHUB_OUTPUT"
          echo "증분 스캔: $N 커밋 ($BASE..HEAD)"

      # ① 내용 스캔 — --redact 라 로그에 실값이 찍히지 않는다(CI 로그도 유출 표면이다).
      - name: 시크릿 내용 스캔
        run: |
          if [ -n "${RANGE:-}" ]; then
            gitleaks detect --redact --verbose --config .gitleaks.toml --log-opts="$RANGE"
          else
            gitleaks detect --redact --verbose --config .gitleaks.toml
          fi
        env:
          RANGE: ${{ steps.scope.outputs.range }}

      # ② 파일명 스캔 — 한 번이라도 추가된 적 있는 위험 파일. .env.example 은 자리표시자라 제외.
      - name: 위험 파일명 스캔
        env:
          RANGE: ${{ steps.scope.outputs.range }}
        run: |
          # 범위가 있으면 그 범위만(위 '스캔 범위 결정' 의 사연) — 없으면 종전대로 --all 전수.
          RANGE_ARGS="--all"
          [ -n "${RANGE:-}" ] && RANGE_ARGS="$RANGE"
          hits=$(git log $RANGE_ARGS --diff-filter=A --name-only --pretty=format: \
            | sort -u \
            | grep -iE '(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|\.jks$|\.keystore$|id_rsa|id_ed25519|(^|/)credentials(\.json)?$|\.netrc$|\.pgpass$|service-account.*\.json$' \
            | grep -vE '\.env\.example$' || true)
          if [ -n "$hits" ]; then
            echo "::error::자격증명 파일이 히스토리에 추가된 적이 있습니다:"
            echo "$hits"
            echo ""
            echo "이 파일들은 현재 트리에 없어도 히스토리에 남아 있습니다."
            echo "해당 값은 이미 노출된 것으로 보고 **로테이션**하세요. 파일만 지우는 것으로는 부족합니다."
            exit 1
          fi
          echo "위험 파일명 없음"
