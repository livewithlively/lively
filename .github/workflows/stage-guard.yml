name: stage-guard
# stage 파수 (#2457) — 직접 push 를 허용한 대가로 조용히 쌓이는 두 가지를 구조로 막는다.
#
# stage 가 뭔가: dev 게이트웨이가 서빙하는 "검증 중인 것들을 한 데 모아 돌려보는" 브랜치다.
#  main 처럼 보호하지 않고 직접 push 를 허용한다 — 그게 목적이다. 대신 두 가지가 조용히 자란다.
#
# ① 고아 커밋 — stage 에만 있고 어느 작업 브랜치에도 없는 커밋.
#    2026-08-31 실측: 14건이 쌓여 있었고, 재조립(scripts/restage.sh)이 "날아갈 게 있다"며 중단했다.
#    ⚠ 그 14건 중 **9건은 이미 main 에 같은 코드가 있었다** — stage 에서 먼저 돌려보고 정식 브랜치에서
#     **다시 작성**해 PR 을 냈기 때문이다(스쿼시 때문이 아니다 — main 은 순수 머지만 쓴다). 같은 작업이
#     두 커밋으로 존재하니 patch-id 가 달라, 고아 판정이 "어디에도 없다"고 **오판**한다. 그래서 사람은
#     '진짜 잃을 게 있나'를 매번 손으로 가려내야 했다.
#    → 여기서는 그 판정을 하지 않는다. **stage 를 통째로 스냅샷 브랜치에 남긴다.** 판정이 필요 없으면
#      오판도 없고, 재조립은 "잃을 게 없다"가 항상 참이 된다.
#
# ② 드리프트 — main 이 앞서 나가도 stage 를 다시 만들지 않으면 격차가 자란다.
#    2026-08-31 실측: 마지막 재조립이 08-19, 12일 뒤 main 이 **211커밋** 앞서 있었다. 그 사이
#    `dist/org/liv/first-turn.test.js` 가 stage 에서만 빨간불이었는데, 원인은 회귀가 아니라
#    **stage 가 낡은 것**이었다 — 구현은 새 낱말(#2243), 테스트는 옛 낱말. 그 짝을 맞추는 커밋이
#    main 에만 있었다. 이런 실패는 "코드가 틀렸나"를 한참 뒤진 뒤에야 정체가 드러난다.
#    → 격차를 **매일 재서** 임계를 넘으면 빨간불로 만든다. 오늘 얻은 교훈 그대로 —
#      아무도 재고 있지 않으면 아무도 모른다(러너 `--budget` 과 같은 논리).
#
# 이 워크플로는 stage 를 **바꾸지 않는다**. 남기고, 재고, 알릴 뿐이다. 재조립은 사람이 한다
#  (scripts/restage.sh — 얹혀 있던 브랜치를 다시 머지하고 백업 태그를 남긴다).
on:
  push:
    branches: [stage]
  schedule:
    - cron: "0 0 * * *"      # push 가 없어도 드리프트는 자란다 — 날짜로도 잰다
  workflow_dispatch:

permissions:
  contents: write            # 스냅샷 브랜치 생성·갱신에 필요

concurrency:
  group: stage-guard
  cancel-in-progress: true

env:
  DRIFT_WARN: 50             # main 이 이만큼 앞서면 경고
  DRIFT_FAIL: 150            # 이만큼이면 빨간불 — 08-31 실측(211)이 이 선을 넘는다
  KEEP_SNAPSHOTS: 14         # 남겨 둘 스냅샷 개수(하루 1개 → 2주)

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # rev-list 로 격차를 세려면 전체 이력이 필요하다
      - name: main·stage 최신화
        run: git fetch origin main stage --quiet

      # ── ① 스냅샷 — stage 에 있는 것은 무엇이든 브랜치에 남는다 ──────────────────
      #  하루 1개(날짜 키)로 갱신한다. force 이지만 **덮이는 건 같은 날의 앞선 스냅샷뿐**이고,
      #  그 내용은 지금 stage 안에 그대로 있다(스냅샷은 stage 를 그대로 가리킨다).
      - name: 스냅샷 갱신
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          SHA=$(git rev-parse origin/stage)
          git push origin "${SHA}:refs/heads/stage-snapshot/${DATE}" --force
          echo "스냅샷 stage-snapshot/${DATE} → ${SHA:0:8}"
          echo "- 스냅샷: \`stage-snapshot/${DATE}\` → \`${SHA:0:8}\`" >> "$GITHUB_STEP_SUMMARY"

      # 오래된 스냅샷 정리 — 안전망이 무한히 쌓이면 그것대로 브랜치 목록을 못 쓰게 만든다.
      - name: 오래된 스냅샷 정리
        run: |
          set -euo pipefail
          mapfile -t OLD < <(git ls-remote --heads origin 'refs/heads/stage-snapshot/*' \
            | awk '{print $2}' | sed 's|refs/heads/||' | sort -r | tail -n +$((KEEP_SNAPSHOTS + 1)))
          if [ ${#OLD[@]} -eq 0 ]; then echo "정리할 스냅샷 없음"; exit 0; fi
          for b in "${OLD[@]}"; do echo "삭제 $b"; git push origin --delete "$b" || true; done

      # ── ② 드리프트 — 격차를 재고, 넘으면 빨간불 ────────────────────────────────
      - name: 드리프트 점검
        run: |
          set -euo pipefail
          BEHIND=$(git rev-list --count origin/stage..origin/main)   # main 이 앞선 만큼 = stage 가 낡은 만큼
          AHEAD=$(git rev-list --count origin/main..origin/stage)    # stage 에서만 검증 중인 만큼
          BASE=$(git merge-base origin/main origin/stage)
          BASE_DATE=$(git log -1 --format=%ad --date=short "$BASE")
          {
            echo "## stage 드리프트"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| stage 가 낡은 정도 | **${BEHIND}커밋** (main 이 앞섬) |"
            echo "| stage 에서만 검증 중 | ${AHEAD}커밋 |"
            echo "| 공통 조상 | ${BASE_DATE} (\`${BASE:0:8}\`) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "낡음 ${BEHIND} · 검증중 ${AHEAD} · 공통조상 ${BASE_DATE}"

          if [ "$BEHIND" -ge "$DRIFT_FAIL" ]; then
            echo "::error::stage 가 main 보다 ${BEHIND}커밋 뒤처졌습니다(임계 ${DRIFT_FAIL}). 따라붙이세요 — git merge origin/main (재조립 scripts/restage.sh 는 그 다음)"
            {
              echo ""
              echo "> ⛔ **stage 를 main 에 따라붙여야 합니다.** 이 정도로 벌어지면 stage 에서만 깨지는 테스트가"
              echo "> 생기고(구현과 그 짝인 테스트가 서로 다른 브랜치에 앉는다 — #2457), 그 위에 얹으려는 모든"
              echo "> 세션이 충돌을 하나씩 뚫어야 해 **dev 반영이 통째로 막힙니다**(#2615 실측: 충돌 18파일)."
              echo ""
              echo "> **① 먼저 3-way 머지 — 이것이 기본 경로입니다(아무것도 버리지 않습니다).**"
              echo "> \`\`\`"
              echo "> git checkout -B stage-catchup origin/stage && git config merge.conflictStyle diff3"
              echo "> git merge origin/main      # 충돌은 런북대로: 기계 분류 3단계 뒤 손판정"
              echo "> npm run typecheck && npm run build && node scripts/run-tests.mjs -j 4"
              echo "> git push origin HEAD:stage"
              echo "> \`\`\`"
              echo "> 판정법은 지식 \`stage-main-merge-conflict-triage-method\` — ⚠ 충돌 목록만 보면 안 됩니다"
              echo "> (자동머지가 조용히 만든 중복 정의는 tsc 만 잡습니다)."
              echo ""
              echo "> **② 재조립(\`scripts/restage.sh\`)은 그 다음입니다.** stage 를 **버리고** main 위에 다시"
              echo "> 쌓는 것이라 force-push 이고, stage 직접 커밋 중 정본이 없는 것은 사라집니다(고아 검사가"
              echo "> 막아 세웁니다). 머지로 풀리지 않을 만큼 구조가 갈렸을 때만 쓰세요."
              echo "> 어느 쪽이든 위 스냅샷 브랜치가 지금 stage 를 통째로 담고 있습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$BEHIND" -ge "$DRIFT_WARN" ]; then
            echo "::warning::stage 가 main 보다 ${BEHIND}커밋 뒤처졌습니다(경고 ${DRIFT_WARN} · 빨간불 ${DRIFT_FAIL}). 곧 재조립하세요."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ 경고선(${DRIFT_WARN})을 넘었습니다. ${DRIFT_FAIL} 에서 빨간불이 됩니다." >> "$GITHUB_STEP_SUMMARY"
          fi
