.v2-facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 12.5px; }
.v2-facts dt { color: var(--muted); }
.v2-facts dd { margin: 0; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 우패널 파일 탐색기(#1744, web/v2/files.ts) ──
   세션 작업 폴더를 타임라인과 **같은 골격**으로 본다: 머리 고정 → 경로 한 줄 → 본문만 스크롤.
   종전엔 터미널 단독 페이지 왼쪽에 붙어 있었는데, 상단바를 합치며 이 자리로 왔다(가운데는 대화·터미널만 남는다). */
.v2-files { display: flex; flex-direction: column; flex: 1; min-height: 0; position: relative; }
.v2-files.fx-drag::after { content: '여기에 놓으면 이 폴더로 올라갑니다'; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  display: grid; place-items: center; text-align: center; padding: 0 18px; font-size: 12.5px; font-weight: 600; color: var(--blue);
  background: color-mix(in srgb, var(--blue) 8%, var(--bg)); border: 2px dashed var(--blue); border-radius: 10px; }
.fx-head .fx-scope { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-hacts { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; flex: none; }
.fx-hbtn { border: 0; background: none; font: inherit; font-size: 12px; color: var(--ink-sub); padding: 3px 7px; border-radius: 6px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.fx-hbtn:hover { background: var(--bg-tint); color: var(--ink); }
.fx-path { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 1px; padding: 7px 14px; border-bottom: 1px solid var(--line-row); }
.fx-crumb { border: 0; background: none; font: inherit; font-family: var(--mono, ui-monospace, monospace); font-size: 11.5px; color: var(--muted); padding: 1px 4px; border-radius: 5px; cursor: pointer; }
.fx-crumb:hover { color: var(--blue); background: var(--bg-tint); }
.fx-crumb-sep { font-size: 10px; color: var(--muted-2); }
/* 심링크를 타고 들어와 있으면 '진짜 어디인지'를 말한다 — 안 그러면 그 내용이 세션 폴더 안에 있는 줄 안다. */
.fx-linknote { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 11px; color: var(--muted);
  border-bottom: 1px solid var(--line-row); background: var(--bg-tint); overflow: hidden; }
.fx-linknote[hidden] { display: none; }
.fx-linknote .mono { font-family: var(--mono, ui-monospace, monospace); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.fx-link-ic { flex: none; color: var(--blue); }
.fx-scroll { flex: 1; min-height: 0; overflow: auto; padding: 6px 8px 18px; }
.fx-list { display: flex; flex-direction: column; }
/* 한 줄 = [열기 버튼(아이콘·이름·크기)] + [액션들] — 버튼 안에 버튼을 넣지 않으려고 둘로 나눈다(키보드로도 닿는다). */
.fx-row { display: flex; align-items: center; gap: 2px; border-radius: 7px; }
.fx-row:hover { background: var(--bg-tint); }
.fx-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; padding: 5px 6px; border: 0; background: none; font: inherit; font-size: 12.5px; color: var(--ink); text-align: left; cursor: pointer; }
.fx-ic { flex: none; width: 16px; text-align: center; opacity: .85; }
.fx-nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-row.is-link .fx-nm { color: var(--ink-note); }
.fx-link { flex: none; font-size: 10.5px; color: var(--blue); }
.fx-sz { margin-left: auto; flex: none; font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; color: var(--muted-2); }
.fx-acts { flex: none; display: inline-flex; align-items: center; gap: 2px; padding-right: 4px; opacity: 0; }
.fx-row:hover .fx-acts, .fx-row:focus-within .fx-acts { opacity: 1; }
.fx-act { display: inline-grid; place-items: center; width: 20px; height: 20px; border: 0; background: none; border-radius: 5px; font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; }
.fx-act:hover { background: var(--bg-punch); color: var(--ink); }
.fx-act svg { width: 13px; height: 13px; }
/* 미리보기 — 목록 자리에 제자리 전환(대시보드 폴더 위젯과 같은 문법). 정독·공유는 [⛶] 전체페이지가 맡는다. */
.fx-pbar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 0 0 8px; border-bottom: 1px solid var(--line-row); }
.fx-pname { font-size: 12px; font-weight: 700; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-pstage { padding: 10px 2px 0; }
.fx-p-img { max-width: 100%; height: auto; border-radius: 8px; }
.fx-p-pdf { width: 100%; height: 62vh; border: 1px solid var(--line); border-radius: 8px; }
.fx-p-md { font-size: 13px; line-height: 1.65; }
.fx-p-code { font-size: 11.5px; line-height: 1.55; overflow: auto; }
.fx-p-table { overflow: auto; }
.fx-p-audio, .fx-p-video { width: 100%; }
.fx-p-msg { font-size: 12.5px; color: var(--muted); line-height: 1.6; }

/* ── 우패널 타임라인(#1719) — 프로젝트·세션·워크스페이스가 같은 부품 ──
   상민님 2026-08-18: "중요한 결과·산출물만. 한 줄로 요약하고 자세한 건 눌러서.
   근데 글자가 다다다닥 붙어 있으니 뭔 소린지 못 알아듣겠다 — 차라리 이전이 나았다."
   → 한 줄 규칙은 지키되 **줄끼리 숨 쉬게** 한다: 행 높이·글자 크기를 올리고(사이드바 14px 기준),
     항목 사이를 띄우고, 장은 카드처럼 바탕을 준다. 필터 줄은 없다(애초에 남은 것만 싣는다). */
.tl-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
/* 머리 아래 한 줄 — 이 화면이 무엇을 보고 있는지의 사실(세션 상태·프로젝트·하네스). 가운데 대화창 머리와 같은 정보 층. */
.tl-facts { flex: none; padding: 8px 16px; border-bottom: 1px solid var(--line-row); }
.tl-facts[hidden] { display: none; }
.tl-scroll { flex: 1; min-height: 0; overflow: auto; padding: 10px 16px 22px; }
/* 무게가 낮아 접어 둔 것 — 지운 게 아니라 접었다는 표시(#1756). */
.tl-rest { display: flex; align-items: center; gap: 6px; width: 100%; margin: 8px 0 0; padding: 7px 10px 7px 60px; border: 0; border-radius: 8px;
  background: none; font: inherit; font-size: 11.5px; color: var(--muted); cursor: pointer; text-align: left; }
.tl-rest:hover { color: var(--ink); background: var(--bg-tint); }
.tl-scope { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 보는 차례 스위치(#1819) — 머리 바의 조용한 고스트 버튼. 개수(.v2-k)는 늘 맨 오른쪽에 있던 자리를
   지키고, 스위치가 그 왼쪽에 붙는다(사람이 이미 아는 자리를 밀어내지 않는다). */
.tl-ord { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border: 0; border-radius: 7px;
  background: none; font: inherit; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tl-ord:hover { color: var(--ink); background: var(--bg-tint); }
.tl-ord:focus-visible { outline: 2px solid var(--blue); outline-offset: -1px; }
.tl-ord-i { font-size: 10.5px; line-height: 1; color: var(--muted-3); }
.tl-ord:hover .tl-ord-i { color: var(--blue); }
.tl-wrap .v2-aside-h .tl-ord { margin-left: auto; }
.tl-wrap .v2-aside-h .tl-ord + .v2-k { margin-left: 0; }
.tl-cmp[hidden] { display: none; }
/* 간단히에서 접힌 '남은 것'의 표 — 답 줄 끝에 붙는 아주 작은 칩. 접었다는 사실과 몇 개인지를 한 자리에서 말한다
   (결과물 보기의 접힘 줄과 같은 규약: 안 보이는 것과 없는 것은 다르다). */
.tl-kidsn { flex: none; align-self: flex-start; margin-top: 1px; padding: 0 6px; border: 0; border-radius: 999px;
  background: var(--bg-tint-2); color: var(--muted); font: inherit; font-size: 10.5px; font-weight: 700;
  font-variant-numeric: tabular-nums; line-height: 18px; cursor: pointer; }
.tl-kidsn:hover { color: var(--blue); }
.tl-kidsn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

/* ── 산출물 결과 줄(#1819 안 A · 원준 2026-08-24) ─────────────────────────────────
   "눌러서 따로 볼 수 있는 것이 나왔으면 타임라인에서도 눌리게, 눈에 잘 보이게."
   답 바로 아래 한 줄씩. 34px 타일(그림이면 진짜 축소본, 아니면 종류 아이콘) + 이름 + 열기.
   ⚠ '간단히'로 접어도 이 줄은 남는다 — 접는 것은 과정이지 결과가 아니다.
   색은 토큰 직참조(폴백 금지 — 폴백 불일치가 실버그를 만든 전례가 있다). */
.tl-outs { display: flex; flex-direction: column; gap: 6px; margin-top: 7px; }
.tl-out {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 9px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
  font: inherit; text-align: left; cursor: pointer;
}
.tl-out:hover { border-color: var(--blue); background: var(--bg-tint); }
.tl-out:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.tl-out-tile {
  flex: none; width: 34px; height: 34px; border-radius: 6px; background: var(--bg-tint-2);
  display: grid; place-items: center; color: var(--blue); overflow: hidden;
}
.tl-out-tile.img { background: var(--bg); border: 1px solid var(--line); }
.tl-out-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tl-out-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tl-out-meta b {
  font-size: 12.5px; font-weight: 600; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tl-out-meta span {
  font-family: var(--mono); font-size: 10px; letter-spacing: .05em; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tl-out-go { flex: none; display: grid; place-items: center; color: var(--muted-3); }
.tl-out:hover .tl-out-go { color: var(--blue); }
.tl-wrap .v2-aside-h .v2-k { margin-left: auto; }
.tl-list { display: flex; flex-direction: column; min-height: 0; gap: 2px; }
.tl-day { display: flex; align-items: center; gap: 10px; padding: 22px 2px 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted-2); }
.tl-day:first-child { padding-top: 2px; }
.tl-day::after { content: ""; flex: 1; height: 1px; background: var(--line-row); }

/* 세로 레일 — 점이 레일 위에 얹힌다 */
/* 점과 선은 **한 좌표에서 파생**시킨다 — 따로 적어 두면 어느 한쪽만 고쳐져 어긋난다(실측: 선이 첫 점보다 2px 아래에서 시작).
   --tl-cx = 레일 기준 점 중심 x · --tl-cy = 카드 기준 점 중심 y(제목 첫 줄 한가운데) · --tl-pad = 본문 들여쓰기 */
.tl-rail { position: relative; --tl-pad: 0px; --tl-cx: 0px; --tl-cy: 0px; --tl-dot: 0px; display: flex; flex-direction: column; gap: 2px; }
.tl-card::after { content: none; }
.tl-card:first-child::after { content: none; }
.tl-card:last-child::after { content: none; }
/* 원장 행(#1756) — [시각·종류 거터 | 제목]. 색 축은 걷었다: 세로로 정렬된 모노 시각이 리듬을 만들고,
   변하는 정보(제목)만 잉크색이다. 오류만 코랄. */
.tl-card {
  position: relative; display: flex; flex-direction: row; align-items: flex-start; gap: 12px;
  background: none; border: 0; border-radius: 10px; padding: 8px 10px 8px 8px;
  text-decoration: none; color: inherit; transition: background .14s ease;
}
.tl-card + .tl-card { box-shadow: none; }
.tl-card::before { content: none; }
.tl-gut { flex: none; width: 40px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; padding-top: 2.5px; }
.tl-gut .tl-tm { font-size: 11px; letter-spacing: 0; }
.tl-kw { font-size: 10.5px; color: var(--muted-3); letter-spacing: .02em; }
.tl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tl-card.can { cursor: pointer; }
.tl-card.can:hover, .tl-card.go:hover { background: var(--bg-tint); }
.tl-card.open { background: var(--bg-tint); }
.tl-card:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.tl-head { display: flex; align-items: flex-start; gap: 8px; }
.tl-ttl {
  flex: 1; min-width: 0; font-size: 13px; line-height: 1.55; font-weight: 600; letter-spacing: -.1px;
  color: var(--ink); word-break: keep-all;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.tl-head .tl-tm { flex: none; padding-top: 2px; }
.tl-tm { font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; color: var(--muted-2); letter-spacing: -.2px; }
.tl-head .tl-face { margin-top: 1px; }
.tl-meta { display: none; }
.tl-what { min-width: 0; }
.tl-who { flex: none; }
.tl-car { flex: none; color: var(--muted-3); font-size: 13px; line-height: 1.4; transition: transform .16s ease, color .16s ease; }
.tl-card.can:hover .tl-car { color: var(--blue); }
.tl-card.open .tl-car { transform: rotate(90deg); color: var(--blue); }
.tl-x { flex: none; font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; color: var(--muted-2); padding-top: 3px; }
.tl-card.tlk-task::before, .tl-card.tlk-knowledge::before, .tl-card.tlk-file::before,
.tl-card.tlk-activity::before, .tl-card.tlk-cmd::before, .tl-card.tlk-project::before,
.tl-card.tlk-say::before, .tl-card.tlk-meta::before { content: none; }
/* ⚠ 아래는 옛 렌더러 시절 셀렉터 — 지금 안 붙지만 css-drops 게이트(HEAD 포함 검사) 때문에 남긴다. */
.tl-verb { flex: none; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tl-meta .tl-tm { margin-left: auto; }
.tl-more { flex: none; font-size: 11px; color: var(--muted-2); }
.tl-card.can:hover .tl-more { color: var(--blue); }
.tl-card.t1::before { content: none; }
.tl-card.t1.tlk-activity::before { content: none; }
.tl-card.tlk-project .tl-verb, .tl-card.tlk-knowledge .tl-verb, .tl-card .tl-verb,
.tl-card.tlk-activity .tl-verb, .tl-card.tlk-cmd .tl-verb, .tl-card.tlk-say .tl-verb, .tl-card.tlk-meta .tl-verb { color: var(--muted); }
.tl-card.tlk-meta .tl-ttl { color: var(--ink-sub); font-weight: 500; }
.tl-card.err .tl-ttl { color: var(--coral-text); }
.tl-body { display: flex; flex-direction: column; gap: 0; margin-top: 5px; padding-top: 6px; border-top: 1px solid var(--line-row); }
.tl-sub { display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 2px; border-radius: 7px; text-decoration: none; color: inherit; }
.tl-sub.go:hover { background: var(--bg-tint-2); }
.tl-sub-v { flex: none; font-size: 11px; font-weight: 600; color: var(--muted-2); min-width: 30px; }
.tl-sub-v.tlk-knowledge, .tl-sub-v.tlk-file { color: var(--muted); }
.tl-sub-t { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-sub.go:hover .tl-sub-t { color: var(--blue); }

.tl-face { margin-left: auto; }
.tl-meta .tl-who + .tl-car, .tl-meta .tl-what + .tl-car { margin-left: auto; }
.tl-car { flex: none; color: var(--muted-3); font-size: 13px; line-height: 1; transition: transform .16s ease, color .16s ease; }
.tl-card.can:hover .tl-car { color: var(--blue); }
.tl-card.open .tl-car { transform: rotate(90deg); color: var(--blue); }
.tl-x { flex: none; font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; color: var(--muted-2); padding-top: 3px; }
.tl-card.tlk-task::before { background: var(--mint-deep); }
.tl-card.tlk-knowledge::before { background: var(--teal); }
.tl-card.tlk-file::before { background: var(--mint-deep); }
.tl-card.tlk-activity::before { background: var(--blue-fill); }
.tl-card.tlk-cmd::before { background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--muted-2), 0 0 0 3px var(--bg); }
.tl-card.tlk-project::before { background: var(--blue-fill-deep); }
.tl-card.tlk-say::before, .tl-card.tlk-meta::before { background: var(--muted-3); }
/* ⚠ 아래 12줄은 main(#1756 이전 카드 디자인)에서 딸려온 죽은 규칙 — 지금 렌더러가 이 클래스를 붙이지 않는다.
   지우면 css-drops 게이트가 회귀로 잡으므로 다음 PR 에서 HEAD 정리와 함께 걷는다. */
.tl-verb { flex: none; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tl-meta .tl-tm { font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; color: var(--muted-2); margin-left: auto; }
.tl-more { flex: none; font-size: 11px; font-weight: 600; color: var(--muted-2); }
.tl-card.can:hover .tl-more { color: var(--blue); }
.tl-card.t1::before { background: var(--mint-deep); border-color: var(--mint-deep); }
.tl-card.t1.tlk-activity::before, .tl-card.t1.tlk-cmd::before, .tl-card.tlk-activity::before { background: var(--blue-fill); border-color: var(--blue); }
.tl-card.tlk-project .tl-verb { color: var(--blue-deep); }
.tl-card.tlk-knowledge .tl-verb { color: var(--teal); }
.tl-card.tlk-meta .tl-ttl { color: var(--ink-sub); font-weight: 500; }
.tl-card .tl-verb { color: var(--mint-deep); }
.tl-card.tlk-activity .tl-verb, .tl-card.tlk-cmd .tl-verb { color: var(--blue); }
.tl-card.tlk-say .tl-verb, .tl-card.tlk-meta .tl-verb { color: var(--muted); }
.tl-card.err .tl-ttl { color: var(--coral-text); }
.tl-body { display: flex; flex-direction: column; gap: 0; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line-row); }
.tl-sub { display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 2px; border-radius: 7px; text-decoration: none; color: inherit; }
.tl-sub.go:hover { background: var(--bg-tint-2); }
.tl-sub-v { flex: none; font-size: 11px; font-weight: 600; color: var(--muted-2); min-width: 30px; }
.tl-sub-v.tlk-knowledge { color: var(--teal); }
.tl-sub-v.tlk-file { color: var(--mint-deep); }
.tl-sub-t { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-sub.go:hover .tl-sub-t { color: var(--blue); }

.tl-face { width: 17px; height: 17px; border-radius: 50%; font-size: 9px; font-weight: 700; flex: none; display: inline-grid; place-items: center; color: var(--on-fill); overflow: hidden; }
.tl-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-2); flex: none; display: inline-block; }
/* ⚠ 접두어 tlk- 인 이유: 옛 발자취 CSS 에 **범위 없는** .k-file/.k-task 규칙이 살아 있어(.k-task{background:coral})
   행에 k-task 를 붙이면 행 전체가 산호색으로 칠해진다(실측). 우리 클래스는 우리 접두어를 쓴다. */
.tl-dot.tlk-file { background: var(--mint-deep); }
.tl-dot.tlk-knowledge { background: var(--teal); }
.tl-dot.tlk-activity, .tl-dot.tlk-cmd { background: var(--blue-fill); }
.tl-dot.tlk-task, .tl-dot.tlk-project { background: var(--blue-fill-deep); }
.tl-dot.tlk-source { background: var(--node-blue-soft); }

/* ── 질문·대답(#1819 원준 2026-08-21) ───────────────────────────────────────────
   타임라인은 프로젝트가 아니라 **세션**의 위젯이다. 그래서 한 항목이 아니라 **한 묶음**이 단위다:
   [질문] 내가 시킨 것 → [답] 그 답과 그때 남은 것. 묶음 안은 붙이고, 묶음끼리는 띄운다 —
   그 리듬만으로 "여기서부터 다른 얘기"가 읽히므로 구분선을 더 긋지 않는다.
   색은 전부 토큰이다(다크는 90-dark.css 가 같은 토큰을 갈아 끼운다 — 여기에 hex 를 박지 않는다). */
.tl-qa { display: flex; flex-direction: column; }
.tl-qa + .tl-qa { margin-top: 14px; }
.tl-qa .tl-card { padding-top: 6px; padding-bottom: 6px; }
/* 질문 — 잉크색 한 줄. 이 줄만 잉크고 나머지는 톤을 낮춰, 훑을 때 질문만 먼저 눈에 들어오게. */
.tl-q .tl-ttl { -webkit-line-clamp: 3; }
.tl-q .tl-kw { color: var(--muted-2); font-weight: 700; }
/* 답 — 질문 바로 아래 붙는다. 거터에 시각이 없으므로(같은 묶음이다) 종류 한 단어만 선다. */
.tl-a { padding-top: 0 !important; }
.tl-a .tl-gut { padding-top: 1px; }
.tl-a .tl-ans { font-weight: 500; color: var(--ink-sub); -webkit-line-clamp: 3; }
.tl-a.err .tl-ans { color: var(--coral-text); }
/* 붙여넣은 덩어리 — 제목으로 세우지 않고 크기만 말한다. 눌러야 전문이 나온다. */
.tl-paste { display: flex; margin: 1px 0 3px; }
.tl-paste span {
  display: inline-flex; align-items: center; max-width: 100%; padding: 1px 7px; border-radius: 999px;
  background: var(--bg-tint-2); color: var(--muted);
  font-size: 10.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
}
/* 지시 전문 — 접혀 있다가 눌러서. 원문 보관소가 아니라 확인용이라 높이를 묶어 둔다. */
.tl-full {
  margin: 6px 0 2px; padding: 8px 10px; max-height: 260px; overflow: auto;
  border-radius: 8px; background: var(--bg-tint);
  font-family: var(--mono, ui-monospace, monospace); font-size: 11px; line-height: 1.6;
  color: var(--ink-sub); white-space: pre-wrap; word-break: break-word;
}
.tl-full[hidden] { display: none; }
/* 그 지시에서 남은 것 — 답 밑에 조용히 붙는다(별도 상자를 세우지 않는다). */
.tl-kids { display: flex; flex-direction: column; gap: 0; margin-top: 2px; }
.tl-sub.err .tl-sub-t { color: var(--coral-text); }
.tl-dot.tlk-say, .tl-dot.tlk-meta { background: var(--muted-2); }
.tl-dot.tlk-all { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted-2); }
.v2-kn-foot { flex: none; margin-top: 0; padding: 14px 16px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }

/* ── 런치패드 ── */
.v2-pad { position: fixed; inset: 0; z-index: 900; background: rgba(var(--tint-ink), .28); backdrop-filter: blur(11px); display: flex; flex-direction: column; align-items: center; padding: 48px 24px; overflow: auto; }
/* 스포트라이트식 검색 한 칸(#1841) — 제목·설명 줄·닫기 버튼을 걷어내고 칸 하나만 남긴다.
   흰 판이 아니라 뒤가 비치는 유리 — 흐린 배경 위에 얹힌 한 겹이라 아이콘들과 같은 언어를 쓴다. */
.v2-pad-field { width: min(560px, 100%); height: 58px; margin-bottom: 26px; display: flex; align-items: center; gap: 12px;
  padding: 0 16px; border-radius: 16px; background: var(--v2-pad-field); border: 1px solid var(--v2-pad-field-line);
  backdrop-filter: blur(24px) saturate(1.3); box-shadow: 0 16px 44px rgba(var(--shadow-ink), .16); }
.v2-pad-mag { width: 21px; height: 21px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
/* 칸 안에 테두리를 또 두르지 않는다 — 유리판 자체가 칸이다. 늘 포커스라 포커스 링도 두지 않는다. */
input.v2-pad-search { flex: 1; min-width: 0; height: 100%; border: 0; border-radius: 0; background: none; box-shadow: none; padding: 0; font: inherit; font-size: 19px; font-weight: 500; color: var(--ink); }
input.v2-pad-search:focus { outline: none; border: 0; background: none; box-shadow: none; }
input.v2-pad-search::placeholder { color: var(--muted); font-weight: 400; }
input.v2-pad-search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.v2-pad-esc { flex: none; font: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted);
  background: rgba(var(--tint-ink), .07); border: 1px solid var(--v2-pad-field-line); border-radius: 6px; padding: 3px 7px; }
.v2-pad-grid { width: min(920px, 100%); display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.v2-pad-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; background: none; border: 0; border-radius: 18px; text-decoration: none; color: var(--ink); text-align: center; }
.v2-pad-item:hover { background: rgba(var(--tint-ink), .12); }
.v2-pad-grid--q .v2-pad-item:first-child { background: rgba(var(--tint-ink), .12); }
.v2-pad-item b { font-size: 12.5px; font-weight: 700; line-height: 1.35; }
.v2-pad-ico { width: 60px; height: 60px; display: grid; place-items: center; color: var(--ink-sub); }
.v2-pad-ico .v2-ic { width: 30px; height: 30px; }
/* 유리 앱 아이콘(#1841) — 런치패드의 배경·흐림은 그대로 두고, 카드/타일 크롬만 걷어 아이콘을 그대로 앉힌다.
   ⚠ 서리 **색**은 여기 color 로 준다: 서리의 옅은 기울기가 currentColor 를 쓰는데, 그건 그라디언트가
    얹힌 svg 자신의 color 를 보지 그 도형의 color 를 보지 않는다. 값은 90-dark.css 에서 뒤집힌다.
   ⚠ 그림자·글로우는 넣지 않는다 — 그게 '네온'이 된다(규칙 ④). */
.v2-gi { display: block; color: var(--v2-gi-frost); }
.v2-gi-frost { fill-opacity: var(--v2-gi-frost-a); }
.v2-gi-punch { fill: var(--v2-gi-punch); fill-opacity: var(--v2-gi-punch-a); }
/* 타일 배경이 없으니 유리 아이콘이 곧 타일이다 — 칸을 꽉 채운다. */
.v2-pad-ico .v2-gi { width: 60px; height: 60px; }
.v2-pad-empty { color: var(--on-fill); font-size: 13px; }
/* 세션 앱 타일(#1780) — 화면 앱과 성격이 다르다(열면 전용 AI 세션이 뜬다). 민트 강조 + 배지로 구분. */
.v2-pad-item--app { position: relative; cursor: pointer; font: inherit; }
.v2-pad-item--app:hover { background: rgba(var(--tint-ink), .12); }
.v2-pad-item--app .v2-pad-ico { color: var(--mint-deep); }
.v2-pad-badge { font-size: 9.5px; font-weight: 800; letter-spacing: .02em; color: var(--mint-deep); background: var(--bg-success); border: 1px solid var(--ok-line-2); border-radius: 999px; padding: 1px 7px; }

/* ── 앱 사용 동의 창(#1780 app-session) — 세션 앱을 처음 열 때 뜨는 권한 확인 모달 ── */
.v2-consent-ov { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(var(--shadow-ink), .32); padding: 20px; }
.v2-consent { width: min(440px, 100%); background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-2, 0 8px 30px rgba(var(--shadow-ink), .14)); padding: 22px 22px 18px; }
.v2-consent-t { margin: 0 0 6px; font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.4; }
.v2-consent-sub { margin: 0 0 16px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.v2-consent-grp { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.v2-consent-grp > b { flex: none; width: 44px; font-size: 12px; color: var(--ink-sub); }
.v2-consent-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.v2-consent-chip { font-family: var(--mono, ui-monospace, monospace); font-size: 11px; color: var(--blue); background: var(--bg-tint); border: 1px solid var(--line-net-2); border-radius: 7px; padding: 2px 8px; }
.v2-consent-chip.none { color: var(--muted); background: transparent; border-color: var(--line); font-family: inherit; }
.v2-consent-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

/* ── 앱 UI 창(#1780 PR5) — 설치된 앱의 UI 페이지를 샌드박스 iframe 으로 실는 모달 ── */
.v2-appui-ov { position: fixed; inset: 0; z-index: 88; display: grid; place-items: center; background: rgba(var(--shadow-ink), .36); padding: 24px; }
.v2-appui { width: min(960px, 100%); height: min(680px, 88vh); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-2, 0 8px 30px rgba(var(--shadow-ink), .14)); overflow: hidden; }
.v2-appui-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none; }
.v2-appui-t { font-size: 14px; font-weight: 800; color: var(--ink); }
.v2-appui-badge { font-size: 9.5px; font-weight: 800; letter-spacing: .02em; color: var(--blue); background: var(--bg-tint); border: 1px solid var(--line-net-2); border-radius: 999px; padding: 1px 7px; }
.v2-appui-spacer { flex: 1; }
.v2-appui-frame { flex: 1; width: 100%; border: 0; background: var(--surface); }

/* ── 타임라인 서랍(#1719 바탕화면 방향 1차) ─────────────────────────────────
   맥 문법(알림 센터): 홈(바탕화면)의 타임라인은 상주 열이 아니라 '불러오는 것' — 우상단 버튼으로
   우측 위에 카드로 떠오르고, 밖 클릭·Esc·화면 이동이면 물러난다. 우패널이 있는 화면(프로젝트·세션·리브)에선
   이미 열려 있으니 버튼이 숨고, 앱 프레임(no-tl)은 타임라인 자체가 없어 버튼도 없다.
   ≤900px 모바일은 자기 서랍(m-aside, 파일 끝 블록)이 맡는다 — 이 블록은 데스크톱 전용. */
@media (min-width: 901px) {
  .v2-tl-btn { position: absolute; top: 7px; right: 8px; z-index: 30; display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--muted);
    font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .v2-tl-btn:hover { color: var(--ink); border-color: var(--muted-3); }
  .v2-tl-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  #v2-root:not(.no-aside) .v2-tl-btn, #v2-root.no-tl .v2-tl-btn { display: none; }
  #v2-root.no-aside:not(.no-tl) .v2-tabs { padding-right: 112px; }   /* 탭도 [모든 탭] 끝막이도 서랍 버튼 밑으로 안 숨게 */
  #v2-root.d-aside .v2-tl-btn { color: var(--ink); background: var(--canvas); }
  #v2-root.d-aside .v2-aside { display: flex; position: fixed; top: 44px; right: 10px; bottom: 10px; z-index: 45;
    width: clamp(300px, var(--v2-aside-w, 316px), 420px); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: var(--bg); box-shadow: 0 24px 64px rgba(var(--shadow-ink), .22), 0 4px 14px rgba(var(--shadow-ink), .10);
    animation: v2-drawer-in .18s ease; }
}
@keyframes v2-drawer-in { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { #v2-root.d-aside .v2-aside { animation: none; } }

/* 901~1100px(작은 노트북 창·아이패드 가로) — 옆 두 칸을 좁힌다. ⚠ 열은 다섯(사이드바·손잡이·가운데·손잡이·우패널)이라 셋만 적으면
   가운데가 셋째 열(280px)에 앉고 우패널이 다음 줄로 떨어진다(1024px 실측 #1777 — 손잡이가 생기기 전 규칙이 남아 있었다).
   손잡이가 인라인 변수로 너비를 쥐므로 변수를 덮지 않고 min() 으로 상한만 건다(더 좁히는 건 여전히 된다). */
@media (max-width: 1100px) {
  #v2-root { grid-template-columns: min(var(--v2-side-w), 232px) 6px minmax(0, 1fr) 6px min(var(--v2-aside-w), 280px); }
  #v2-root.no-aside { grid-template-columns: min(var(--v2-side-w), 232px) 6px minmax(0, 1fr) 0 0; }
  /* 팝아웃 창은 열이 셋뿐이다(#1744) — 위 5열 규칙을 그대로 맞으면 가운데가 6px 손잡이 칸에 앉는다. */
  #v2-root.solo { grid-template-columns: minmax(0, 1fr) 6px min(var(--v2-aside-w), 280px); }
  #v2-root.solo.no-aside { grid-template-columns: minmax(0, 1fr) 0 0; }
  .v2-center { padding-left: 24px; padding-right: 24px; }
}
/* (≤900px 는 파일 끝 '모바일' 블록이 통째로 맡는다 — 종전의 '사이드바 220px + 우패널 숨김' 규칙은 #1777 에서 서랍 셸로 대체됐다.) */

/* ── 세션 우패널: 사실 한 줄 + 발자취(web/session-trail.ts) ── */
.v2-sfacts { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--ink-sub); padding: 0; }
.v2-sfacts a { color: var(--ink-sub); text-decoration: none; } .v2-sfacts a:hover { color: var(--blue); }
.v2-sfacts .sep { color: var(--muted-2); }
.tr-wrap { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.tr-sub { font-size: 11.5px; color: var(--muted); }
.tr-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.tr-chip { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 11.5px; line-height: 1; padding: 5px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink-sub); cursor: pointer; }
.tr-chip:hover { border-color: var(--line-net); color: var(--ink); }
.tr-chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tr-chip.on .tr-chip-dot { box-shadow: 0 0 0 1px var(--bg); }
.tr-chip-n { font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; opacity: .8; }
.tr-chip-dot, .tr-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; background: var(--muted-2); }
.k-file { background: var(--ink-sub); } .k-knowledge { background: var(--blue-fill); } .k-activity { background: var(--mint-deep); }
.k-project { background: var(--teal); } .k-task { background: var(--coral); } .k-source { background: var(--node-blue-soft); }
.k-all { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted-2); }
.tr-list { display: flex; flex-direction: column; gap: 2px; }
.tr-row { border-radius: 8px; }
.tr-row.open { background: var(--bg); border: 1px solid var(--line); }
.tr-row[hidden] { display: none; }
.tr-head { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; font: inherit; font-size: 12.5px; line-height: 1.45;
  padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink); cursor: pointer; }
.tr-head:hover { background: var(--bg); }
.tr-row.open > .tr-head { border-radius: 8px 8px 0 0; }
.tr-verb { color: var(--ink-sub); flex: none; }
.tr-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-weight: 600; }
.tr-x { font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; color: var(--muted); flex: none; }
.tr-st { font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; color: var(--coral-text); flex: none; }
.tr-tm { font-family: var(--mono, ui-monospace, monospace); font-size: 10.5px; color: var(--muted-2); flex: none; }
.tr-body { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
.tr-body[hidden] { display: none; }
.tr-loading { color: var(--muted); font-size: 12px; margin: 0; }
.tr-title { font-weight: 700; font-size: 13px; line-height: 1.5; }
.tr-kv, .tr-path { font-family: var(--mono, ui-monospace, monospace); font-size: 11px; color: var(--ink-sub); word-break: break-all; }
.tr-part { min-width: 0; }
.tr-cap { font-family: var(--mono, ui-monospace, monospace); font-size: 10px; letter-spacing: .04em; color: var(--muted); margin-bottom: 3px; }
.tr-pre { margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--bg-tint); border: 1px solid var(--line);
  font-family: var(--mono, ui-monospace, monospace); font-size: 11px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
.tr-md { font-size: 12.5px; line-height: 1.7; max-height: 480px; overflow: auto; }
.tr-md .md > :first-child { margin-top: 0; }
.tr-body .btn { align-self: flex-start; }

/* ═══ 모바일(≤900px, #1777 — 상민님 2026-08-19 "모바일 화면 대응, 특히 세션뷰") ═══
   세 칸 그리드 → **1열 + 서랍 둘 + 상단 바 하나**. JS 짝: web/v2/mobile.ts(같은 문턱을 matchMedia 로 본다).
   문턱 900 = 종전에 우패널을 숨기던 그 문턱이다 — 폰(≤430)만이 아니라 태블릿 세로(768~834)도 여기 든다. 사이드바 220px 를 그리드에
   남기고 우패널을 숨기던 종전 태블릿 그림은, 대화창이 좁아지고 타임라인엔 닿을 길이 없었다. 서랍 둘이면 둘 다 산다.
   원칙: 기능을 숨기지 않는다(사이드바·우패널은 서랍으로 살아 있다) · 데스크톱(>900) 그림은 한 픽셀도 안 바뀐다(전부 미디어쿼리 안) ·
   가로 스크롤은 의도한 상자(탭 줄·코드) 안에서만. 상태 = #v2-root.m-side / .m-aside(서랍 열림). */
.v2-mbar, .v2-scrim { display: none; }   /* 데스크톱엔 없다 — 그리드 열 순서에 안 낀다 */
@media (max-width: 900px) {
  /* 뿌리 — 100dvh: iOS 사파리 주소창이 접히고 펴져도 입력칸이 화면 밖으로 안 밀린다(100vh 는 주소창을 포함한 높이). */
  body[data-ui="v2"], body[data-ui="v2"] #app { height: 100dvh; }
  #v2-root, #v2-root.no-aside { display: flex; flex-direction: column; height: 100dvh; grid-template-columns: none; }
  #v2-root > .v2-split-x { display: none; }
  .v2-main { flex: 1; min-height: 0; }
  /* 상단 바 — [☰] [현재 앱 이름] [타임라인]. 상태 표시줄(노치) 아래로 내려앉는다(viewport-fit=cover 일 때만 값이 있다). */
  .v2-mbar { display: flex; align-items: center; gap: 2px; flex: none; height: 46px; padding: 0 4px; padding-top: env(safe-area-inset-top, 0px);
    box-sizing: content-box; border-bottom: 1px solid var(--line); background: var(--canvas); }
  .v2-mbar-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: 10px; background: none;
    color: var(--ink-sub); cursor: pointer; flex: none; -webkit-tap-highlight-color: transparent; }
  .v2-mbar-btn:active, .v2-mbar-btn[aria-expanded="true"] { background: var(--bg); color: var(--ink); }
  .v2-mbar-btn[hidden] { display: none; }
  .v2-mbar-ic { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .v2-mbar-slot { flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; }
  .v2-mbar-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: center; font-size: 13.5px; font-weight: 700; color: var(--ink); }
  /* 구 앱과의 하위 호환 — 새 셸은 탭 줄을 옮기지 않지만, 이전 자산이 adoptStrip 을 부르면 레이아웃은 유지한다. */
  .v2-mbar .v2-tabs { flex: 1; min-width: 0; height: 100%; padding: 0 2px; border: 0; background: none; }
  .v2-mbar .v2-tabs-scroll { gap: 2px; }
  .v2-mbar .v2-tab-menu { background: none; border-left: 0; }
  .v2-mbar .v2-tab { max-width: 172px; height: 100%; min-height: 34px; padding: 0 8px 0 11px; font-size: 13px; }
  .v2-mbar .v2-tab .x { width: 22px; height: 22px; }
  .v2-mbar .v2-tab-xic { width: 12px; height: 12px; }
  .v2-mbar .v2-tab-add { width: 32px; height: 32px; }
  /* 배경막 */
  .v2-scrim { display: block; position: fixed; inset: 0; z-index: 39; background: rgba(var(--shadow-ink), .42); }
  .v2-scrim[hidden] { display: none; }
  /* 서랍 — 사이드바(왼쪽)·우패널(오른쪽). 닫힘 = 화면 밖 + visibility:hidden(초점·스크린리더에서도 빠진다).
     900px 규칙이 우패널을 display:none 으로 껐던 것을 되살린다. no-aside 도 되살린다 — 홈이 no-aside 가 되면서(#1719
     바탕화면 1차) 모바일 홈 타임라인은 이 서랍으로만 열리기 때문(버튼 유무는 main.ts setAside 가 라우트별로 쥔다). */
  #v2-root.no-aside .v2-aside { display: flex; }
  .v2-side, .v2-aside { position: fixed; top: 0; bottom: 0; z-index: 40; width: min(86vw, 336px); max-width: 100vw; visibility: hidden;
    transition: transform .22s ease, visibility 0s linear .22s; overscroll-behavior: contain; }
  .v2-side { left: 0; transform: translateX(-100%); border-right: 0; padding-top: env(safe-area-inset-top, 0px); }
  /* ⚠ 위 서랍 규칙은 파일 뒤쪽의 .stu-side(같은 특정도, position: relative)에 뒤늦게 덮인다 —
     미디어쿼리는 특정도를 올리지 않으므로 '나중에 쓴 쪽'이 이긴다. position 이 relative 로 돌아가면
     사이드바가 흐름에 남아 세로를 통째로 먹고 본문(.v2-main)이 화면 밖으로 밀린다
     (실측 611px 폭: 사이드바 1128px · 본문 26px → 사실상 빈 화면. 곁칸 웹 칸이 늘 이 폭이다).
     클래스를 둘 겹쳐 되찾는다 — .stu-side 를 미디어쿼리 위로 옮기면 스튜디오 레이아웃이 깨진다. */
  .v2-side.stu-side { position: fixed; }
  .v2-aside { display: flex; right: 0; transform: translateX(100%); border-left: 0; padding-top: env(safe-area-inset-top, 0px); }
  #v2-root.m-side .v2-side, #v2-root.m-aside .v2-aside { transform: none; visibility: visible; transition: transform .22s ease, visibility 0s;
    box-shadow: 0 0 0 1px var(--line), 0 18px 48px rgba(var(--shadow-ink), .24); }
  .v2-side:focus, .v2-aside:focus { outline: none; }   /* 서랍 컨테이너의 프로그램 포커스(tabindex=-1)엔 링을 안 그린다 — 안의 첫 항목부터가 조작면이다 */
  .v2-side-foot { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .v2-aside-pane { padding-bottom: env(safe-area-inset-bottom, 0px); }
  /* 서랍 안 손가락 크기 — 행 44px 안팎(iOS HIG). 글자도 본문(15px)에 맞춘다. */
  .v2-side-top { padding: 12px 12px 6px; }
  .v2-liv-btn { padding: 11px 12px; font-size: 15px; }
  .v2-side-sec { padding: 12px 14px 6px 18px; }
  .v2-find-in { height: 40px; }
  .v2-pj-row { padding: 11px 10px 11px 6px; font-size: 15px; }
  .v2-pj.open > .v2-pj-row { padding: 11px 12px 8px 8px; }
  .v2-car { width: 30px; height: 30px; font-size: 17px; }
  .v2-ss-row { min-height: 42px; padding: 8px 10px 8px calc(14px + var(--nest, 14px)); font-size: 14.5px; }
  .v2-ss-row .sub { font-size: 12.5px; }
  .v2-ss-go { opacity: 1; }                       /* 호버가 없다 — 가는 길(말풍선)은 늘 보인다 */
  .v2-ss-more, .v2-tree-more, .v2-tree-note { font-size: 14px; }
  .v2-pin .v2-ss-row { min-height: 42px; }
  .v2-apps-btn { padding: 12px 12px; font-size: 15px; }
  .v2-me { padding: 8px 4px; font-size: 14.5px; }
  .v2-flt-pop { right: 0; width: min(240px, calc(100vw - 32px)); }
  .v2-fo { padding: 9px 10px; font-size: 14px; }
  .v2-ws-menu { max-width: calc(100vw - 16px); }
  /* 우패널(타임라인) 서랍 — 머리를 상단 바 높이에 맞춘다(같은 줄로 읽힌다). */
  .v2-aside > .v2-aside-pane > .tl-wrap > .v2-aside-h, .v2-aside .v2-aside-h { min-height: 46px; padding-left: 16px; }
  .tl-card { padding: 10px 8px 10px 6px; }
  .tl-ttl { font-size: 14px; }
  .tl-sub { min-height: 32px; }
  .tl-sub-t { font-size: 13.5px; }
  .tl-scroll { padding: 10px 12px calc(22px + env(safe-area-inset-bottom, 0px)); }
  /* 가운데 화면들 — 여백을 좁히고 글자는 본문 크기 유지. */
  .v2-center { padding: 18px 16px 32px; }
  .v2-title { font-size: 21px; }
  .v2-row { padding: 12px 12px; }
  .v2-home { padding: 18px 16px 16px; }
  .v2-home-launch { padding-top: clamp(16px, 6vh, 56px); }
  .v2-home-launch .v2-h1, .v2-home-sub { font-size: 24px; }
  .v2-launch { margin-top: 18px; padding: 12px 12px 10px; border-radius: 16px; }
  .v2-launch-in { min-height: 64px; }
  .v2-launch-row { flex-wrap: wrap; }
  .v2-launch-row > .v2-launch-send { margin-left: auto; height: 38px; }
  .v2-now { margin-top: 26px; }
  .v2-now-row { padding: 10px 8px; }
  .v2-now-row .tw { flex-wrap: wrap; row-gap: 2px; }
  .v2-now-row .p { max-width: 100%; }
  .v2-livpage { padding: 8px 10px 10px; }
  .v2-frame-h { flex-wrap: wrap; row-gap: 4px; padding: 8px 12px; }
  .v2-frame-sub { display: none; }              /* '클래식 화면 · 그대로 실림' — 폰에선 제목과 [새 탭] 만 남긴다 */
  /* 런치패드 — 화면 가득, 격자는 촘촘히. */
  .v2-pad { padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .v2-pad-field { height: 50px; margin-bottom: 16px; border-radius: 14px; }
  .v2-pad-grid { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; }
  .v2-pad-item { padding: 14px 10px 12px; }
  /* 프로젝트 연결 드롭다운(세션 상단바) */
  .v2-pjpick { width: min(360px, calc(100vw - 16px)); }
  .v2-pjpick-in { height: 38px; }
  .v2-pjpick-row { padding: 10px 8px; }
  /* 손잡이(경계 끌기)는 폰에 없다 */
  .v2-split { display: none; }
}

/* 콘솔에 그대로 붙여넣는 값들(콜백 주소·허용범위) — 읽으라고 두는 게 아니라 **복사하라고** 두는 자리다. */
.cn-copy { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
  background: var(--bg-sub); border-radius: 8px; padding: 8px 10px; }
.cn-copy-k { grid-column: 1 / -1; font-size: 11.5px; font-weight: 700; color: var(--muted-2); }
.cn-copy-v { white-space: pre-wrap; }
.cn-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.cn-f { display: flex; flex-direction: column; gap: 4px; }
.cn-f-k { font-size: 11.5px; font-weight: 700; color: var(--muted-2); }
.cn-in { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font-size: 13px; }
.cn-in:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cn-sum-adm b { color: var(--ink-sub); }

/* 접히는 안내 — 늘 보여야 하는 건 '콘솔에 넣을 값'이고, 읽는 절차는 처음 한 번만 필요하다. */
.cn-steps-wrap { border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--bg); }
.cn-steps-wrap[open] { padding-bottom: 10px; }
.cn-steps-sum { cursor: pointer; padding: 9px 0; font-size: 12.5px; font-weight: 700; color: var(--ink-sub); }
.cn-steps-sum::marker { color: var(--muted-2); }
.cn-steps-wrap .cn-help { margin: 2px 0 8px; }

/* ── 「정리」 모드(#1719 안 C, 원준 2026-08-24) ────────────────────────────────
   머리줄에서 「필터」 글자를 뺀 자리에 [정리]가 들어왔다. 실측: 글자 있는 필터 버튼 60px,
   아이콘 버튼 27px — 글자 하나를 내주면 넷이 되고도 머리줄이 6px 좁아진다(114 → 108). */
.v2-side-sec .v2-flt-btn { padding: 0; width: 27px; justify-content: center; }
.v2-side-sec .v2-flt-btn.has { padding: 0 6px; width: auto; }   /* 배지가 붙으면 그만큼만 늘어난다 */
/* 켜진 개수 배지 — 글자를 뺀 대신 '지금 걸러져 있다'를 이게 말한다. */
.v2-flt-n { min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px; background: var(--blue); color: #fff;
  font-size: 10px; font-weight: 700; line-height: 15px; text-align: center; font-variant-numeric: tabular-nums; }
.v2-tidyb.on { color: #fff; background: var(--blue); border-color: var(--blue); }
.v2-tidyb.on:hover { background: var(--blue-deep, var(--blue)); }

/* 고르는 줄 — 체크칸이 캐럿 앞에 선다. 켜져 있는 동안엔 hover 단추(＋·핀)를 감춘다:
   고르는 중에 눌러 세션이 열리면 그게 곧 모드에서 튕겨 나가는 사고다. */
.v2-ck { flex: none; width: 15px; height: 15px; margin-right: 1px; border: 1.6px solid var(--muted-2);
  border-radius: 4px; display: grid; place-items: center; background: var(--bg); }
.v2-ck-ic { width: 10px; height: 10px; fill: none; stroke: #fff; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.v2-pj-row.sel .v2-ck { background: var(--blue); border-color: var(--blue); }
.v2-pj-row.sel .v2-ck-ic { opacity: 1; }
.v2-pj-row.sel { background: var(--bg-tint-2); }
.v2-pj-row.v2-pick .v2-pinb, .v2-pj-row.v2-pick .v2-newb { display: none; }

/* 발치 막대 — 고른 개수와 할 일이 늘 보인다. 모드에 갇힌 느낌을 없애는 건 [끝내기]가 늘 곁에 있는 것이다. */
.v2-tidybar { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 16px;
  border-top: 1px solid var(--line); background: var(--bg-tint); }
.v2-tidybar-k { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: var(--ink-sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

/* 받은 알림(#1891) — 「확인할 것」 위 칸. 세션 줄(.v2-now-row)과 같은 골격을 쓰되 상태점만 다르다. */
.v2-noti-sec { display: block; }
.v2-noti-row .tw { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.v2-noti-row .t { font-size: 13.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v2-noti-row .p { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v2-noti-row.unread .t { font-weight: 700; }
/* 안 읽음 표식은 **점 하나**다 — 줄 전체를 물들이면 목록이 시끄러워지고, 읽은 줄이 바래 보인다. */
.v2-noti-dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; flex: none; }
.v2-noti-dot.on { background: var(--accent, #2563eb); }
.v2-noti-row .st { font-size: 12px; color: var(--muted); flex: none; }

/* 41-onboarding.css — 처음 설정(#/welcome) 화면. 프로토타입 public/onboarding-proto/v2.html 을 v2 셸 안으로 옮긴 것(#1813).
   토큰은 01-base 것만 쓴다. 클래스는 전부 ob- 접두 — 전역 .chip/.btn/.card 와 겹치지 않게. 사이드바는 실제 것(40-v2.css). */
.ob-root{ --ghost:#D5DCE8; --blue-soft:#EEF5FF; --hover:#F6FAFF; --card:#FFFFFF; --shadow:0 1px 2px rgba(21,35,59,.05), 0 4px 14px rgba(21,35,59,.07);
  display:flex; flex-direction:column; flex:1; min-height:0; height:100%; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; position:relative }
.ob-root *{box-sizing:border-box}
.ob-root button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
.ob-root input{font:inherit; color:inherit}
.ob-root b{font-weight:600}
/* ═══ 노션을 참조한 온보딩 v2 — 3막 구조 (#1813, 2026-08-24)
   막1 이름만(민낯) · 막2 왼쪽 사이드바가 유령으로 서 있고 답할수록 실체가 됨 · 막3 컨설팅이 곧 채팅.
   문구는 기존 프로토(교정 31건 반영본)에서 그대로 가져왔다 — 여기서 새로 쓴 문구는 주석에 [새문구] 표시. */


/* ── 오른쪽 본문 ─────────────────────────────────────────────── */
.ob-main{flex:1; display:flex; flex-direction:column; min-width:0; position:relative}
.ob-crumb{display:flex; align-items:center; gap:6px; padding:10px 16px; font-size:13px; color:var(--ink-sub); border-bottom:1px solid transparent; min-height:41px}
.ob-root.ob-stage-name .ob-crumb{visibility:hidden}
.ob-crumb .ob-lm{width:18px;height:18px;font-size:9px}
.ob-crumb .ob-sep{color:var(--ghost)}

/* 막1·막2 — 가운데 질문 기둥 (노션 p1~p4 참조) */
.ob-qwrap{flex:1; overflow-y:auto; display:flex; justify-content:center}
.ob-qcol{width:min(560px, 92%); padding:8vh 0 60px; animation:rise .45s ease-out}
.ob-qcol.ob-wide{width:min(820px, 94%)}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.ob-q-ic{width:40px; height:40px; border-radius:50%; background:var(--bg-success); border:1px solid #CDEFE3; display:grid; place-items:center; color:var(--mint-deep); font-size:15px; font-weight:800; margin-bottom:14px}
.ob-q-prog{display:flex; gap:4px; margin:0 0 22px; width:96px}
.ob-q-prog i{flex:1; height:3px; border-radius:2px; background:var(--ghost)}
.ob-q-prog i.ob-on,.ob-q-prog button.ob-on{background:var(--ink)}
.ob-q-lead{font-size:14px; color:var(--ink-sub); margin-bottom:8px}
.ob-q-title{font-size:26px; font-weight:700; letter-spacing:-.01em; margin-bottom:6px}
.ob-q-help{font-size:14px; color:var(--ink-sub); margin-bottom:26px}
/* 노션식 선택 카드 */
.ob-opt-cards{display:flex; flex-direction:column; gap:10px}
.ob-opt-card{display:flex; align-items:center; gap:12px; text-align:left; border:1px solid var(--line); border-radius:10px; padding:13px 15px; background:var(--card); transition:border-color .12s, box-shadow .12s}
.ob-opt-card:hover{border-color:#cfcecb; box-shadow:var(--shadow)}
.ob-opt-card.ob-on{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue)}
.ob-opt-card .ob-oc-ic{width:22px; display:grid; place-items:center; flex:0 0 22px}
.ob-blogo{width:17px; height:17px; flex:none; display:block}
.ob-opt-cards .ob-oc-ic .ob-blogo{width:20px; height:20px}
.ob-oc-st{margin-left:auto; display:grid; place-items:center; width:16px; flex:0 0 16px}
.ob-opt-card .ob-oc-t{font-weight:600; font-size:14.5px}
.ob-opt-card .ob-oc-d{display:block; font-size:12.5px; color:var(--muted); margin-top:1px}
.ob-opt-card .ob-oc-chk{margin-left:auto; width:16px; height:16px; border-radius:4px; border:1.5px solid var(--ghost); flex:0 0 16px; display:grid; place-items:center; color:#fff; font-size:10px}
.ob-opt-card.ob-on .ob-oc-chk{background:var(--blue); border-color:var(--blue)}
.ob-opt-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px; margin-bottom:10px}
.ob-opt-grid .ob-opt-card{padding:9px 11px; gap:9px}
.ob-opt-grid .ob-opt-card .ob-oc-t{font-size:13.5px}
.ob-opt-group{margin:2px 0 4px; font-size:11.5px; font-weight:600; color:var(--muted)}
.ob-q-write{display:flex; gap:8px; margin-top:12px}
.ob-q-write input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px; outline:none}
.ob-q-write input:focus{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue)}
.ob-btn{display:block; width:100%; text-align:center; border-radius:8px; padding:10px 14px; font-weight:600; font-size:14px; margin-top:18px}
.ob-btn-pri{background:var(--blue); color:#fff}
.ob-btn-pri:hover{background:#1b74cc}
.ob-btn-pri:disabled{background:var(--blue-soft); color:#9cc7ec; cursor:default}
.ob-btn-sub{background:#f1f1ef; color:var(--ink-sub); margin-top:8px}
.ob-btn-sub:hover{background:#e9e9e6}
.ob-btn-inline{width:auto; display:inline-block; padding:8px 14px}
.ob-q-skip{display:block; margin:16px auto 0; font-size:13px; color:var(--muted)}
.ob-q-skip:hover{color:var(--ink-sub); text-decoration:underline}
.ob-q-fine{margin-top:18px; font-size:12px; color:var(--muted); text-align:center}
.ob-benefit{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-sub); padding:3px 0}
.ob-benefit::before{content:''; width:5px; height:5px; border-radius:50%; background:var(--muted-2); flex:none}
.ob-benefits{margin:0 0 18px}

/* 막3 — 채팅 (노션 p5·p6 참조) */
.ob-chat{flex:1; overflow-y:auto; display:flex; justify-content:center}
.ob-thread{width:min(680px,94%); padding:26px 0 20px; display:flex; flex-direction:column; gap:14px}
.ob-msg{display:flex; gap:10px; animation:rise .35s ease-out}
.ob-msg .ob-ava{width:26px; height:26px; border-radius:50%; background:var(--bg-success); border:1px solid #CDEFE3; flex:0 0 26px; display:grid; place-items:center; color:var(--mint-deep); font-size:11px; font-weight:800; margin-top:2px}
.ob-msg .ob-body{max-width:86%; font-size:14.5px; line-height:1.65}
.ob-msg .ob-body p{margin-bottom:6px}
.ob-msg .ob-body p:last-child{margin-bottom:0}
.ob-msg.ob-user{justify-content:flex-end}
.ob-msg.ob-user .ob-body{background:#f1f1ef; border-radius:14px; padding:8px 14px; font-size:14px}
.ob-chips{display:flex; flex-wrap:wrap; gap:8px; padding-left:36px; animation:rise .35s ease-out}
.ob-chip{border:1px solid var(--line); border-radius:100px; padding:7px 14px; font-size:13.5px; font-weight:500; background:var(--card)}
.ob-chip:hover{background:var(--hover); border-color:#cfcecb}
.ob-chip.ob-cta{background:var(--blue-soft); color:var(--blue); border-color:transparent; font-weight:600}
.ob-chip.ob-cta:hover{background:#d8ebfb}
.ob-chip.ob-ghost{color:var(--ink-sub)}
.ob-tags{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px}
.ob-tag{border:1px solid var(--line); border-radius:6px; padding:3px 9px; font-size:12.5px; color:var(--ink-sub); background:var(--canvas)}
.ob-tag b{color:var(--ink); font-variant-numeric:tabular-nums}
.ob-excard{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:8px 0 0; cursor:pointer; transition:border-color .12s, box-shadow .12s; background:var(--card)}

.ob-excard .ob-xt{font-size:14px; font-weight:600; margin-bottom:5px}
.ob-excard .ob-xd{font-size:12.5px; color:var(--muted)}
.ob-excard .ob-xd b{color:var(--amber); font-weight:600}
.ob-fine{font-size:12.5px; color:var(--muted); padding-left:36px}
.ob-readline{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-sub)}
.ob-readbar{flex:0 0 120px; height:4px; border-radius:2px; background:var(--line-net); overflow:hidden}
.ob-readbar i{display:block; height:100%; background:var(--blue); width:0; transition:width .25s linear}

.ob-composer{padding:12px 0 18px; display:flex; justify-content:center; border-top:1px solid transparent}
.ob-composer-in{width:min(680px,94%); border:1.5px solid var(--blue); border-radius:14px; padding:10px 14px 8px; box-shadow:0 4px 18px rgba(35,131,226,.08)}
.ob-composer-in input{width:100%; border:0; outline:none; font-size:14.5px; padding:2px 0 8px; background:none}
.ob-composer-row{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px}
.ob-composer-row .ob-send{margin-left:auto; width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-size:12px}
.ob-composer-row .ob-send:disabled{background:var(--ghost); cursor:default}
.ob-root:not(.ob-stage-chat) .ob-composer{display:none}
.ob-chat, .ob-composer{background:var(--bg)}
.ob-root:not(.ob-stage-chat) .ob-chat{display:none}
.ob-root.ob-stage-chat .ob-qwrap{display:none}

.ob-toast{position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:var(--ink); color:#fff; border-radius:100px; padding:8px 18px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:60}
.ob-toast.ob-on{opacity:1}

/* 막1(이름) — 노션 p1 처럼 아무것도 없는 가운데 카드. 셸(사이드바·손잡이·탭 줄)을 잠깐 숨긴다. */
#v2-root.ob-bare { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
#v2-root.ob-bare .v2-side, #v2-root.ob-bare > .v2-split-x, #v2-root.ob-bare .v2-tabs, #v2-root.ob-bare .v2-tl-btn { display: none; }

/* 되돌아가기 + 파일 받는 자리 (2026-08-25 플로우 재배치 — 로컬 업로드를 앞으로, 앱 연결을 뒤로) */
.ob-q-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ob-q-back{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);padding:4px 9px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer}
.ob-q-back[hidden]{display:none}
.ob-q-back:hover{color:var(--ink);background:var(--bg-tint);border-color:var(--line)}
.ob-q-prog{gap:5px;width:118px}
.ob-q-prog button.ob-go{cursor:pointer}
.ob-q-prog button.ob-go:hover{background:var(--blue)}
.ob-drop{border:1.5px dashed var(--line-net);border-radius:14px;padding:26px 20px;text-align:center;transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.ob-drop:hover,.ob-drop.ob-over{border-color:var(--blue);background:var(--blue-soft)}
.ob-drop.ob-has{padding:18px 20px;border-style:solid}
.ob-drop-t{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.ob-drop-d{display:block;font-size:12.5px;color:var(--muted)}

/* 시연 껍데기 — 실제 셸(사이드바·탭)은 없다. 온보딩 화면만 그대로 세운다. */
html,body{height:100%;margin:0}
body{background:var(--canvas);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink)}
#demobar{position:sticky;top:0;z-index:50;background:#FFF7ED;border-bottom:1px solid #F3DCC0;color:#7A5A2E;
  font-size:13px;line-height:1.6;padding:9px 16px;text-align:center}
#demobar b{color:#5E4321}
#demobar a{color:#1E54CC;font-weight:700}
#wrap{height:calc(100% - 40px);display:flex;justify-content:center}
#app{width:min(1180px,100%);background:var(--bg);display:flex;flex-direction:column;min-height:0}

      await sleep2(300);
      const pickB3 = (id, label, dec) => {
        msgUser(label);

      chipsRow([
        { label: "\uB098\uB9CC \uBD10\uC694", cb: () => pickB3("me", "\uB098\uB9CC \uBD10\uC694", "\uB098\uB9CC \uBCF4\uB294 \uC790\uB8CC\uB85C \uBD04") },
        { label: "\uC6B0\uB9AC \uD300\uC774 \uAC19\uC774 \uBD10\uC694", cb: () => pickB3("team", "\uC6B0\uB9AC \uD300\uC774 \uAC19\uC774 \uBD10\uC694", "\uD300\uACFC \uD568\uAED8 \uBCF4\uB294 \uC790\uB8CC\uB85C \uBD04") },
        { label: "\uD68C\uC0AC\uC758 \uC5EC\uB7EC \uBD80\uC11C\uC640 \uB098\uB220\uC694", cb: () => pickB3("dept", "\uD68C\uC0AC\uC758 \uC5EC\uB7EC \uBD80\uC11C\uC640 \uB098\uB220\uC694", "\uC5EC\uB7EC \uBD80\uC11C\uC640 \uB098\uB204\uB294 \uC790\uB8CC\uB85C \uBD04") },

    if (step === "nowline") {
      await sleep2(600);
      msgLiv(`\uB9C8\uC9C0\uB9C9 \uD558\uB098\uC608\uC694.<p style="margin-top:6px"><b>\uD3C9\uC18C\uC5D0 \uC2DC\uAC04\uC744 \uAC00\uC7A5 \uB9CE\uC774 \uC4F0\uC2DC\uB294 \uC77C\uC740 \uBB34\uC5C7\uC778\uAC00\uC694?</b> \uD55C \uC8FC\uB97C \uB193\uACE0 \uBCFC \uB54C \uC81C\uC77C \uC790\uC8FC, \uC81C\uC77C \uC624\uB798 \uBD99\uC7A1\uACE0 \uACC4\uC2E0 \uC77C\uC774\uC694. \uC5EC\uAE30\uBD80\uD130 \uC81C\uAC00 \uC190\uC744 \uBCF4\uD0ED\uB2C8\uB2E4.</p>`);
      await sleep2(300);
      const pickNow = (label) => {
        msgUser(label);
        S.nowline = label;
        S.decisions.push(`\uC2DC\uAC04\uC744 \uAC00\uC7A5 \uB9CE\uC774 \uC4F0\uB294 \uC77C: ${label}`);
        doneStep("nowline");
        waitRead(token);
      };
      chipsRow(DATA.NOW_KINDS.map((t) => ({ label: t, cb: () => pickNow(t) })).concat([{ label: "\uC9C1\uC811 \uC801\uC744\uAC8C\uC694", ghost: true, cb: () => {
        msgUser("\uC9C1\uC811 \uC801\uC744\uAC8C\uC694");
        msgLiv("\uC544\uB798 \uC785\uB825\uCC3D\uC5D0 \uD55C \uC904\uB85C \uC801\uC5B4 \uC8FC\uC138\uC694.");
        armCompose("\uC608: \uB9E4\uC8FC \uC2E4\uC801 \uC790\uB8CC \uB9CC\uB4DC\uB294 \uC77C", (v) => {
          S.nowline = v;
          S.decisions.push(`\uC2DC\uAC04\uC744 \uAC00\uC7A5 \uB9CE\uC774 \uC4F0\uB294 \uC77C: ${v}`);
          doneStep("nowline");
          waitRead(token);
        });
      } }, { label: "\uC9C0\uAE08\uC740 \uAC74\uB108\uB6F0\uAE30", ghost: true, cb: () => {
        msgUser("\uC9C0\uAE08\uC740 \uAC74\uB108\uB6F0\uAE30");
        doneStep("nowline");
        waitRead(token);
      } }]));
    }
    if (step === "can") {
      await sleep2(500);
      const C = canOf();
      const readN = realTotal();
      msgLiv(`${readN ? `\uC790\uB8CC <b>${readN}\uAC74</b>\uC744 \uB2E4 \uC77D\uC5C8\uC5B4\uC694.` : "\uC900\uBE44\uB410\uC5B4\uC694."}${S.nowline ? ` <b>${esc(S.nowline)}</b>\uC5D0 \uC2DC\uAC04\uC744 \uC81C\uC77C \uB9CE\uC774 \uC4F0\uC2E0\uB2E4\uACE0 \uD558\uC168\uC8E0.` : nick() ? ` ${esc(nick())}\uB2D8\uC774 \uD558\uC2DC\uB294 \uC77C\uC774\uB77C\uBA74,` : ""}
        <p style="margin-top:6px"><b>\uC774\uB7F0 \uAC83\uAE4C\uC9C0 \uC800\uD55C\uD14C \uB9E1\uAE30\uC2E4 \uC218 \uC788\uC5B4\uC694.</b> \uBCF4\uD1B5\uC740 \uBA87 \uBC88\uC529 \uC654\uB2E4 \uAC14\uB2E4 \uD574\uC57C \uD558\uB294 \uC77C\uC774\uC5D0\uC694. \uC5EC\uAE30\uC11C\uB294 \uD55C \uBB38\uC7A5\uC774\uBA74 \uB429\uB2C8\uB2E4.</p>
        <div class="ob-excard" data-ex="0"><div class="ob-xt">\u201C${esc(C[0][0])}\u201D</div><div class="ob-xd"><b>\uBCF4\uD1B5\uC740</b> ${esc(C[0][1])}</div></div>
        <div class="ob-excard" data-ex="1"><div class="ob-xt">\u201C${esc(C[1][1])}\u201D</div><div class="ob-xd"><b>${esc(C[1][0])} \uCABD\uB3C4</b> \uC774\uB7F0 \uAC83\uAE4C\uC9C0 \uC774\uC5B4\uC11C \uBB3C\uC73C\uC2E4 \uC218 \uC788\uC5B4\uC694.</div></div>`);
      $$(".ob-excard").forEach((c) => c.onclick = () => {
        if (c.dataset.taken) return;
        c.dataset.taken = "1";
        const t = $(".ob-xt", c).textContent.replace(/^“|”$/g, "");
        msgUser(t);
        S.firstOrder = t;
        S.decisions.push(`\uCCAB \uC9C0\uC2DC: ${t.slice(0, 40)}\u2026`);
        save();
        renderSB();
        msgLiv("\uC801\uC5B4 \uB480\uC5B4\uC694. \uC815\uB9AC\uAC00 \uB05D\uB098\uBA74 \uD648\uC5D0\uC11C \uC774 \uBB38\uC7A5\uC73C\uB85C \uBC14\uB85C \uC2DC\uC791\uD558\uC2E4 \uC218 \uC788\uC5B4\uC694. \uB2E4 \uB410\uC73C\uBA74 \uC544\uB798 <b>\uC900\uBE44 \uB05D, \uC815\uB9AC\uD574 \uC8FC\uC138\uC694</b>\uB97C \uB20C\uB7EC \uC8FC\uC138\uC694.");
      });
      await sleep2(400);
      chipsRow([{ label: "\uC900\uBE44 \uB05D, \uC815\uB9AC\uD574 \uC8FC\uC138\uC694", cta: true, cb: async (l) => {
        msgUser(l);
        doneStep("can");
        S.scene = "done";
        save();
        renderSB();
        const m = msgLiv("\uC815\uB9AC\uD558\uACE0 \uC788\uC5B4\uC694.");
        let applied = null;
        try {
          applied = await api("/api/ui/me/welcome", { method: "POST", body: JSON.stringify({
            name: S.nameSet ? S.name : null,
            stage: S.stage || null,
            job: S.job || null,
            drawers: (S.drawers || []).map((d) => ({ name: d.name, why: d.why || null })),
            cadence: S.b2 || null,
            share: S.b3 || null,
            nowline: S.nowline || null,
            first_order: S.firstOrder || null
          }) });
        } catch (e) {
          m.querySelector(".ob-body").innerHTML = `\uC815\uB9AC\uD558\uB2E4 \uB9C9\uD614\uC5B4\uC694 \u2014 ${esc(e && e.message ? e.message : "\uC54C \uC218 \uC5C6\uB294 \uC624\uB958")}<p style="margin-top:6px">\uD648\uC5D0\uC11C \uC774\uC5B4\uC11C \uD558\uC2E4 \uC218 \uC788\uC2B5\uB2C8\uB2E4.</p>`;
          await sleep2(1200);
          location.hash = "#/";
          return;
        }
        try {
          localStorage.setItem(DONE_KEY, "1");
        } catch (e) {
        }
        ctx.onDone && ctx.onDone();
        const made = applied && applied.created || [];
        m.querySelector(".ob-body").innerHTML = made.length ? `\uC815\uB9AC\uD588\uC5B4\uC694. \uC790\uB8CC\uD568\uC5D0 <b>${made.map((x) => esc(x)).join(" \xB7 ")}</b> \uC11C\uB78D\uC744 \uB9CC\uB4E4\uC5B4 \uB480\uC2B5\uB2C8\uB2E4. \uC6CC\uD06C\uC2A4\uD398\uC774\uC2A4\uB85C \uBAA8\uC2DC\uACA0\uC2B5\uB2C8\uB2E4.` : "\uC815\uB9AC\uD588\uC5B4\uC694. \uC6CC\uD06C\uC2A4\uD398\uC774\uC2A4\uB85C \uBAA8\uC2DC\uACA0\uC2B5\uB2C8\uB2E4.";
        scrollChat();
        await sleep2(1100);
        location.hash = "#/";
      } }]);
      fineRow("\uC9C0\uAE08 \uC2DC\uD0A4\uC9C0 \uC54A\uC73C\uC154\uB3C4 \uB429\uB2C8\uB2E4. \uD648\uC5D0\uC11C \uC5B8\uC81C\uB4E0 \uADF8\uB300\uB85C \uB9D0\uC500\uD558\uC2DC\uBA74 \uB3FC\uC694.");
    }
  }
  function waitRead(token) {
    if (S.read.finished) {
      chatStep("can", token);
      return;
    }
    const m = msgLiv(`<div class="ob-readline"><span>\uC790\uB8CC\uB97C \uC77D\uACE0 \uC788\uC5B4\uC694.</span><span class="ob-readbar"><i></i></span><span id="readN">${S.read.done} / ${S.read.total}</span></div>`);
    readBarEl = $(".ob-readbar i", m);
    readNEl = $("#readN", m);
    readBarEl.style.width = Math.round(100 * S.read.done / Math.max(1, S.read.total)) + "%";
    document.addEventListener("read-done", () => {
      setTimeout(() => chatStep("can", token), 400);
    }, { once: true });
  }
  async function enterChat(token) {
    setStage("stage-chat");
    $("#thread").innerHTML = "";
    await loadWelcome();
    S.read.total = Math.max(S.upN || 0, 0);
    startReading();
    await sleep2(300);
    const n = S.read.total;
    msgLiv(`${nick() ? esc(nick()) + "\uB2D8, " : ""}\uC5F0\uACB0\uAE4C\uC9C0 \uB05D\uB0AC\uC5B4\uC694.` + (n ? `<p style="margin-top:6px">\uC9C0\uAE08 \uC790\uB8CC <b>${n}\uAC74</b>\uC744 \uC77D\uACE0 \uC788\uC5B4\uC694. \uC77D\uB294 \uB3D9\uC548 \uBA87 \uAC00\uC9C0\uB9CC \uD655\uC778\uD560\uAC8C\uC694.</p>` : `<p style="margin-top:6px">\uBA87 \uAC00\uC9C0\uB9CC \uD655\uC778\uD558\uACE0 \uBC14\uB85C \uC2DC\uC791\uD560\uAC8C\uC694.</p>`));
    chatStep("b1", token);
  }
  function renderScene(key, animate) {
    const sc = SCENES[key];
    if (!sc) return;
    setStage(key === "name" ? "stage-name" : "stage-q");
    const col = $("#qcol");
    col.style.animation = "none";
    if (animate !== false) {
      void col.offsetWidth;
      col.style.animation = "";
    }
    col.classList.toggle("ob-wide", key === "sources");
    col.innerHTML = sc.html();
    syncBack();
    $$("[data-jump]", col).forEach((b) => b.onclick = () => goJump(b.dataset.jump));
    sc.bind && sc.bind(col);
  }
  const SCENE_LABEL = {
    name: "\uC774\uB984",
    stage: "\uBB34\uB300",
    role: "\uC9C1\uBB34",
    files: "\uD30C\uC77C \uC62C\uB9AC\uAE30",
    sources: "\uC571 \uACE0\uB974\uAE30",
    connect: "\uC571 \uC5F0\uACB0",
    ai: "AI \uACE0\uB974\uAE30",
    claude: "AI \uC5F0\uACB0",
    terminal: "\uD130\uBBF8\uB110",
    app: "\uC571 \uBC1B\uAE30"
  };
  function goBack() {
    const prev = S.trail.pop();
    if (!prev) return;
    save();
    goScene(prev, { back: true });
  }
  function goJump(key) {
    const i = S.trail.indexOf(key);
    if (i < 0) return goScene(key);
    S.trail = S.trail.slice(0, i);
    save();
    goScene(key, { back: true });
  }
  function syncBack() {
    const b = $("#obBack");
    if (!b) return;
    b.hidden = !S.trail.length;
    b.onclick = () => goBack();
  }
  function goScene(key, opts) {
    if (!(opts && opts.back) && S.scene && S.scene !== key && STEP_OF[key] != null) S.trail.push(S.scene);
    S.scene = key;
    save();
    renderSB();
    seqToken++;
    if (STEP_OF[key] >= CHAT_FROM) {
      S.trail = [];
      save();
      replayChatTo(key, seqToken);
    } else {
      renderScene(key, true);
    }
    syncBack();
  }
  function replayChatTo(key, token) {
    setStage("stage-chat");
    $("#thread").innerHTML = "";
    if (!S.nameSet) {
      S.name = "\uC6D0\uC900";
      S.nameSet = true;
    }
    S.stage = S.stage || "company";
    S.job = S.job || stageOf().opts[1][0];
    if (!S.sources.length) S.sources = ["gdrive", "notion"];
    if (!S.connected.length) S.connected = S.sources.filter((x) => x !== "none");
    S.ai = S.ai || "Claude";
    S.aiConnected = S.ai !== "\uC544\uC9C1 \uC5C6\uC5B4\uC694";
    S.terminal = S.terminal || "no";
    S.app = S.app || "web";
    if (!S.read.total) S.read.total = 41;
    const past = [];
    const target = key === "read" ? "b1" : key;
    const upto = CHAT_STEPS.indexOf(target);
    if (key !== "read" && upto > 0) {
      if (upto > CHAT_STEPS.indexOf("b1")) {
        past.push([`\uC790\uB8CC\uD568\uC744 \uC774\uB807\uAC8C \uB098\uB220 \uB458\uAE4C\uC694?`, "\uB124, \uC774\uB300\uB85C \uB098\uB220 \uC8FC\uC138\uC694"]);
        S.drawersOn = true;
      }
      if (upto > CHAT_STEPS.indexOf("b2")) past.push([`\uC815\uD574\uC9C4 \uC8FC\uAE30\uB85C \uB9CC\uB4DC\uC2DC\uAC70\uB098 \uB9CC\uB4E4\uACE0 \uC2F6\uC73C\uC2E0 \uBB38\uC11C\uAC00 \uC788\uB098\uC694?`, S.b2 === "week" ? "\uB124, \uB9E4\uC8FC" : S.b2 === "no" ? "\uC544\uB2C8\uC694" : "\uB124, \uB9E4\uB2EC"]);
      if (upto > CHAT_STEPS.indexOf("b3")) past.push([`\uAC19\uC774 \uBCF4\uB294 \uD300\uC774 \uC788\uB098\uC694?`, S.b3 === "me" ? "\uB098\uB9CC \uBD10\uC694" : "\uC6B0\uB9AC \uD300\uC774 \uAC19\uC774 \uBD10\uC694"]), S.b3 = S.b3 || "team";
      if (upto > CHAT_STEPS.indexOf("nowline")) {
        S.nowline = S.nowline || DATA.NOW_KINDS[2];
        past.push([`\uD3C9\uC18C\uC5D0 \uC2DC\uAC04\uC744 \uAC00\uC7A5 \uB9CE\uC774 \uC4F0\uC2DC\uB294 \uC77C\uC740 \uBB34\uC5C7\uC778\uAC00\uC694?`, S.nowline]);
      }
      Object.assign(S.read, { done: S.read.total, finished: true });
      S._counts = {};
      realKinds().forEach((k) => {
        S._counts[k.name] = k.n || "";
      });
    }
    save();
    renderSB();
    if (key === "read") {
      enterChat(token);
      return;
    }
    past.forEach(([q, a]) => {
      msgLiv(`<b>${esc(q)}</b>`);
      msgUser(a);
    });
    if (!S.read.finished) startReading();
    chatStep(target, token);
  }
  $("#composeGo").onclick = composeSend;
  $("#composeIn").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) composeSend();
  });
  const want = new URLSearchParams(location.search).get("scene") || new URLSearchParams(location.hash.split("?")[1] || "").get("scene");
  if (want && STEP_OF[want] != null) {
    goScene(want);
  } else {
    renderSB();
    goScene(S.scene || "name");
  }
  return { destroy() {
    clearInterval(readTimer);
    clearTimeout(toastT);
    ctx.onBare && ctx.onBare(false);
  } };
}
