<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
<title>Lively 처음 3분 (v2)</title>
<style>
/* ═══ 노션을 참조한 온보딩 v2 — 3막 구조 (#1813, 2026-08-24)
   막1 이름만(민낯) · 막2 왼쪽 사이드바가 유령으로 서 있고 답할수록 실체가 됨 · 막3 컨설팅이 곧 채팅.
   문구는 기존 프로토(교정 31건 반영본)에서 그대로 가져왔다 — 여기서 새로 쓴 문구는 주석에 [새문구] 표시. */
:root{
  /* 라이블리 01-base.css 토큰 그대로 — 사이드바가 실제 앱과 같아 보여야 한다(원준님 2026-08-24) */
  --bg:#FFFFFF; --bg-tint:#F6FAFF; --bg-success:#F3FBF8; --canvas:#E6EBF3;
  --blue:#2D6BF0; --blue-deep:#1E54CC; --mint-deep:#0FA37E; --amber:#C98A16;
  --ink:#15233B; --ink-sub:#5A6B85; --muted:#8A99B5; --muted-2:#A6B2C8;
  --line:#E6ECF5; --line-net:#DCE6F5; --ghost:#D5DCE8;
  --blue-soft:#EEF5FF; --hover:#F6FAFF; --card:#FFFFFF;
  --shadow:0 1px 2px rgba(21,35,59,.05), 0 4px 14px rgba(21,35,59,.07);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;
  color:var(--ink); background:var(--bg); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input{font:inherit; color:inherit}
b{font-weight:600}
.app{display:flex; height:100vh; overflow:hidden}

/* ── 왼쪽 사이드바 — 실제 앱 v2 셸(40-v2.css)을 그대로 옮김: 마크+스위처 / 리브 / 프로젝트 트리 / 앱·내 계정.
   온보딩이 채우는 것도 실제 문법으로 — 리브가 벌인 일이 '처음 설정' 카드 안 세션 행(상태점)으로 쌓인다. ── */
.sb{width:292px; flex:0 0 292px; background:var(--canvas); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:0; overflow-y:auto;
  transition:margin-left .5s cubic-bezier(.22,.8,.3,1), opacity .5s;}
body.stage-name .sb{margin-left:-292px; opacity:0}   /* 막1: 사이드바 없음 */
.v2-side-top{padding:12px 8px 6px; display:flex; align-items:center; gap:10px}
.v2-mark{flex:none; width:30px; height:30px; border-radius:9px; background:var(--ink); display:grid; place-items:center}
.v2-mark-dot{width:9px; height:9px; border-radius:50%; background:var(--mint-deep); display:block}
.v2-ws{flex:1; min-width:0; display:flex; align-items:center; gap:7px; padding:5px 7px; border:1px solid transparent; border-radius:8px; text-align:left}
.v2-ws:hover{background:var(--bg); border-color:var(--line)}
.v2-ws-name{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:700; color:var(--ink)}
.v2-ws-badge{flex:none; font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.04em; font-weight:700; padding:1px 5px; border-radius:5px; color:var(--mint-deep); background:var(--bg-success); border:1px solid #CDEFE3}
.v2-ws-car{font-size:10px; color:var(--muted-2); flex:none}
.v2-liv-btn{margin:4px 8px 2px; display:flex; align-items:center; gap:12px; padding:8px 10px 8px 9px; min-height:34px; border-radius:9px; border:1px solid transparent; font-weight:700; font-size:14px; color:var(--ink)}
.v2-liv-btn.on{background:var(--bg); border-color:#CDEFE3}
.lm{width:26px; height:26px; border-radius:50%; background:var(--bg-success); border:1px solid #CDEFE3; display:grid; place-items:center; color:var(--mint-deep); font-weight:800; font-size:11px; flex:none}
.v2-liv-btn .sub{margin-left:auto; font-size:11px; font-weight:600; color:var(--muted)}
.v2-side-sec{padding:14px 8px 4px 16px; display:flex; align-items:center; gap:2px; min-height:30px}
.v2-k{flex:1; min-width:0; font-size:11px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.v2-mini{flex:none; display:inline-grid; place-items:center; min-width:27px; height:27px; padding:0 7px; border-radius:7px; color:var(--muted); font-size:12px; font-weight:700}
.v2-tree{flex:1; min-height:0; padding:2px 8px 14px}
/* 열린 프로젝트 = 흰 카드 (실제 앱 안 1 '방') */
.v2-pj{margin-top:2px}
.v2-pj.open{background:var(--bg); border:1px solid var(--line-net); border-radius:10px; margin-top:8px}
.v2-pj-row{display:flex; align-items:center; gap:6px; padding:7px 9px 7px 7px; min-height:34px; font-size:14px; font-weight:700; color:var(--ink)}
.v2-pj-row.dim{opacity:.8}
.v2-pj-ic{width:16px; height:16px; flex:none; fill:none; stroke:var(--muted-2); stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round}
.v2-pj-row .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.v2-pj-when{font-size:11px; font-variant-numeric:tabular-nums; color:var(--muted); flex:none; margin-left:8px}
.v2-ss-list{padding:0 9px 6px 0}
.v2-ss{position:relative; display:flex; align-items:center; padding:6px 9px 6px 5px; margin-left:7px; border-radius:7px; font-size:13px; font-weight:500; color:var(--ink-sub); min-height:30px}
.v2-ss .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.v2-ss .n{font-family:ui-monospace,monospace; font-size:11px; color:var(--muted); flex:none; margin-left:8px; font-variant-numeric:tabular-nums}
.v2-ss-main{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.35}
.v2-ss-main .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.v2-ss-main .sub{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.v2-sums{display:inline-flex; align-items:center; gap:8px; margin-left:8px}
.v2-sum{display:inline-flex; align-items:center; gap:4px; font-family:ui-monospace,monospace; font-size:11px; font-weight:600; color:var(--muted)}
.v2-sum.wait{color:var(--amber)} .v2-sum.busy{color:var(--blue)} .v2-sum.done{color:var(--mint-deep)}
.v2-car{width:16px; color:var(--muted-2); font-size:14px; transform:rotate(90deg); flex:none; text-align:center}
.v2-dot.idle{background:var(--muted-2)}
.v2-tree-note{font-size:12.5px; color:var(--muted); line-height:1.6; margin:0; padding:8px 8px}
/* 상태점 — 실제 앱 어휘: 작업 중(파랑 맥동)·확인 필요(호박)·완료(민트) */
.v2-dot{width:6px; height:6px; border-radius:50%; flex:none; margin:0 9px 0 5px; box-sizing:border-box}
.v2-dot.busy{background:var(--blue); animation:v2pulse 1.1s ease-in-out infinite}
.v2-dot.wait{background:var(--amber); box-shadow:0 0 0 2.5px rgba(201,138,22,.22)}
.v2-dot.done{background:var(--mint-deep); box-shadow:0 0 0 2.5px rgba(15,163,126,.22)}
.v2-dot.off{background:transparent; box-shadow:inset 0 0 0 1.5px var(--muted-2)}
@keyframes v2pulse{50%{opacity:.35}}
/* 유령(스켈레톤) — 아직 실체가 안 된 자리 */
.gh{display:flex; align-items:center; gap:9px; padding:9px 10px}
.gh i{display:block; height:9px; border-radius:4px; background:var(--ghost); animation:gh 1.8s ease-in-out infinite}
.gh .d{width:6px; height:6px; border-radius:50%; flex:0 0 6px; background:var(--ghost); animation:gh 1.8s ease-in-out infinite}
@keyframes gh{0%,100%{opacity:.5}50%{opacity:1}}
.born{animation:born .7s ease-out}
@keyframes born{0%{background:var(--blue-soft)}100%{}}
.v2-side-foot{padding:8px 8px 10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px}
.v2-apps-btn{display:flex; align-items:center; gap:12px; width:100%; padding:8px 10px 8px 9px; min-height:34px; border-radius:9px; border:1px solid var(--line); background:var(--bg); font-size:13px; font-weight:700; color:var(--ink)}
.v2-apps-btn .cnt{margin-left:auto; font-family:ui-monospace,monospace; font-size:11px; color:var(--muted-2)}
.v2-me{display:flex; align-items:center; gap:12px; padding:4px 10px; min-height:34px; font-size:13px; color:var(--ink-sub)}
.v2-ava{width:26px; height:26px; border-radius:50%; background:var(--blue); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:700; flex:none}
.v2-me-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.v2-out{font-size:12px; color:var(--muted)}

/* ── 오른쪽 본문 ─────────────────────────────────────────────── */
.main{flex:1; display:flex; flex-direction:column; min-width:0; position:relative}
.crumb{display:flex; align-items:center; gap:6px; padding:10px 16px; font-size:13px; color:var(--ink-sub); border-bottom:1px solid transparent; min-height:41px}
body.stage-name .crumb{visibility:hidden}
.crumb .lm{width:18px;height:18px;font-size:9px}
.crumb .sep{color:var(--ghost)}

/* 막1·막2 — 가운데 질문 기둥 (노션 p1~p4 참조) */
.qwrap{flex:1; overflow-y:auto; display:flex; justify-content:center}
.qcol{width:min(560px, 92%); padding:8vh 0 60px; animation:rise .45s ease-out}
.qcol.wide{width:min(820px, 94%)}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.q-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.q-back{font-size:13px;font-weight:600;color:var(--muted);padding:5px 10px;border-radius:8px;border:1px solid transparent;order:-1}
.q-back:hover{color:var(--ink);background:var(--tint,#F6FAFF);border-color:var(--line)}
.q-prog button.go{border:0;padding:0;cursor:pointer}
.q-prog button.go:hover{background:var(--blue)}
/* 파일 받는 자리 */
.drop{border:1.5px dashed var(--line-net);border-radius:14px;padding:26px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop.has{padding:18px 20px;border-style:solid}
.drop-t{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.drop-d{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.drop-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.drop-f{font-size:12px;color:var(--ink-sub);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-ic{width:40px; height:40px; border-radius:50%; background:var(--bg-success); border:1px solid #CDEFE3; display:grid; place-items:center; color:var(--mint-deep); font-size:15px; font-weight:800}
.q-prog{display:flex; gap:5px; margin:0 0 22px; width:118px}
.q-prog i,.q-prog button{flex:1; height:3px; border-radius:2px; background:var(--ghost); border:0; padding:0}
.q-prog i.on,.q-prog button.on{background:var(--ink)}
.q-lead{font-size:14px; color:var(--ink-sub); margin-bottom:8px}
.q-title{font-size:26px; font-weight:700; letter-spacing:-.01em; margin-bottom:6px}
.q-help{font-size:14px; color:var(--ink-sub); margin-bottom:26px}
/* 노션식 선택 카드 */
.opt-cards{display:flex; flex-direction:column; gap:10px}
.opt-card{display:flex; align-items:center; gap:12px; text-align:left; border:1px solid var(--line); border-radius:10px; padding:13px 15px; background:var(--card); transition:border-color .12s, box-shadow .12s}
.opt-card:hover{border-color:#cfcecb; box-shadow:var(--shadow)}
.opt-card.on{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue)}
.opt-card .oc-ic{width:22px; display:grid; place-items:center; flex:0 0 22px}
.blogo{width:17px; height:17px; flex:none; display:block}
.opt-cards .oc-ic .blogo{width:20px; height:20px}
.oc-st{margin-left:auto; display:grid; place-items:center; width:16px; flex:0 0 16px}
.opt-card .oc-t{font-weight:600; font-size:14.5px}
.opt-card .oc-d{display:block; font-size:12.5px; color:var(--muted); margin-top:1px}
.opt-card .oc-chk{margin-left:auto; width:16px; height:16px; border-radius:4px; border:1.5px solid var(--ghost); flex:0 0 16px; display:grid; place-items:center; color:#fff; font-size:10px}
.opt-card.on .oc-chk{background:var(--blue); border-color:var(--blue)}
.opt-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px; margin-bottom:10px}
.opt-grid .opt-card{padding:9px 11px; gap:9px}
.opt-grid .opt-card .oc-t{font-size:13.5px}
.opt-group{margin:2px 0 4px; font-size:11.5px; font-weight:600; color:var(--muted)}
.q-write{display:flex; gap:8px; margin-top:12px}
.q-write input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px; outline:none}
.q-write input:focus{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue)}
.btn{display:block; width:100%; text-align:center; border-radius:8px; padding:10px 14px; font-weight:600; font-size:14px; margin-top:18px}
.btn-pri{background:var(--blue); color:#fff}
.btn-pri:hover{background:#1b74cc}
.btn-pri:disabled{background:var(--blue-soft); color:#9cc7ec; cursor:default}
.btn-sub{background:#f1f1ef; color:var(--ink-sub); margin-top:8px}
.btn-sub:hover{background:#e9e9e6}
.btn-inline{width:auto; display:inline-block; padding:8px 14px}
.q-skip{display:block; margin:16px auto 0; font-size:13px; color:var(--muted)}
.q-skip:hover{color:var(--ink-sub); text-decoration:underline}
.q-fine{margin-top:18px; font-size:12px; color:var(--muted); text-align:center}
.benefit{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-sub); padding:3px 0}
.benefit::before{content:''; width:5px; height:5px; border-radius:50%; background:var(--muted-2); flex:none}
.benefits{margin:0 0 18px}

/* 막3 — 채팅 (노션 p5·p6 참조) */
.chat{flex:1; overflow-y:auto; display:flex; justify-content:center}
.thread{width:min(680px,94%); padding:26px 0 20px; display:flex; flex-direction:column; gap:14px}
.msg{display:flex; gap:10px; animation:rise .35s ease-out}
.msg .ava{width:26px; height:26px; border-radius:50%; background:var(--bg-success); border:1px solid #CDEFE3; flex:0 0 26px; display:grid; place-items:center; color:var(--mint-deep); font-size:11px; font-weight:800; margin-top:2px}
.msg .body{max-width:86%; font-size:14.5px; line-height:1.65}
.msg .body p{margin-bottom:6px}
.msg .body p:last-child{margin-bottom:0}
.msg.user{justify-content:flex-end}
.msg.user .body{background:#f1f1ef; border-radius:14px; padding:8px 14px; font-size:14px}
.chips{display:flex; flex-wrap:wrap; gap:8px; padding-left:36px; animation:rise .35s ease-out}
.chip{border:1px solid var(--line); border-radius:100px; padding:7px 14px; font-size:13.5px; font-weight:500; background:var(--card)}
.chip:hover{background:var(--hover); border-color:#cfcecb}
.chip.cta{background:var(--blue-soft); color:var(--blue); border-color:transparent; font-weight:600}
.chip.cta:hover{background:#d8ebfb}
.chip.ghost{color:var(--ink-sub)}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px}
.tag{border:1px solid var(--line); border-radius:6px; padding:3px 9px; font-size:12.5px; color:var(--ink-sub); background:var(--canvas)}
.tag b{color:var(--ink); font-variant-numeric:tabular-nums}
.excard{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:8px 0 0; cursor:pointer; transition:border-color .12s, box-shadow .12s; background:var(--card)}
.excard:hover{border-color:#cfcecb; box-shadow:var(--shadow)}
.excard .xt{font-size:14px; font-weight:600; margin-bottom:5px}
.excard .xd{font-size:12.5px; color:var(--muted)}
.excard .xd b{color:var(--amber); font-weight:600}
.fine{font-size:12.5px; color:var(--muted); padding-left:36px}
.readline{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-sub)}
.readbar{flex:0 0 120px; height:4px; border-radius:2px; background:var(--line-net); overflow:hidden}
.readbar i{display:block; height:100%; background:var(--blue); width:0; transition:width .25s linear}

/* 채팅 입력 (노션 'Describe your own' 참조) */
.composer{padding:12px 0 18px; display:flex; justify-content:center; border-top:1px solid transparent}
.composer-in{width:min(680px,94%); border:1.5px solid var(--blue); border-radius:14px; padding:10px 14px 8px; box-shadow:0 4px 18px rgba(35,131,226,.08)}
.composer-in input{width:100%; border:0; outline:none; font-size:14.5px; padding:2px 0 8px; background:none}
.composer-row{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px}
.composer-row .send{margin-left:auto; width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-size:12px}
.composer-row .send:disabled{background:var(--ghost); cursor:default}
body:not(.stage-chat) .composer{display:none}
.chat, .composer{background:var(--bg)}
body:not(.stage-chat) .chat{display:none}
body.stage-chat .qwrap{display:none}

/* 프로토타입 컨트롤 */
.proto{position:fixed; right:14px; bottom:14px; z-index:50; font-size:12px}
.proto-btn{background:var(--ink); color:#fff; border-radius:100px; padding:7px 13px; font-weight:600; font-size:11px; letter-spacing:.04em; box-shadow:var(--shadow)}
.proto-menu{position:absolute; right:0; bottom:38px; width:300px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; box-shadow:0 8px 30px rgba(15,15,15,.14)}
.proto-menu .k{display:block; margin:2px 4px 7px; font-size:11px; font-weight:600; color:var(--muted)}
.proto-scenes{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:8px}
.proto-scenes button{border:1px solid var(--line-net); border-radius:7px; padding:5px 7px; font-size:10.5px; font-weight:600; color:var(--ink-sub); text-align:left; line-height:1.3}
.proto-scenes button i{display:block; font-style:normal; font-size:9px; color:var(--muted)}
.proto-scenes button:hover{background:var(--hover)}
.proto-scenes button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.proto-scenes button.on i{color:rgba(255,255,255,.6)}
.proto-reset{width:100%; border:1px solid var(--line); border-radius:8px; padding:6px; font-size:11.5px; font-weight:600; color:var(--ink-sub)}
.proto-reset:hover{background:var(--hover)}

.toast{position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:var(--ink); color:#fff; border-radius:100px; padding:8px 18px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:60}
.toast.on{opacity:1}
@media (max-width:760px){ .sb{display:none} }
</style>
</head>
<body class="stage-name">
<div class="app">
  <aside class="sb" id="sb"></aside>
  <div class="main">
    <div class="crumb" id="crumb"><span class="lm">L</span><span style="font-weight:600">리브</span><span class="sep">/</span><span>처음 설정</span></div>
    <div class="qwrap"><div class="qcol" id="qcol"></div></div>
    <div class="chat"><div class="thread" id="thread"></div></div>
    <div class="composer"><div class="composer-in">
      <input id="composeIn" type="text" placeholder="직접 적으셔도 됩니다" aria-label="리브에게 쓰기">
      <div class="composer-row"><span>＋</span><span>Auto</span><button class="send" id="composeGo">↑</button></div>
    </div></div>
  </div>
</div>
<div class="proto" id="proto"></div>

const tally3 = () => DATA.TALLY7[jobOf()] || DATA.TALLY7[personaOf()] || DATA.TALLY7.default;

  const fileOf = (i) => { const raw = DATA.FILES[personaOf()] || DATA.FILES['마케팅'] || [];
    const docs = raw.filter((f) => !/\.(m4a|mp3|wav|mp4|mov|png|jpe?g|gif)$/i.test(String(f)));
    return docs[i] || raw[i] || ['보고서', '문서'][i]; };
const nick = () => S.nameSet && S.name ? S.name : '';

/* 자료 41건을 7갈래에 나눠 담는 목표치 — 상위 3개는 직무 표, 나머지는 잔량 */
function drawerTargets() {
  const top = tally3(); const t = {};
  DATA.KINDS7.forEach(([k]) => { t[k] = 0; });
  let sum = 0; top.forEach(([k, c]) => { t[k] = c; sum += c; });
  const rest = DATA.KINDS7.map(([k]) => k).filter((k) => !t[k]);
  let left = Math.max(0, 41 - sum);
  rest.forEach((k, i) => { const c = i < rest.length - 1 ? Math.min(left, [2, 1, 1][i] ?? 1) : left; t[k] = c; left -= c; });
  return t;
}

/* ══════════════ 왼쪽 사이드바 — 실제 web/v2/side.ts 가 온보딩으로 **정말 바꾸는 것만** ══════════════
   (원준님 2026-08-25: "자료함 카드는 우리 UI 에 없다 — 실제로 유효한 변화만") side.ts 실측:
   · 스위처 이름(개인 배지) · 리브 버튼 · '프로젝트 · N' 헤더 · 트리 = 프로젝트 ▸ 살아 있는 세션(상태점) · 발치(앱·내 계정).
   · 프로젝트가 없으면 트리 자리에 안내문 한 줄(실제 문구). 프로젝트 없는 세션은 '프로젝트 없는 세션' 행 아래에 붙는다.
   · 온보딩 중 생기는 실제 변화는 **세션 둘**뿐이다:
       ① '처음 설정' 세션(리브와의 이 대화) — 읽는 중이면 파랑(작업 중), 리브가 답을 기다리면 호박(확인 필요), 끝나면 민트(작업 완료)
       ② 예시를 골라 첫 지시를 정하면 그 문장으로 세션 하나가 더 열린다(작업 중)
   자료함·연결·팀 같은 것은 사이드바에 없다 — 채팅과 토스트가 말한다. */
const FOLDER_D = ['M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1', 'M3 17l2.3-6.6A2 2 0 0 1 7.2 9H21l-2.4 7.6a2 2 0 0 1-1.9 1.4H5a2 2 0 0 1-2-1z'];
const folderIc = () => `<svg class="v2-pj-ic" viewBox="0 0 24 24" aria-hidden="true">${FOLDER_D.map((d) => `<path d="${d}"/>`).join('')}</svg>`;
let pendingChips = null;   // 지금 답을 기다리는 칩들 — 사이드바 상태점(확인 필요)과 입력창 해석이 같이 본다
function obSessionState() {
  if (S.scene === 'done') return 'done';
  if (pendingChips) return 'wait';
  if (S.read.total && !S.read.finished) return 'busy';
  return STEP_OF[S.scene] >= CHAT_FROM ? 'busy' : 'idle';
}
function sbHTML() {
  const sess = [];
  // ① 리브가 일을 벌인 순간부터 세션이 보인다(자료 연결 뒤, 또는 채팅 시작)
  if (S.connected.length || STEP_OF[S.scene] >= CHAT_FROM) {
    const st = obSessionState();
    const sub = st === 'done' ? '처음 설정 끝' : st === 'wait' ? '답을 기다리는 중' : (S.read.total && !S.read.finished) ? `자료 읽는 중 ${S.read.done}/${S.read.total}` : '리브와 대화 중';
    sess.push({ dot: st, main: '처음 설정', sub });
  }
  // ② 첫 지시로 고른 문장 = 새 세션
  if (S.firstOrder) sess.push({ dot: S.scene === 'done' ? 'busy' : 'idle', main: S.firstOrder.length > 34 ? S.firstOrder.slice(0, 34) + '…' : S.firstOrder, sub: S.scene === 'done' ? '시작됨' : '준비됨' });
  const sums = () => { const c = {}; sess.forEach((x) => { c[x.dot] = (c[x.dot] || 0) + 1; });
    return ['wait', 'done', 'busy', 'idle'].filter((k) => c[k]).map((k) => `<span class="v2-sum ${k}"><span class="v2-dot ${k}" style="margin:0"></span>${c[k]}</span>`).join(''); };

function qHead(prog, lead, title, help) {
  const at = QPROG.indexOf(prog);
  // 눈금은 지나온 자리로 돌아가는 문이기도 하다 — 앞 단계는 눌러서 고칠 수 있다(원준님 2026-08-25).
  return `<div class="q-top">${S.trail.length ? `<button class="q-back" data-back>← 이전</button>` : ''}<div class="q-ic">L</div></div>
    ${at >= 0 ? `<div class="q-prog">${QPROG.map((k, i) => i < at
        ? `<button class="on go" data-jump="${k}" title="${esc(SCENE_LABEL[k] || '')}(으)로 돌아가기" aria-label="${esc(SCENE_LABEL[k] || '')}(으)로 돌아가기"></button>`
        : `<i class="${i === at ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    ${lead ? `<p class="q-lead">${lead}</p>` : ''}
    <h1 class="q-title">${title}</h1>
    ${help ? `<p class="q-help">${help}</p>` : ''}`;
}
function card(label, desc, ic, on) {
  return `<button class="opt-card ${on ? 'on' : ''}" data-opt="${esc(label)}">
    ${ic ? `<span class="oc-ic">${ic}</span>` : ''}<span><span class="oc-t">${esc(label)}</span>${desc ? `<span class="oc-d">${esc(desc)}</span>` : ''}</span>
    <span class="oc-chk">✓</span></button>`;
}

function matchChip(v) {
  if (!pendingChips) return null;
  const L = pendingChips.list; const t = v.replace(/\s+/g, '').toLowerCase();
  const yes = /^(응|웅|네|넵|예|어|ㅇㅇ|ㅇㅋ|오케이|ok|yes|좋아요?|맞아요?|그래요?|이대로|해주세요|해줘)/.test(t);
  const no = /^(아니|아뇨|노|no|없어요?|안)/.test(t);
  const go = /(다음|넘어가|넘어갈|계속|끝|정리|준비|됐어|됐음|시작)/.test(t);
  if (no) return L.find((c) => /아니|없어/.test(c.label)) || null;
  if (yes) return L.find((c) => c.cta) || L.find((c) => /^네|맞아|이대로|응/.test(c.label)) || L[0];
  if (go) return L.find((c) => c.cta) || L.find((c) => !c.ghost) || null;
  const norm = (x) => x.replace(/[\s,.·]+/g, '').toLowerCase();
  // 라벨 낱말 맞춤 — 회색 칩(건너뛰기·직접 적기)도 글로 부를 수 있어야 한다
  const exact = L.find((c) => norm(c.label) === t || norm(c.label).includes(t));
  if (exact) return exact;
  const hit = L.filter((c) => !c.ghost).find((c) => t.includes(norm(c.label).slice(0, 4)));
  return hit || null;
}

    // 지나간 단계들을 요약 문답으로 재생
    if (upto > CHAT_STEPS.indexOf('b1')) { past.push([`자료함을 이렇게 나눠 둘까요?`, '네, 이대로 나눠 주세요']); S.drawersOn = true; }
    if (upto > CHAT_STEPS.indexOf('b2')) past.push([`정해진 주기로 만드시거나 만들고 싶으신 문서가 있나요?`, S.b2 === 'week' ? '네, 매주' : S.b2 === 'no' ? '아니요' : '네, 매달']);
    if (upto > CHAT_STEPS.indexOf('b3')) past.push([`같이 보는 팀이 있나요?`, S.b3 === 'me' ? '나만 봐요' : '우리 팀이 같이 봐요']), S.b3 = S.b3 || 'team';
    if (upto > CHAT_STEPS.indexOf('nowline')) { S.nowline = S.nowline || DATA.NOW_KINDS[2]; past.push([`평소에 시간을 가장 많이 쓰시는 일은 무엇인가요?`, S.nowline]); }
    Object.assign(S.read, { done: S.read.total, finished: true });
    const targets = drawerTargets(); S._counts = {}; DATA.KINDS7.forEach(([k]) => { S._counts[k] = targets[k] || ''; });
  }
  save(); renderSB();
  if (key === 'read') { enterChat(token); return; }
  past.forEach(([q, a]) => { msgLiv(`<b>${esc(q)}</b>`); msgUser(a); });
  if (!S.read.finished) startReading();
  chatStep(target, token);
}

/* ══════════════ 프로토타입 컨트롤 ══════════════ */
const TOUR = [['name', '이름'], ['stage', '무대'], ['role', '직무'], ['files', '파일 올리기'], ['sources', '앱 고르기'], ['connect', '앱 연결'],
  ['ai', 'AI 고르기'], ['claude', 'AI 연결'], ['terminal', '터미널'], ['app', '앱 받기'], ['read', '채팅 시작·읽기'],
  ['b1', '되묻기1 갈래'], ['b2', '되묻기2 주기'], ['b3', '되묻기3 협업'], ['nowline', '되묻기4 시간'],
  ['can', '시킬 수 있는 일']];
function renderProto() {
  $('#proto').innerHTML = `<button class="proto-btn" id="protoBtn">PROTOTYPE ▾</button>
    <div class="proto-menu" id="protoMenu" hidden>
      <span class="k">장면 바로 열기 (v2)</span>
      <div class="proto-scenes">${TOUR.map(([k, t], i) => `<button data-sc="${k}" class="${S.scene === k ? 'on' : ''}"><i>${i + 1}</i>${t}</button>`).join('')}</div>
      <button class="proto-reset" id="protoReset">처음부터 (전부 지우기)</button>
    </div>`;
  const btn = $('#protoBtn'), menu = $('#protoMenu');
  btn.onclick = () => { menu.hidden = !menu.hidden; };
  document.addEventListener('click', (e) => { if (!$('#proto').contains(e.target)) menu.hidden = true; }, { once: true });
  $$('[data-sc]', menu).forEach((b) => b.onclick = () => {
    menu.hidden = true;
    const k = b.dataset.sc;
    if (STEP_OF[k] < CHAT_FROM) {
      // 막1·막2 점프 — 그 앞 답을 기본값으로
      const need = STEP_OF[k];
      if (need >= 1 && !S.nameSet) { S.name = '원준'; S.nameSet = true; }
      if (need >= 2) S.stage = S.stage || 'company';
      if (need >= 3) S.job = S.job || stageOf().opts[1][0];
      if (need >= 4 && !S.sources.length) S.sources = ['gdrive', 'notion'];
      if (need >= 5 && !S.connected.length) { S.connected = S.sources.slice(); S.read.total = 41; }
      if (need >= 6) S.ai = S.ai || 'Claude';
      if (need >= 7 && S.ai !== '아직 없어요') S.aiConnected = true;
      save();
    }
    goScene(k);
    renderProto();
  });
  $('#protoReset').onclick = () => { sessionStorage.removeItem(KEY); location.href = location.pathname; };
}

/* ── 부팅 ── */
$('#composeGo').onclick = composeSend;
$('#composeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) composeSend(); });
renderProto();
const want = new URLSearchParams(location.search).get('scene');
if (want && STEP_OF[want] != null) { goScene(want); }
else { renderSB(); goScene(S.scene || 'name'); }
</script>
