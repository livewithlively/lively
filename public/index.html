<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lively Context</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%2316C79A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 스킵 링크 — 해시 라우터와 충돌하지 않게 JS 가 포커스만 이동(app.js) -->
<a id="skip-link" class="skip-link" href="#/overview">본문 바로가기</a>

<!-- 토큰 게이트 — 토큰 없거나 401 시 표시 -->
<section id="gate" hidden>
  <div class="gate-card">
    <div class="wordmark gate-mark">Lively<span class="pulse-dot" aria-hidden="true"></span><span class="wordmark-sub">Context</span></div>
    <p class="gate-copy">사내 액세스 토큰을 입력하세요.<br>토큰은 이 브라우저에만 저장됩니다.</p>
    <form id="gate-form">
      <input id="gate-input" type="password" autocomplete="off" placeholder="액세스 토큰" aria-label="액세스 토큰">
      <p id="gate-error" class="gate-error" hidden></p>
      <button type="submit" class="btn btn-primary gate-btn">저장</button>
    </form>
  </div>
</section>

<!-- 앱 셸 -->
<div id="app" hidden>
  <header class="topbar">
    <a class="wordmark" href="#/overview">Lively<span class="pulse-dot" aria-hidden="true"></span><span class="wordmark-sub">Context</span></a>
    <nav class="tabs" aria-label="주 메뉴">
      <a href="#/overview" data-tab="overview">개요</a>
      <a href="#/items" data-tab="items">탐색</a>
      <a href="#/inbox" data-tab="inbox">큐레이션</a>
      <a href="#/domains" data-tab="domains">도메인</a>
      <a href="#/admin" data-tab="admin" id="admin-tab" hidden>관리</a>
    </nav>
    <div class="topbar-right">
      <span class="sync-chip" id="sync-chip" hidden><span class="dot-static" aria-hidden="true"></span><span id="sync-label"></span></span>
      <span class="user-email" id="user-email"></span>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="./app.js" defer></script>
</body>
</html>
