<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lively Context</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%2316C79A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="./styles.css">
<!-- 터미널(중앙 박스 경로 D) — xterm.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  /* 터미널 세션 매니저 — 도그푸드 스코프 스타일 */
  .term-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .term-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--border, #e5e7eb); border-radius: 12px; background: var(--bg-tint, #fafafa); }
  .term-row-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .term-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .term-badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg, #eee); color: var(--fg-muted, #555); border: 1px solid var(--border, #ddd); }
  .term-badge.danger { background: #fdecec; color: #c0392b; border-color: #f5c6c6; }
  .term-input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border, #ccc);
    border-radius: 8px; font: inherit; background: var(--bg, #fff); color: inherit; }
  .term-flags { display: flex; flex-direction: column; gap: 8px; }
  .term-picker { display: flex; flex-direction: column; gap: 5px; }
  .term-crumb { font-size: 12px; }
  .term-crumb .crumb { color: var(--accent, #16a37f); cursor: pointer; }
  .term-crumb .crumb:hover { text-decoration: underline; }
  .term-crumb .crumb-sep { color: var(--fg-muted, #999); }
  .term-auto { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; font-size: 13px; color: #b04a3a; line-height: 1.4; }
  .term-wrap { display: flex; flex-direction: column; height: calc(100vh - 120px); min-height: 360px; }
  .term-bar { display: flex; align-items: center; gap: 10px; padding: 6px 0 10px; }
  .term-bar-id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg-muted, #777); }
  .term-host { flex: 1; min-height: 0; background: #1e1e2e; border-radius: 10px; padding: 8px; overflow: hidden; }
</style>
</head>
<body>

<!-- 스킵 링크 — 해시 라우터와 충돌하지 않게 JS 가 포커스만 이동(app.js) -->
<a id="skip-link" class="skip-link" href="#/map">본문 바로가기</a>

<!-- 토큰 게이트 — 토큰 없거나 401 시 표시 -->
<section id="gate" hidden>
  <div class="gate-card">
    <div class="wordmark gate-mark">Lively<span class="pulse-dot" aria-hidden="true"></span><span class="wordmark-sub">Context</span></div>
    <p class="gate-copy">사내 액세스 토큰을 입력하세요.<br>토큰은 이 브라우저에만 저장됩니다.</p>
    <form id="gate-form">
      <input id="gate-input" type="password" autocomplete="off" placeholder="액세스 토큰" aria-label="액세스 토큰">
      <p id="gate-error" class="gate-error" hidden></p>
      <button type="submit" class="btn btn-primary gate-btn">저장</button>
    </form>
  </div>
</section>

<!-- 앱 셸 -->
<div id="app" hidden>
  <header class="topbar">
    <a class="wordmark" href="#/map">Lively<span class="pulse-dot" aria-hidden="true"></span><span class="wordmark-sub">Context</span></a>
    <nav class="tabs" aria-label="주 메뉴">
      <a href="#/map" data-tab="map">지식 지도</a>
      <a href="#/browse" data-tab="browse">탐색</a>
      <a href="#/learn" data-tab="learn">안내</a>
      <a href="#/review" data-tab="review">검토<span class="tab-count" id="review-count" hidden></span></a>
      <a href="#/dash" data-tab="dash">작업 현황</a>
      <a href="#/system" data-tab="system" id="system-tab" hidden>관리</a>
      <a href="#/terminal" data-tab="terminal" id="terminal-tab">터미널</a>
    </nav>
    <div class="topbar-right">
      <span class="sync-chip" id="sync-chip" hidden><span class="dot-static" aria-hidden="true"></span><span id="sync-label"></span></span>
      <span class="user-email" id="user-email"></span>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="toasts" aria-live="polite"></div>

<!-- 터미널(중앙 박스 경로 D) — xterm.js + fit addon 을 app.js 이전에 로드(전역 Terminal·FitAddon). -->
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
