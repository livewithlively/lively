<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css">
<script>
  const J=(o)=>Promise.resolve({ok:true,status:200,json:()=>Promise.resolve(o)});
  window.fetch=(p,o={})=>{const m=(o.method||'GET').toUpperCase();p=String(p);
    if(m==='POST')return J({ok:true});
    if(/me\/ai-accounts$/.test(p))return J({accounts:window.__ACC});
    if(/terminal\/sessions/.test(p))return J({sessions:[{id:'a',owner:'yoon',harness:'claude',agentState:'busy'}]});
    if(/me\/profile$/.test(p))return J({body_md:'## 내 프로필\n- 역할: 라이블리 대표\n- 개발 이해도: 비개발 — 코드는 직접 안 봐요\n- 호칭: 상민님\n'});
    if(/\/api\/ui\/org$/.test(p))return J({sections:[],meaning:{},profile:{},canEdit:true});
    return J({});};
</script></head><body>
<div id="toasts"></div><div id="gate" hidden><div id="gate-error"></div><input id="gate-input"></div>
<div id="app"><div id="view"></div></div>
<script type="module">
  import { state } from './app/core.js';
  import { renderSystem } from './app/admin.js';
  state.me={email:'yoon@lively.kr',userId:'yoon',scopes:['admin']};
  window.__ACC=[{key:'claude',label:'Claude Code',scope:'shared',where:'키체인',loggedIn:true,canLogout:false},
                {key:'codex',label:'Codex',scope:'shared',where:'/Users/lively/.codex/auth.json',loggedIn:false,canLogout:false}];
  document.body.setAttribute('data-route','system');
  renderSystem(document.getElementById('view'),'me-ai');
</script></body></html>
