<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>내 AI 세션 · Lively Box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231e1e2e'/%3E%3Cpath d='M4 5l3 3-3 3M8 11h4' stroke='%2316C79A' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;600&family=Source+Code+Pro:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* 한글 코딩 글꼴 D2Coding — 자체호스팅(public/fonts, OFL). #279 한글 가독성 */
  @font-face { font-family: 'D2Coding'; src: url('fonts/D2Coding.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'D2Coding'; src: url('fonts/D2Coding-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
  :root {
    --bg: #ffffff; --bg2: #f4f5f7; --fg: #1f2328; --fg-dim: #6b7280; --border: #e5e7eb;
    --accent: #16a37f; --danger: #c0392b; --term-bg: #1e1e2e;
  }
  html[data-theme="dark"] {
    --bg: #181825; --bg2: #1e1e2e; --fg: #cdd6f4; --fg-dim: #9399b2; --border: #313244;
    --accent: #16C79A; --danger: #f38ba8; --term-bg: #1e1e2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); overflow: hidden; }
  #ws { display: flex; height: 100vh; height: 100dvh; }
  html, body { overscroll-behavior: none; }

  /* 좌측 파일 익스플로러 (VSCode식, 기본 접힘) */
  #explorer { width: 0; flex: 0 0 auto; overflow: hidden; border-right: 1px solid var(--border);
    background: var(--bg2); transition: width .14s ease; display: flex; flex-direction: column; }
  #explorer.open { width: 280px; }
  #explorer.drag { outline: 2px dashed var(--accent); outline-offset: -6px; background: color-mix(in srgb, var(--accent) 10%, var(--bg2)); }
  #explorer.drag::after { content: '여기에 놓아 업로드'; position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; color: var(--accent); }
  #explorer { position: relative; }
  .exp-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .exp-head .spacer { flex: 1; }
  .exp-path { padding: 6px 12px; font-size: 11px; color: var(--fg-dim); font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #exp-list { flex: 1; overflow: auto; padding: 4px 0 12px; }
  .exp-item { display: flex; align-items: center; gap: 7px; padding: 4px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .exp-item:hover { background: rgba(127,127,127,.12); }
  .exp-item .ic { width: 16px; text-align: center; opacity: .8; }
  .exp-item .sz { margin-left: auto; font-size: 11px; color: var(--fg-dim); }
  .exp-dl { margin-left: 6px; opacity: 0; font-size: 11px; color: var(--fg-dim); }
  .exp-item:hover .exp-dl { opacity: 1; }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #tabbar { display: flex; align-items: stretch; gap: 2px; background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 0 6px; overflow-x: auto; min-height: 40px; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 13px; cursor: pointer;
    border: none; background: transparent; color: var(--fg-dim); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); background: var(--bg); }
  .tab .x { opacity: .6; padding: 0 2px; border-radius: 4px; }
  .tab .x:hover { opacity: 1; background: rgba(127,127,127,.25); }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .toolbar .title { font-weight: 600; font-size: 13px; }
  .toolbar .sub { font-family: ui-monospace, monospace; font-size: 11px; color: var(--fg-dim); }
  .toolbar .spacer { flex: 1; }
  .tbtn { border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 7px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .tbtn:hover { border-color: var(--accent); }
  .status { font-size: 12px; color: var(--fg-dim); }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--danger); }
  .status.end { color: var(--fg-dim); font-weight: 600; }

  /* 세션 종료 배너(#835) — 화면을 덮지 않고 툴바 아래에 한 줄. 마지막 출력은 그대로 읽을 수 있어야 한다. */
  .ended-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg2);
    border-bottom: 1px solid var(--border); box-shadow: inset 3px 0 0 var(--danger); font-size: 12.5px; line-height: 1.5; }
  .ended-ic { flex: 0 0 auto; color: var(--danger); font-size: 13px; }
  .ended-txt { flex: 1; min-width: 0; color: var(--fg-dim); }
  .ended-txt b { color: var(--fg); font-weight: 700; }
  .ended-cta { flex: 0 0 auto; padding: 5px 10px; border: 1px solid var(--border); border-radius: 7px;
    color: var(--fg); font-size: 12px; text-decoration: none; white-space: nowrap; }
  .ended-cta:hover { border-color: var(--accent); }
  button.ended-cta { background: none; cursor: pointer; font-family: inherit; }
  button.ended-cta:disabled { opacity: .6; cursor: default; }
  /* #1059 E — 복원 가능·복원 중은 오류가 아니라 안내다: 위험색(빨강) 스트라이프 대신 강조색. */
  .ended-bar.info { box-shadow: inset 3px 0 0 var(--accent); }
  .ended-bar.info .ended-ic { color: var(--accent); }

  /* 첫 진입 파일 드롭 안내 팝업(#1235) — '파일을 끌어다 놓을 수 있다'를 아무도 몰랐다(어디에도 안 적혀 있었다).
     '다시 보지 않기' 체크로 영구 해제하는 방식은 그리드 뷰의 첫 진입 안내(terminal-grid.html)와 같은 언어다.
     ⚠ 그리드 셀(iframe) 안에서는 띄우지 않는다 — 그대로 두면 셀 수만큼 팝업이 겹친다(terminal.js showDropHint 참고). */
  .pop.pop-hint { width: 420px; }
  .pop.pop-hint h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; }
  .hint-sub { margin: 0 0 16px; font-size: 12.5px; color: var(--fg-dim); line-height: 1.55; }
  .hint-steps { display: flex; flex-direction: column; gap: 11px; margin-bottom: 18px; }
  .hint-step { display: flex; gap: 11px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
  .hint-step .n { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .hint-step .t { flex: 1; min-width: 0; color: var(--fg); }
  .hint-step .t small { display: block; color: var(--fg-dim); font-size: 11.5px; margin-top: 2px; line-height: 1.5; }
  .hint-step code, .hint-sub code { font-family: ui-monospace, monospace; font-size: 11.5px;
    background: rgba(127,127,127,.16); border-radius: 5px; padding: 1px 5px; }
  .hint-row { display: flex; align-items: center; gap: 10px; }
  .hint-row label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 12px; color: var(--fg-dim); cursor: pointer; }
  .hint-row .spacer { flex: 1; }
  .hint-ok { padding: 7px 15px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent);
    color: #fff; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .hint-ok:hover { filter: brightness(1.08); }

  #panes { flex: 1; min-height: 0; position: relative; }
  /* 터미널 본체 드롭 안내(#1235) — 점선 아웃라인만으론 '놓으면 무슨 일이 나는지'를 알 수 없다.
     실제로 끌어온 순간이 가장 잘 배우는 때라, 여기서 결과(업로드 위치·경로 삽입)를 문장으로 말해 준다.
     pointer-events:none — 이 카드가 드롭 이벤트를 가로채면 안 된다. */
  .drop-note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none;
    background: var(--bg); border: 1px solid var(--accent); border-radius: 14px; padding: 16px 24px; text-align: center;
    box-shadow: 0 12px 34px rgba(0,0,0,.28); max-width: 88%; }
  .drop-note b { display: block; font-size: 14.5px; color: var(--fg); margin-bottom: 4px; }
  .drop-note span { font-size: 12.5px; color: var(--fg-dim); }
  .pane { position: absolute; inset: 0; display: none; flex-direction: column; }
  .pane.active { display: flex; }
  #term-host { flex: 1; min-height: 0; background: var(--term-bg); padding: 6px 8px; }
  /* 미리보기 패널 — #1436: 상단 바(전체화면·링크·다운로드) + 본문. 어떤 타입이든 같은 자리에 같은 선택지. */
  .preview-pane { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .preview-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg2); flex: 0 0 auto; }
  .preview-bar-nm { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
  .preview-bar-sp { flex: 1 1 auto; }
  .preview-bar .tbtn { text-decoration: none; }
  .preview-body { flex: 1; overflow: auto; padding: 20px 26px; background: var(--bg); }
  .preview-body img { max-width: 100%; }
  .preview-body pre.raw { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.5; }

  /* 설정 팝오버 */
  .pop-back { position: fixed; inset: 0; background: rgba(0,0,0,.38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .pop { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; width: 340px; max-width: 92vw; }
  .pop h3 { margin: 0 0 12px; font-size: 15px; }
  .pop .field { margin-bottom: 12px; }
  .pop label { display: block; font-size: 12px; color: var(--fg-dim); margin-bottom: 4px; }
  .pop select, .pop input { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--fg); font: inherit; }
  .pop .pop-close { margin-top: 6px; }
  /* 사용법 안내 팝업 — 미니멀(보더리스 리스트 · 키캡 정렬 · 여백 위주) */
  .pop.pop-help { position: relative; width: 460px; max-width: 92vw; max-height: 82vh; padding: 0; overflow: hidden;
    display: flex; flex-direction: column; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.28);
    animation: helpPop .16s ease-out; }
  @keyframes helpPop { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  .help-x { position: absolute; top: 15px; right: 15px; width: 28px; height: 28px; border: none; background: transparent;
    color: var(--fg-dim); font-size: 14px; line-height: 1; border-radius: 7px; cursor: pointer; z-index: 1; }
  .help-x:hover { background: rgba(127,127,127,.12); color: var(--fg); }
  .help-head { flex: 0 0 auto; padding: 22px 24px 14px; border-bottom: 1px solid var(--border); }
  .pop.pop-help h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .help-intro { margin: 6px 0 0; font-size: 12.5px; color: var(--fg-dim); line-height: 1.5; }
  .help-body { flex: 1 1 auto; overflow: auto; padding: 6px 24px 20px; }
  .help-sec { margin-top: 20px; }
  .help-sec-t { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .03em; color: var(--fg-dim); }
  .help-list { display: flex; flex-direction: column; }
  .help-item { display: flex; gap: 14px; align-items: baseline; padding: 5px 0; font-size: 13px; line-height: 1.5; }
  .help-item .k { flex: 0 0 104px; display: flex; flex-wrap: wrap; gap: 5px; }
  .help-item .d { flex: 1; min-width: 0; color: var(--fg); }
  .help-tool { padding: 5px 0; font-size: 13px; line-height: 1.5; }
  .help-tool b { color: var(--fg); font-weight: 700; }
  .help-tool span { color: var(--fg-dim); }
  .kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; padding: 2px 8px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg2); color: var(--fg);
    font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 600; white-space: nowrap; }

  /* '내 질문' 팝업 — 이 세션의 사용자 프롬프트 최신순 목록(#745 이식) + 클릭 시 그 위치로 이동(#967). pop-help 셸(스크롤·닫기) 재사용. */
  .q-search { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--fg); font: inherit; font-size: 13px; margin: 6px 0; }
  .q-cap { font-size: 11.5px; color: var(--fg-dim); margin: 2px 0 8px; }
  .q-list { display: flex; flex-direction: column; gap: 6px; }
  .q-item { border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; cursor: pointer; background: var(--bg); transition: border-color .1s, background .1s; }
  .q-item:hover { border-color: var(--accent); background: var(--bg2); }
  .q-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .q-spacer { flex: 1; }
  .q-copy { font: inherit; font-size: 11px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg2); color: var(--fg-dim); cursor: pointer; }
  .q-copy:hover { border-color: var(--accent); color: var(--accent); }
  .q-num { font-size: 11px; font-weight: 700; color: var(--accent); }
  /* 작성자 배지 — 이 세션에 여러 사람이 질문했을 때만 붙는다(#1062). */
  .q-who { font-size: 10.5px; font-weight: 700; color: var(--muted, #8b93a7); background: rgba(127,127,127,.14); border-radius: 999px; padding: 1px 7px; }
  .q-when { font-size: 11px; color: var(--fg-dim); }
  .q-text { font-size: 13px; line-height: 1.5; color: var(--fg); white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .q-empty { padding: 26px 4px; text-align: center; color: var(--fg-dim); font-size: 13px; }

  /* 마크다운 미리보기 */
  .md { line-height: 1.65; font-size: 14px; }
  .md h1,.md h2,.md h3 { margin: 1.2em 0 .5em; line-height: 1.3; }
  .md pre.md-pre { background: var(--bg2); padding: 12px 14px; border-radius: 8px; overflow: auto; }
  .md code.md-code { background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 5px; font-family: ui-monospace, monospace; }
  .md table.md-table { border-collapse: collapse; margin: 1em 0; }
  .md .md-table th, .md .md-table td { border: 1px solid var(--border); padding: 6px 10px; }
  .md blockquote.md-quote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 2px 14px; color: var(--fg-dim); }
  .md a.md-link { color: var(--accent); }
  .gate-msg { padding: 40px; text-align: center; color: var(--fg-dim); white-space: pre-line; line-height: 1.6; max-width: 520px; margin: 0 auto; }
  .gate-card { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 440px; margin: 12vh auto 0; padding: 36px 32px; text-align: center; border: 1px solid var(--border); border-radius: 16px; background: var(--bg2); }
  .gate-icon { font-size: 30px; line-height: 1; }
  .gate-title { font-size: 18px; font-weight: 700; color: var(--fg); margin: 0; }
  .gate-sub { font-size: 13.5px; color: var(--fg-dim); line-height: 1.65; margin: 0; }
  .gate-cta { display: inline-block; margin-top: 4px; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
  .gate-cta:hover { filter: brightness(1.08); }
  .gate-retry { background: none; border: 0; color: var(--fg-dim); font-size: 12.5px; cursor: pointer; padding: 4px; text-decoration: underline; }
  .gate-retry:hover { color: var(--fg); }
  /* ── 모바일 입력 바(#1719) — 보이는 입력칸에서 네이티브 IME 로 쓰고 한 번에 보낸다. 데스크톱엔 안 그린다(body.mobile 에서만). ── */
  #mdock { flex: none; display: flex; flex-direction: column; background: var(--bg2); border-top: 1px solid var(--border);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
  #mdock[hidden] { display: none; }
  .mkeys { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 1px; }
  .mkeys::-webkit-scrollbar { display: none; }
  .mkey { flex: none; min-width: 44px; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; font-family: ui-monospace, "D2Coding", monospace;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .mkey:active { background: var(--border); }
  .mrow { display: flex; gap: 8px; align-items: flex-end; }
  .mcomp { flex: 1; min-height: 38px; max-height: 112px; resize: none; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; line-height: 1.4; }  /* 16px 미만이면 iOS 가 포커스 때 화면을 확대한다 */
  .mcomp:focus { outline: none; border-color: var(--accent); }
  .msend { flex: none; height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .msend:active { filter: brightness(.92); }
  body.mobile .toolbar { overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; }
  body.mobile .toolbar::-webkit-scrollbar { display: none; }
  body.mobile .toolbar .tbtn { flex: none; white-space: nowrap; }
  body.mobile .toolbar .title, body.mobile .toolbar .status { flex: none; white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  body.mobile #term-host { padding: 4px 6px; }
  /* 복사 시트 — 화면 글자를 OS 선택이 되는 일반 텍스트로 */
  .copy-sheet { width: 640px; max-width: 94vw; max-height: 80vh; display: flex; flex-direction: column; padding: 14px 14px 12px; }
  .copy-sheet-head { display: flex; align-items: center; gap: 8px; }
  .copy-sheet-head h3 { margin: 0; flex: none; }
  .copy-sheet-hint { font-size: 12px; color: var(--fg-dim); margin: 6px 0 8px; }
  .copy-sheet-pre { flex: 1; min-height: 0; margin: 0; overflow: auto; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--fg);
    font-family: ui-monospace, "D2Coding", monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-all;
    user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; }
  .pop .field-row { display: flex; align-items: flex-start; gap: 8px; }
  .pop .field-row label { margin: 0; line-height: 1.5; }
  .pop .field-row input { width: 18px; height: 18px; margin: 1px 0 0; }
  .unsupported { display: flex; align-items: center; justify-content: center; height: 100%; }
  .unsupported-card { text-align: center; padding: 28px 32px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg2); }
  .unsupported-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .unsupported-sub { font-family: ui-monospace, monospace; font-size: 12px; color: var(--fg-dim); margin-bottom: 16px; }
  .unsupported-actions { display: flex; gap: 8px; justify-content: center; }

  /* 모바일(≤760px, #1777) — 툴바가 한 줄에 안 들어가 글자가 세로로 낱자가 되던 것을 두 줄로 접는다:
     1줄 = [탐색기] 제목(말줄임) 상태 · 2줄 = 동작 버튼들(가로 스크롤). 터미널 본체는 남는 높이 전부. 100dvh — iOS 주소창. */
  @media (max-width: 760px) {
    #ws { height: 100dvh; }
    #explorer.open { width: min(86vw, 300px); }
    .toolbar { flex-wrap: wrap; gap: 6px 6px; padding: 6px 8px; }
    .toolbar .title { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
    .toolbar .spacer { display: none; }
    .toolbar .status { flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 상태 다음(동작 버튼들)은 둘째 줄 — 컨테이너 ::before(플렉스 아이템이 된다)를 order 1 · 전폭으로 끼워 줄을 바꾼다 */
    .toolbar::before { content: ''; order: 1; flex: 1 1 100%; height: 0; }
    .toolbar .status ~ .tbtn { order: 2; flex: none; }
    .tbtn { white-space: nowrap; padding: 7px 10px; font-size: 12.5px; min-height: 34px; }
    #tabbar { min-height: 38px; }
    .tab { padding: 0 10px; min-height: 38px; }
    #term-host { padding: 4px 4px; }
    .pop { width: min(360px, 94vw); }
    .pop.pop-help, .pop.pop-hint { width: min(460px, 94vw); }
  }
</style>
