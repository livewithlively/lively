<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 AI 세션 그리드 · Lively Box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231e1e2e'/%3E%3Crect x='3' y='3' width='4.5' height='4.5' rx='1' fill='%2316C79A'/%3E%3Crect x='8.5' y='3' width='4.5' height='4.5' rx='1' fill='%2316C79A'/%3E%3Crect x='3' y='8.5' width='4.5' height='4.5' rx='1' fill='%2316C79A'/%3E%3Crect x='8.5' y='8.5' width='4.5' height='4.5' rx='1' fill='%2316C79A'/%3E%3C/svg%3E">
<style>
  :root { --bg:#e6ebf3; --bar:#ffffff; --fg:#15233b; --fg-dim:#5a6b85; --border:#d8e0ee; --accent:#16a37f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11131a; --bar:#181825; --fg:#cdd6f4; --fg-dim:#9399b2; --border:#2a2c3a; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--bar); border-bottom: 1px solid var(--border); font-size: 13px; }
  #bar .title { font-weight: 700; }
  #bar .sub { color: var(--fg-dim); }
  #bar .spacer { flex: 1; }
  #bar button { font: inherit; font-size: 12.5px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bar); color: var(--fg); cursor: pointer; }
  #bar button:hover { border-color: var(--accent); }
  /* 배치(레이아웃) 컨트롤 — 열 수를 바꿔 2×2 / 세로 스택(1열) / 가로 한 줄(N열) 등으로 라이브 전환. */
  .lay { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border: 1px solid var(--border); border-radius: 8px; }
  .lay .lay-lbl { color: var(--fg-dim); font-size: 12px; margin-right: 2px; }
  .lay button { padding: 3px 9px; font-size: 13px; line-height: 1; }
  .lay button:disabled { opacity: .4; cursor: default; border-color: var(--border); }
  .lay .lay-val { min-width: 42px; text-align: center; font-size: 12px; color: var(--fg-dim); }
  #grid { flex: 1; min-height: 0; display: grid; gap: 3px; padding: 3px; background: var(--border); position: relative; }
  /* 리사이즈 거터 — 셀 사이 경계(gap) 위에 얹은 얇은 드래그 핸들. 드래그하면 인접 트랙의 fr을 조절해 폭/높이 변경. */
  .gutter { position: absolute; z-index: 4; }
  .gutter::after { content: ''; position: absolute; background: transparent; border-radius: 2px; transition: background .1s; }
  .gutter.v { width: 11px; cursor: col-resize; }
  .gutter.v::after { top: 0; bottom: 0; left: 4px; width: 3px; }
  .gutter.h { height: 11px; cursor: row-resize; }
  .gutter.h::after { left: 0; right: 0; top: 4px; height: 3px; }
  .gutter:hover::after, .gutter.drag::after { background: var(--accent); }
  #grid.gutter-drag { user-select: none; }
  #grid.gutter-drag .cell iframe { pointer-events: none; }
  #grid.has-solo .gutter { display: none; }
  .cell { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bar); border-radius: 6px; overflow: hidden; position: relative; }
  .cell-head { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; font-size: 12px; color: var(--fg-dim); background: var(--bar); border-bottom: 1px solid var(--border); }
  .cell-head .lbl { font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-head .spacer { flex: 1; }
  .cell-head a { color: var(--fg-dim); text-decoration: none; font-size: 11.5px; white-space: nowrap; }
  .cell-head a:hover { color: var(--accent); }
  .cell iframe { flex: 1; width: 100%; border: 0; min-height: 0; background: #1e1e2e; }
  .cell.active { box-shadow: inset 0 0 0 2px var(--accent); }        /* 지금 입력 중인 세션 강조 */
  /* 셀 코너 도구모음 — 드래그 손잡이·전체화면·새 탭. 세션명은 iframe(터미널) 자체 툴바가 이미 표시하므로 제목 중복 안 함. */
  /* 셀 하단 우측 — iframe 자체 상단 툴바(파일 탐색기·환경 설정·사용법 안내)와 안 겹치게 아래로 뺀다. */
  .cell-tools { position: absolute; bottom: 8px; right: 10px; z-index: 5; display: flex; gap: 4px; opacity: .38; transition: opacity .12s; }
  .cell:hover .cell-tools, .cell.active .cell-tools { opacity: .92; }
  .cell-tools:hover { opacity: 1; }
  .cell-tools > * { font: inherit; font-size: 12px; line-height: 1; color: var(--fg-dim); background: var(--bar); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; user-select: none; }
  .cell-tools > *:hover { color: var(--accent); border-color: var(--accent); }
  .cell-grip { cursor: grab; letter-spacing: -1px; }
  .cell-grip:active { cursor: grabbing; }
  /* 드래그 중엔 iframe이 dragover를 먹지 않도록 통과시켜 셀이 드롭 대상을 받게 한다. */
  #grid.dragging .cell iframe { pointer-events: none; }
  #grid.dragging .cell { user-select: none; }
  .cell.drop-target { outline: 2px dashed var(--accent); outline-offset: -3px; }
  .cell.dragging-src { opacity: .5; }
  /* 전체화면(솔로) — 한 셀만 그리드 전체를 채우고 나머지는 감춘다(그리드 재배치·iframe 재로드 없음). */
  #grid.has-solo { grid-template-columns: 1fr !important; grid-template-rows: 1fr !important; }
  #grid.has-solo .cell:not(.solo) { display: none; }
  #empty { margin: auto; color: var(--fg-dim); font-size: 14px; }
  /* 첫 진입 안내 팝업 — '다시 보지 않기' 체크 시 다시 안 뜸(localStorage 영속). */
  #help-ov { position: fixed; inset: 0; background: rgba(10,14,22,.55); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  #help-box { max-width: 460px; width: calc(100% - 32px); background: var(--bar); color: var(--fg); border: 1px solid var(--border); border-radius: 14px; padding: 22px 22px 16px; box-shadow: 0 16px 48px rgba(10,14,22,.4); }
  #help-box h2 { margin: 0 0 12px; font-size: 16px; }
  #help-box p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.65; color: var(--fg-dim); }
  #help-box kbd { font: inherit; font-size: 12px; font-weight: 700; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  #help-box .note { font-size: 12px; color: var(--fg-dim); }
  #help-box .help-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
  #help-box label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-dim); cursor: pointer; user-select: none; }
  #help-box .help-close { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; }
  #help-box .help-close:hover { filter: brightness(1.06); }
</style>
</head>
<body>
<div id="bar">
  <span class="title">터미널 그리드</span>
  <span class="sub" id="count"></span>
  <span class="spacer"></span>
  <span class="lay" id="lay" title="배치 — 열 수를 바꿔 2×2·세로 스택·가로 한 줄 등으로">
    <span class="lay-lbl">배치</span>
    <button id="lay-dec" title="열 수 줄이기 (세로로 길게)">−</button>
    <span class="lay-val" id="lay-val">—</span>
    <button id="lay-inc" title="열 수 늘리기 (가로로 넓게)">＋</button>
  </span>
  <button id="btn-reload" title="모든 셀 새로고침">↻ 새로고침</button>
  <button id="btn-close" title="이 탭 닫기">닫기</button>
</div>
<div id="grid"></div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var ids = (p.get('sessions') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var labels = [];
  try { labels = JSON.parse(p.get('labels') || '[]'); } catch (e) { labels = []; }
  if (!Array.isArray(labels)) labels = [];
  var n = ids.length;
  var cols = Math.max(1, parseInt(p.get('cols'), 10) || 0);
  var rows = Math.max(1, parseInt(p.get('rows'), 10) || 0);
  if (!cols || !rows || cols * rows < n) { cols = Math.ceil(Math.sqrt(n || 1)); rows = Math.ceil((n || 1) / cols); }

  var grid = document.getElementById('grid');
  document.title = n ? ('터미널 그리드 (' + n + ') · Lively Box') : '터미널 그리드';

  if (!n) {
    document.getElementById('count').textContent = '';
    document.getElementById('lay').style.display = 'none';
    grid.innerHTML = '<div id="empty">열 세션이 없습니다. 터미널 탭에서 세션을 선택해 다시 열어 주세요.</div>';
    return;
  }

  // 배치·순서 영속 — 이 세션 조합 기준(localStorage). 열 수와 셀 순서(orderVals)를 기억한다.
  var LKEY = 'lively_tgrid_layout_' + ids.slice().sort().join(',');
  var orderVals = ids.map(function (_, i) { return i; }); // orderVals[cellIndex] = CSS order(=시각적 위치)
  var colFr = null, rowFr = null; // 열/행별 크기(fr). null이면 균등으로 초기화(applyLayout에서).
  try {
    var saved = JSON.parse(localStorage.getItem(LKEY) || 'null');
    if (saved) {
      if (saved.cols) cols = Math.min(n, Math.max(1, saved.cols));
      if (Array.isArray(saved.order) && saved.order.length === n) orderVals = saved.order.slice();
      if (Array.isArray(saved.colFr)) colFr = saved.colFr.slice();
      if (Array.isArray(saved.rowFr)) rowFr = saved.rowFr.slice();
    }
  } catch (e) { /* */ }
  function persist() { try { localStorage.setItem(LKEY, JSON.stringify({ cols: cols, order: orderVals, colFr: colFr, rowFr: rowFr })); } catch (e) { /* */ } }

  var nodes = (p.get('nodes') || '').split(',');
  var frames = [], cells = [], current = 0, dragSrc = null;

  ids.forEach(function (id, i) {
    var label = labels[i] || id;
    var url = '/ui/terminal.html?session=' + encodeURIComponent(id) + '&label=' + encodeURIComponent(labels[i] || '')
      + ((nodes[i] || '').trim() ? '&node=' + encodeURIComponent(nodes[i].trim()) : '');
    var cell = document.createElement('div'); cell.className = 'cell';
    var frame = document.createElement('iframe'); frame.src = url; frame.title = label;
    frame.setAttribute('allow', 'clipboard-read; clipboard-write');

    // ── 셀 코너 도구모음: 드래그 손잡이 · 전체화면 토글 · 새 탭 ──
    var tools = document.createElement('div'); tools.className = 'cell-tools';
    var grip = document.createElement('span'); grip.className = 'cell-grip'; grip.setAttribute('draggable', 'true');
    grip.textContent = '⠿'; grip.title = (label ? label + ' — ' : '') + '드래그해서 위치 바꾸기';
    var fs = document.createElement('button'); fs.className = 'cell-fs'; fs.type = 'button';
    fs.textContent = '⛶'; fs.title = '전체화면 (다시 누르면 원래 배치로)';
    var pop = document.createElement('a'); pop.className = 'cell-pop'; pop.href = url; pop.target = '_blank'; pop.rel = 'noopener';
    pop.textContent = '↗'; pop.title = (label ? label + ' — ' : '') + '이 세션만 새 탭으로';
    tools.appendChild(grip); tools.appendChild(fs); tools.appendChild(pop);

    cell.appendChild(frame); cell.appendChild(tools);
    grid.appendChild(cell);
    frames.push(frame); cells.push(cell);

    // 전체화면 토글
    fs.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); toggleSolo(i); });

    // 드래그 재배치 — CSS order만 스왑(DOM 이동 없음 → iframe/세션 유지). iframe이 dragover를 먹지 않게 그리드에 dragging 클래스.
    grip.addEventListener('dragstart', function (e) {
      dragSrc = i; grid.classList.add('dragging'); cell.classList.add('dragging-src');
      try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); } catch (_) { /* */ }
    });
    cell.addEventListener('dragover', function (e) {
      if (dragSrc === null || dragSrc === i) return;
      e.preventDefault(); try { e.dataTransfer.dropEffect = 'move'; } catch (_) { /* */ }
      cell.classList.add('drop-target');
    });
    cell.addEventListener('dragleave', function () { cell.classList.remove('drop-target'); });
    cell.addEventListener('drop', function (e) {
      e.preventDefault(); cell.classList.remove('drop-target');
      if (dragSrc === null || dragSrc === i) return;
      var t = orderVals[dragSrc]; orderVals[dragSrc] = orderVals[i]; orderVals[i] = t; // 두 셀의 시각 위치 스왑
      applyOrders();
    });
  });

  document.addEventListener('dragend', function () {
    dragSrc = null; grid.classList.remove('dragging');
    cells.forEach(function (c) { c.classList.remove('drop-target'); c.classList.remove('dragging-src'); });
  });

  function applyOrders() { cells.forEach(function (c, i) { c.style.order = String(orderVals[i]); }); persist(); }

  // ── 배치(레이아웃) — 열 수로 grid 형태 전환. cols=1 세로 스택, cols=n 가로 한 줄, 그 사이는 격자. ──
  function applyTemplate() {
    if (grid.classList.contains('has-solo')) return; // has-solo는 CSS !important가 덮음
    grid.style.gridTemplateColumns = colFr.map(function (f) { return f.toFixed(4) + 'fr'; }).join(' ');
    grid.style.gridTemplateRows = rowFr.map(function (f) { return f.toFixed(4) + 'fr'; }).join(' ');
  }
  function applyLayout() {
    cols = Math.min(n, Math.max(1, cols));
    rows = Math.ceil(n / cols);
    // 열/행 수가 바뀌면 크기(fr)를 균등으로 리셋(트랙 개수가 달라짐). 복원값이 길이 맞으면 유지.
    if (!colFr || colFr.length !== cols) colFr = Array.apply(null, { length: cols }).map(function () { return 1; });
    if (!rowFr || rowFr.length !== rows) rowFr = Array.apply(null, { length: rows }).map(function () { return 1; });
    applyTemplate();
    buildGutters();
    layoutGutters();
    document.getElementById('count').textContent = n + '개 세션 · ' + cols + '×' + rows;
    document.getElementById('lay-val').textContent = cols + '열';
    document.getElementById('lay-dec').disabled = cols <= 1;
    document.getElementById('lay-inc').disabled = cols >= n;
    persist();
  }
  document.getElementById('lay-dec').onclick = function () { cols--; applyLayout(); };
  document.getElementById('lay-inc').onclick = function () { cols++; applyLayout(); };

  // ── 리사이즈 거터 — gap 위에 얇은 핸들을 얹고, 드래그하면 인접 두 트랙의 fr을 주고받아 폭/높이 조절 ──
  //  절대배치(그리드 흐름에서 빠짐)라 셀 배치엔 영향 없음. 드래그 중엔 iframe pointer-events를 꺼 mousemove가 부모로 온다.
  function buildGutters() {
    Array.prototype.forEach.call(grid.querySelectorAll('.gutter'), function (g) { g.remove(); });
    var i;
    for (i = 0; i < cols - 1; i++) grid.appendChild(makeGutter('v', i));
    for (i = 0; i < rows - 1; i++) grid.appendChild(makeGutter('h', i));
  }
  function makeGutter(axis, idx) {
    var g = document.createElement('div'); g.className = 'gutter ' + axis;
    g.title = (axis === 'v' ? '드래그해서 좌우 폭 조절' : '드래그해서 위아래 높이 조절') + ' (더블클릭=균등)';
    g.addEventListener('mousedown', function (e) { startGutterDrag(e, axis, idx, g); });
    g.addEventListener('dblclick', function () { // 균등 복귀
      var fr = axis === 'v' ? colFr : rowFr; for (var k = 0; k < fr.length; k++) fr[k] = 1;
      applyTemplate(); layoutGutters(); persist();
    });
    return g;
  }
  function trackPx(axis) {
    var v = getComputedStyle(grid)[axis === 'v' ? 'gridTemplateColumns' : 'gridTemplateRows'];
    return v.split(' ').map(parseFloat);
  }
  function layoutGutters() {
    if (grid.classList.contains('has-solo')) return;
    var gs = getComputedStyle(grid);
    var gap = parseFloat(gs.columnGap || gs.gap) || 3;
    var padL = parseFloat(gs.paddingLeft) || 0, padT = parseFloat(gs.paddingTop) || 0;
    var colPx = trackPx('v'), rowPx = trackPx('h');
    var contentH = grid.clientHeight - padT - (parseFloat(gs.paddingBottom) || 0);
    var contentW = grid.clientWidth - padL - (parseFloat(gs.paddingRight) || 0);
    var vs = grid.querySelectorAll('.gutter.v'), hs = grid.querySelectorAll('.gutter.h');
    var x = padL, i;
    for (i = 0; i < colPx.length - 1; i++) {
      x += colPx[i];
      if (vs[i]) { vs[i].style.left = (x + gap / 2 - 5.5) + 'px'; vs[i].style.top = padT + 'px'; vs[i].style.height = contentH + 'px'; }
      x += gap;
    }
    var y = padT;
    for (i = 0; i < rowPx.length - 1; i++) {
      y += rowPx[i];
      if (hs[i]) { hs[i].style.top = (y + gap / 2 - 5.5) + 'px'; hs[i].style.left = padL + 'px'; hs[i].style.width = contentW + 'px'; }
      y += gap;
    }
  }
  function startGutterDrag(e, axis, idx, gEl) {
    e.preventDefault();
    var fr = axis === 'v' ? colFr : rowFr;
    var totalFr = fr.reduce(function (a, b) { return a + b; }, 0);
    var totalPx = trackPx(axis).reduce(function (a, b) { return a + b; }, 0);
    if (!totalPx) return;
    var frPerPx = totalFr / totalPx;
    var start = axis === 'v' ? e.clientX : e.clientY;
    var f0 = fr[idx], f1 = fr[idx + 1], minF = 0.18;
    grid.classList.add('gutter-drag'); gEl.classList.add('drag');
    function onMove(ev) {
      var d = ((axis === 'v' ? ev.clientX : ev.clientY) - start) * frPerPx;
      var nf0 = f0 + d, nf1 = f1 - d;
      if (nf0 < minF || nf1 < minF) return; // 한쪽이 너무 작아지면 멈춤
      fr[idx] = nf0; fr[idx + 1] = nf1;
      applyTemplate(); layoutGutters();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove, true);
      document.removeEventListener('mouseup', onUp, true);
      grid.classList.remove('gutter-drag'); gEl.classList.remove('drag'); persist();
    }
    document.addEventListener('mousemove', onMove, true);
    document.addEventListener('mouseup', onUp, true);
  }
  window.addEventListener('resize', layoutGutters);

  // ── 전체화면(솔로) 토글 — 한 셀만 그리드 전체로. 나머지는 CSS로 숨김(재로드 없음). ──
  function toggleSolo(i) { setSolo(cells[i].classList.contains('solo') ? -1 : i); }
  function setSolo(i) {
    cells.forEach(function (c, k) {
      var on = (k === i);
      c.classList.toggle('solo', on);
      var b = c.querySelector('.cell-fs');
      if (b) { b.textContent = on ? '⛝' : '⛶'; b.title = on ? '원래 배치로 (전체화면 해제)' : '전체화면 (다시 누르면 원래 배치로)'; }
    });
    if (i >= 0) { grid.classList.add('has-solo'); setActive(i, true); }
    else { grid.classList.remove('has-solo'); applyLayout(); }
  }

  applyOrders();
  applyLayout();

  document.getElementById('btn-close').onclick = function () { window.close(); };
  document.getElementById('btn-reload').onclick = function () {
    [].forEach.call(grid.querySelectorAll('iframe'), function (f) { try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } });
  };

  // ── 세션 간 포커스 이동 — Ctrl+Shift+→(다음)/Ctrl+Shift+←(이전). 시각적 배치 순서를 따른다. ──
  function setActive(i, focus) {
    if (i < 0 || i >= cells.length) return;
    current = i;
    for (var k = 0; k < cells.length; k++) cells[k].classList.toggle('active', k === i);
    if (focus) {
      try {
        frames[i].contentWindow.focus();
        var doc = frames[i].contentDocument;
        var ta = doc && (doc.querySelector('.xterm-helper-textarea') || doc.querySelector('textarea'));
        if (ta) ta.focus();
      } catch (e) { /* same-origin 접근 실패 시 조용히 무시 */ }
    }
  }
  function visualSeq() {
    var idx = cells.map(function (_, i) { return i; });
    idx.sort(function (a, b) { return orderVals[a] - orderVals[b]; });
    return idx;
  }
  function cycle(delta) {
    if (cells.length < 2) return;
    var seq = visualSeq();
    var pos = seq.indexOf(current); if (pos < 0) pos = 0;
    var next = seq[((pos + delta) % seq.length + seq.length) % seq.length];
    if (grid.classList.contains('has-solo')) setSolo(next); else setActive(next, true);
  }
  function onKey(e) {
    var delta = null;
    if (e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) delta = (e.key === 'ArrowRight' ? 1 : -1);
    else if (e.key === 'Tab' && e.ctrlKey && !e.altKey && !e.metaKey) delta = (e.shiftKey ? -1 : 1);
    if (delta !== null) { e.preventDefault(); e.stopPropagation(); cycle(delta); }
  }
  document.addEventListener('keydown', onKey, true);
  frames.forEach(function (f, i) {
    var wire = function () {
      try {
        var doc = f.contentDocument; if (!doc) return;
        doc.addEventListener('keydown', onKey, true);
        doc.addEventListener('mousedown', function () { setActive(i, false); }, true);
      } catch (e) { /* */ }
    };
    f.addEventListener('load', wire);
    try { if (f.contentDocument && f.contentDocument.readyState === 'complete') wire(); } catch (e) { /* */ }
  });
  setActive(0, false);

  // ── 첫 진입 안내 팝업 — '다시 보지 않기' 체크 시 다시 안 뜸(localStorage 영속) ──
  var HELP_KEY = 'lively_tgrid_nav_help_v1';
  if (localStorage.getItem(HELP_KEY) !== '1') {
    var ov = document.createElement('div'); ov.id = 'help-ov';
    ov.innerHTML =
      '<div id="help-box" role="dialog" aria-modal="true" aria-labelledby="help-t">'
      + '<h2 id="help-t">여러 세션 그리드 사용법</h2>'
      + '<p>지금 <b>' + n + '개 세션</b>이 한 그리드에 있어요. 한 세션에서 입력하다가 다음 세션으로 넘어가려면:</p>'
      + '<p><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>→</kbd> 다음 세션 &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>←</kbd> 이전 세션 &nbsp;(셀 클릭으로도 이동)</p>'
      + '<p>· 상단 <b>배치</b> −/＋ 로 2×2·세로 스택·가로 한 줄 전환 · 셀 코너 <b>⛶</b> 전체화면 · <b>⠿</b> 끌어서 위치 바꾸기 · <b>↗</b> 새 탭</p>'
      + '<p class="note">배치·위치는 이 브라우저에 기억돼 다음에도 그대로예요.</p>'
      + '<div class="help-row"><label><input type="checkbox" id="help-dontshow"> 다시 보지 않기</label>'
      + '<button class="help-close" id="help-close">닫기</button></div>'
      + '</div>';
    document.body.appendChild(ov);
    var closeHelp = function () {
      try { if (document.getElementById('help-dontshow').checked) localStorage.setItem(HELP_KEY, '1'); } catch (e) { /* */ }
      ov.remove();
    };
    document.getElementById('help-close').onclick = closeHelp;
    ov.addEventListener('click', function (e) { if (e.target === ov) closeHelp(); });
    ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); closeHelp(); } });
    document.getElementById('help-close').focus();
  }
})();
</script>
</body>
</html>
