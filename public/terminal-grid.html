<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 AI 세션 그리드 · Lively Box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231e1e2e'/%3E%3Crect x='3' y='3' width='4.5' height='4.5' rx='1' fill='%2316C79A'/%3E%3Crect x='8.5' y='3' width='4.5' height='4.5' rx='1' fill='%2316C79A'/%3E%3Crect x='3' y='8.5' width='4.5' height='4.5' rx='1' fill='%2316C79A'/%3E%3Crect x='8.5' y='8.5' width='4.5' height='4.5' rx='1' fill='%2316C79A'/%3E%3C/svg%3E">
<style>
  :root { --bg:#e6ebf3; --bar:#ffffff; --fg:#15233b; --fg-dim:#5a6b85; --border:#d8e0ee; --accent:#16a37f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11131a; --bar:#181825; --fg:#cdd6f4; --fg-dim:#9399b2; --border:#2a2c3a; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
  #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--bar); border-bottom: 1px solid var(--border); font-size: 13px; }
  #bar .title { font-weight: 700; }
  #bar .sub { color: var(--fg-dim); }
  #bar .spacer { flex: 1; }
  #bar button { font: inherit; font-size: 12.5px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bar); color: var(--fg); cursor: pointer; }
  #bar button:hover { border-color: var(--accent); }
  #grid { flex: 1; min-height: 0; display: grid; gap: 3px; padding: 3px; background: var(--border); }
  .cell { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bar); border-radius: 6px; overflow: hidden; }
  .cell-head { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; font-size: 12px; color: var(--fg-dim); background: var(--bar); border-bottom: 1px solid var(--border); }
  .cell-head .lbl { font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-head .spacer { flex: 1; }
  .cell-head a { color: var(--fg-dim); text-decoration: none; font-size: 11.5px; white-space: nowrap; }
  .cell-head a:hover { color: var(--accent); }
  .cell iframe { flex: 1; width: 100%; border: 0; min-height: 0; background: #1e1e2e; }
  .cell.active { box-shadow: inset 0 0 0 2px var(--accent); }        /* 지금 입력 중인 세션 강조(#req) */
  .cell.active .cell-head .lbl { color: var(--accent); }
  #empty { margin: auto; color: var(--fg-dim); font-size: 14px; }
  /* 첫 진입 안내 팝업(#req) — 세션 이동 단축키 소개. '다시 보지 않기'로 localStorage 영속. */
  #help-ov { position: fixed; inset: 0; background: rgba(10,14,22,.55); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  #help-box { max-width: 430px; width: calc(100% - 32px); background: var(--bar); color: var(--fg); border: 1px solid var(--border); border-radius: 14px; padding: 22px 22px 16px; box-shadow: 0 16px 48px rgba(10,14,22,.4); }
  #help-box h2 { margin: 0 0 12px; font-size: 16px; }
  #help-box p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.65; color: var(--fg-dim); }
  #help-box kbd { font: inherit; font-size: 12px; font-weight: 700; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  #help-box .note { font-size: 12px; color: var(--fg-dim); }
  #help-box .help-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
  #help-box label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-dim); cursor: pointer; user-select: none; }
  #help-box .help-close { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; }
  #help-box .help-close:hover { filter: brightness(1.06); }
</style>
</head>
<body>
<div id="bar">
  <span class="title">터미널 그리드</span>
  <span class="sub" id="count"></span>
  <span class="spacer"></span>
  <button id="btn-reload" title="모든 셀 새로고침">↻ 새로고침</button>
  <button id="btn-close" title="이 탭 닫기">닫기</button>
</div>
<div id="grid"></div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var ids = (p.get('sessions') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var labels = [];
  try { labels = JSON.parse(p.get('labels') || '[]'); } catch (e) { labels = []; }
  if (!Array.isArray(labels)) labels = [];
  var n = ids.length;
  var cols = Math.max(1, parseInt(p.get('cols'), 10) || 0);
  var rows = Math.max(1, parseInt(p.get('rows'), 10) || 0);
  // 안전 폴백 — cols/rows 없거나 부족하면 정사각형에 가깝게.
  if (!cols || !rows || cols * rows < n) { cols = Math.ceil(Math.sqrt(n || 1)); rows = Math.ceil((n || 1) / cols); }

  var grid = document.getElementById('grid');
  document.getElementById('count').textContent = n ? (n + '개 세션 · ' + cols + '×' + rows) : '';
  document.title = n ? ('터미널 그리드 (' + n + ') · Lively Box') : '터미널 그리드';

  if (!n) { grid.innerHTML = '<div id="empty">열 세션이 없습니다. 터미널 탭에서 세션을 선택해 다시 열어 주세요.</div>'; return; }

  grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
  grid.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';

  var nodes = (p.get('nodes') || '').split(','); // 세션별 실행 노드(#869) — sessions 와 인덱스 정렬, 빈 값=중앙
  var frames = [], cells = [], current = 0; // 세션 간 이동(#req)용 — iframe·셀 수집 + 현재 활성 셀
  ids.forEach(function (id, i) {
    var label = labels[i] || id;
    var url = '/ui/terminal.html?session=' + encodeURIComponent(id) + '&label=' + encodeURIComponent(labels[i] || '')
      + ((nodes[i] || '').trim() ? '&node=' + encodeURIComponent(nodes[i].trim()) : '');
    var cell = document.createElement('div'); cell.className = 'cell';
    var head = document.createElement('div'); head.className = 'cell-head';
    var lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = label; lbl.title = label;
    var sp = document.createElement('span'); sp.className = 'spacer';
    var pop = document.createElement('a'); pop.href = url; pop.target = '_blank'; pop.rel = 'noopener'; pop.textContent = '단독 열기 ↗'; pop.title = '이 세션만 새 탭으로';
    head.appendChild(lbl); head.appendChild(sp); head.appendChild(pop);
    var frame = document.createElement('iframe'); frame.src = url; frame.title = label;
    frame.setAttribute('allow', 'clipboard-read; clipboard-write');
    cell.appendChild(head); cell.appendChild(frame);
    grid.appendChild(cell);
    frames.push(frame); cells.push(cell);
  });

  document.getElementById('btn-close').onclick = function () { window.close(); };
  document.getElementById('btn-reload').onclick = function () {
    [].forEach.call(grid.querySelectorAll('iframe'), function (f) { try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } });
  };

  // ── 세션 간 포커스 이동(#req) — Ctrl+Tab(다음)/Ctrl+Shift+Tab(이전) ──────────────────────────
  //  각 셀은 그 자체가 xterm 터미널(same-origin iframe)이라 plain Tab 은 셸 자동완성용이라 못 쓴다.
  //  부모가 각 iframe 문서에 **capture 단계** keydown 을 달아 xterm 보다 먼저 가로채 preventDefault → 다음 셀 포커스.
  //  (Ctrl+Tab 을 브라우저 탭 전환으로 가로채는 브라우저에선 안 먹을 수 있어 — 그땐 셀 클릭으로 이동. 팝업에 안내.)
  function setActive(i, focus) {
    if (i < 0 || i >= cells.length) return;
    current = i;
    for (var k = 0; k < cells.length; k++) cells[k].classList.toggle('active', k === i);
    if (focus) {
      try {
        frames[i].contentWindow.focus();
        var doc = frames[i].contentDocument;
        var ta = doc && (doc.querySelector('.xterm-helper-textarea') || doc.querySelector('textarea'));
        if (ta) ta.focus();
      } catch (e) { /* same-origin 이 정상 — 접근 실패 시 조용히 무시 */ }
    }
  }
  function cycle(delta) {
    if (cells.length < 2) return;
    setActive(((current + delta) % cells.length + cells.length) % cells.length, true);
  }
  function onKey(e) {
    if (e.key === 'Tab' && e.ctrlKey && !e.altKey && !e.metaKey) { // Ctrl+Tab / Ctrl+Shift+Tab
      e.preventDefault(); e.stopPropagation();
      cycle(e.shiftKey ? -1 : 1);
    }
  }
  document.addEventListener('keydown', onKey, true);
  frames.forEach(function (f, i) {
    var wire = function () {
      try {
        var doc = f.contentDocument; if (!doc) return;
        doc.addEventListener('keydown', onKey, true);                          // xterm 보다 먼저 가로채기
        doc.addEventListener('mousedown', function () { setActive(i, false); }, true); // 클릭한 세션을 현재로
      } catch (e) { /* */ }
    };
    f.addEventListener('load', wire);
    try { if (f.contentDocument && f.contentDocument.readyState === 'complete') wire(); } catch (e) { /* */ }
  });
  setActive(0, false); // 첫 셀 강조(포커스는 사용자 클릭 전까지 뺏지 않음)

  // ── 첫 진입 안내 팝업(#req) — '다시 보지 않기' 체크 시 다시 안 뜸(localStorage 영속) ──────────────
  var HELP_KEY = 'lively_tgrid_nav_help_v1';
  if (localStorage.getItem(HELP_KEY) !== '1') {
    var ov = document.createElement('div'); ov.id = 'help-ov';
    ov.innerHTML =
      '<div id="help-box" role="dialog" aria-modal="true" aria-labelledby="help-t">'
      + '<h2 id="help-t">여러 세션, 키보드로 오가기</h2>'
      + '<p>지금 <b>' + n + '개 세션</b>이 한 그리드에 있어요. 한 세션에서 입력하다가 다음 세션으로 넘어가려면:</p>'
      + '<p><kbd>Ctrl</kbd>+<kbd>Tab</kbd> 다음 세션 &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Tab</kbd> 이전 세션</p>'
      + '<p class="note">셀을 클릭해도 그 세션으로 이동해요. (일부 브라우저가 Ctrl+Tab을 탭 전환으로 가로채면 셀 클릭을 쓰세요. 일반 Tab은 셸 자동완성용이라 쓰지 않아요.)</p>'
      + '<div class="help-row"><label><input type="checkbox" id="help-dontshow"> 다시 보지 않기</label>'
      + '<button class="help-close" id="help-close">닫기</button></div>'
      + '</div>';
    document.body.appendChild(ov);
    var closeHelp = function () {
      try { if (document.getElementById('help-dontshow').checked) localStorage.setItem(HELP_KEY, '1'); } catch (e) { /* */ }
      ov.remove();
    };
    document.getElementById('help-close').onclick = closeHelp;
    ov.addEventListener('click', function (e) { if (e.target === ov) closeHelp(); });          // 배경 클릭 닫기
    ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); closeHelp(); } });
    document.getElementById('help-close').focus();
  }
})();
</script>
</body>
</html>
