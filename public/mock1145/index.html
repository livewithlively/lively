<style>
  /* 한글 코딩 글꼴 D2Coding — 자체호스팅(public/fonts, OFL). #279 한글 가독성 (터미널 탭) */
  @font-face { font-family: 'D2Coding'; src: url('fonts/D2Coding.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'D2Coding'; src: url('fonts/D2Coding-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
  /* 터미널 세션 매니저 — 도그푸드 스코프 스타일 */
  .term-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .term-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--border, #e5e7eb); border-radius: 12px; background: var(--bg-tint, #fafafa); }
  .term-row-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .term-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .term-badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg, #eee); color: var(--fg-muted, #555); border: 1px solid var(--border, #ddd); }
  .term-badge.danger { background: #fdecec; color: #c0392b; border-color: #f5c6c6; }
  .term-badge.author { background: var(--bg-tint, #f6faff); color: var(--muted-head, #7a88a3); border-color: var(--line, #e6ecf5); }
  .term-row-name { flex: 0 0 200px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .term-fold { display: flex; align-items: center; gap: 5px; width: 100%; margin-top: 10px; padding: 8px 12px;
    background: var(--bg-tint, #f6faff); border: 1px solid var(--line, #e6ecf5); border-radius: 10px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-sub, #5a6b85); cursor: pointer; text-align: left; }
  .term-fold:hover { border-color: var(--blue, #2d6bf0); color: var(--ink, #15233b); }
  .term-fold-caret { font-size: 10px; width: 12px; }
  .term-section { margin-top: 18px; }
  .term-section--div { border-top: 1px solid var(--line, #e6ecf5); padding-top: 18px; }
  .term-section .term-section-title { margin: 0 0 4px; }
  .term-section-desc { font-size: 13.5px; margin: 0; }
  .term-lock-note { display: flex; gap: 7px; align-items: flex-start; margin: 4px 0 2px; padding: 10px 12px;
    font-size: 13.5px; line-height: 1.5; color: var(--ink-sub, #5a6b85); background: var(--bg-tint, #f6faff);
    border: 1px solid var(--line, #e6ecf5); border-radius: 9px; }
  .term-input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border, #ccc);
    border-radius: 8px; font: inherit; background: var(--bg, #fff); color: inherit; }
  .term-flags { display: flex; flex-direction: column; gap: 8px; }
  .term-picker { display: flex; flex-direction: column; gap: 5px; }
  .term-crumb { font-size: 12px; }
  .term-crumb .crumb { color: var(--accent, #16a37f); cursor: pointer; }
  .term-crumb .crumb:hover { text-decoration: underline; }
  .term-crumb .crumb-sep { color: var(--fg-muted, #999); }
  .term-auto { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; font-size: 13.5px; color: #b04a3a; line-height: 1.45; }
  .term-wrap { display: flex; flex-direction: column; height: calc(100vh - 120px); min-height: 360px; }
  .term-bar { display: flex; align-items: center; gap: 10px; padding: 6px 0 10px; }
  .term-bar-id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg-muted, #777); }
  .term-host { flex: 1; min-height: 0; background: #1e1e2e; border-radius: 10px; padding: 8px; overflow: hidden; }
</style>
<style>
 body { background: var(--bg-tint); padding: 24px; }
 .plan { margin-bottom: 34px; }
 .plan-h { font: 700 15px/1.4 inherit; color: var(--ink); margin: 0 0 10px; }
 .plan-h span { font-weight: 500; color: var(--muted-head); }
 .ov-box { margin: 0; }
</style>
</head><body>
<p class="plan-h" style="margin-bottom:18px">접힌 줄(▸)은 <b>실제로 눌러 펼칠 수 있습니다</b> · 카드도 실제로 선택됩니다.</p>
<div class="plan"><p class="plan-h">안 A <span>— 섹션으로 묶되 전부 보인다</span></p><div id="a"></div></div>
<div class="plan"><p class="plan-h">안 B <span>— 그룹마다 요약 한 줄로 접는다</span></p><div id="b"></div></div>
<div class="plan"><p class="plan-h">안 C <span>— 기본은 셋뿐, 나머지는 '고급 설정' 하나로</span></p><div id="c"></div></div>
<div class="plan"><p class="plan-h">안 D <span>— 한 줄 요약 + 펼치기</span></p><div id="d"></div></div>
<p class="plan-h" style="margin-top:28px">공통 규칙 <span>— 어느 안이든 「라이블리 모드」를 읽기전용·인코그니토로 바꾸면 기록 범위가 잠깁니다. 위 어느 안에서든 직접 눌러 보세요.</span></p>
