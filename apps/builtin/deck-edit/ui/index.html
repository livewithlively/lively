<!doctype html><meta charset="utf-8"><title>장표 수정</title>
<!--
  라이블리 앱 — 장표 수정 (#4596). 이 파일 하나로 완결된다(외부 스크립트·스타일·네트워크 없음).
  · 세션의 AI 가 올린 HTML 산출물(장표·보고서·시안)을 **판(version)** 단위로 받아 장표와 글 줄을 나란히 놓는다.
    글 줄을 고치면 장표에 바로 반영되고, 의견을 달고, [AI에게 보내기]로 묶음을 세션에 곧바로 보낸다(lively.chat.send).
  · 장표는 앱 안의 **중첩 iframe(srcdoc)** 에 그린다. 자식 문서는 출처가 따로라 DOM 에 못 닿으므로(실측 #4593) 머리에
    대리 스크립트(AGENT)를 끼우고 postMessage 로 글 줄 뽑기·고치기·좌표를 주고받는다. 글 줄 뽑는 규칙은 세일즈 덱
    워딩 시트(project/4577/세일즈덱/rv3/sheet.js)에서 옮겼다 — 굵게·색 꼬리표는 지키고, 숨은 글·번호 동그라미는 뺀다.
  · 판 = versions 표의 머리 1행 + 장 N행 + 꼬리 1행. 머리의 `__ASSET:<sha>__` 자리표는 assets 표(sha · seq 조각)로 메운다.
  · 배치 셋: 좁은 화면(곁 · 폭 640 미만) · 2열(장표 옆에 글 줄) · 2행(장표 폭 가득, 글 줄은 아래로 스크롤). 무대 칸은 늘
    장표 크기 그대로다(배율 = 칸 폭 ÷ 원본 폭) — 칸이 장표보다 크면 흰 띠가 남는다(2026-10-07 원준 지적).
  · 보내기는 **사람이 누른 동작 안에서** 끝나야 한다(호스트가 userActivation 을 본다): 누른 자리에서 묶음을 한 번의
    store.update 로 잠그고 곧바로 chat.send. 못 알렸으면 묶음은 잠긴 채 「다시 보내기」 띠를 남긴다.
  · 샌드박스 규칙: 폼 제출 금지(click·keydown) · 한글 조합 중 Enter 무시 · localStorage 없음(불투명 오리진) → 개인 설정은
    lively.prefs, 임시 상태만 메모리. SDK 가 아직 없는 호스트(chat·prefs 가 없을 때)에서도 깨지지 않게 기능을 감지한다.
  · 고치기: 이 앱의 모양을 바꾸고 싶으면 세션에 말한다(AI 가 app_pull → ui/index.html 수정 → app_save). 설명은 README.md.
-->
<style>
  :root {
    --ink: #15233B; --ink-sub: #49566B; --muted: #576889; --muted-2: #8A99B5; --line: #E6ECF5; --line-2: #D6DFEC;
    --bg: #fff; --soft: #F6F8FC; --soft-2: #EEF3FA; --blue: #2D6BF0; --blue-deep: #1E54CC; --blue-bg: #EEF4FF;
    --mint: #16C79A; --mint-deep: #0FA37E; --mint-bg: #EFFAF6; --coral: #E4756B; --coral-text: #B84E44; --coral-bg: #FDF1EF;
    --amber: #D99A5B; --amber-text: #8A5A14; --amber-bg: #FFF8EC; --yellow: #E9B400; --yellow-bg: #FFFBEA; --violet: #7B61E0; --violet-bg: #EFE9FF; --violet-text: #5B3FD0;
    --font: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --row-fs: 14.5px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E8EDF6; --ink-sub: #B6C1D4; --muted: #94A2BB; --muted-2: #6F7D96; --line: #2A3446; --line-2: #354158;
      --bg: #141A24; --soft: #1A2230; --soft-2: #202A3A; --blue: #5B8CFF; --blue-deep: #8FB0FF; --blue-bg: #1B2A48;
      --mint: #2ED3A6; --mint-deep: #3BD9AE; --mint-bg: #163328; --coral: #F08B82; --coral-text: #F3A49C; --coral-bg: #3A2320;
      --amber: #E0A964; --amber-text: #F0C98B; --amber-bg: #342A17; --yellow: #F0C230; --yellow-bg: #332D14; --violet-bg: #2A2450; --violet-text: #B7A6FF;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 13.5px/1.5 var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; letter-spacing: -.1px; word-break: keep-all; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  b { font-weight: 800; }
  .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .i.dots { stroke-width: 2.6; }
  .clip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 머리줄 ── */
  #top { flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--soft); position: relative; z-index: 16; }
  #docSel { flex: 0 1 220px; min-width: 84px; height: 28px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink); font: 700 13px var(--font); padding: 0 6px; text-overflow: ellipsis; }
  .pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 0 1 auto; min-width: 0; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: none; height: 28px; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink-sub); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .pill .n { font-size: 12px; font-weight: 800; border-radius: 5px; padding: 0 5px; background: rgba(255,255,255,.2); }
  .sp { flex: 1; min-width: 0; }
  .ib { flex: none; height: 28px; min-width: 28px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink-sub); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
  .ib:hover:not(:disabled) { border-color: var(--muted-2); color: var(--ink); }
  .ib.ic { padding: 0; width: 28px; }
  .ib.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ib.pri:hover:not(:disabled) { color: var(--bg); filter: brightness(1.12); }
  .ib:disabled { opacity: .42; cursor: default; }
  .seg { display: inline-flex; flex: none; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--bg); }
  .seg button { height: 26px; padding: 0 9px; border: 0; background: transparent; color: var(--ink-sub); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .menu { position: absolute; right: 10px; top: 40px; z-index: 25; min-width: 220px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 34px rgba(21,35,59,.18); padding: 5px; display: grid; }
  .menu button { height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .menu button:hover { background: var(--soft-2); }
  .menu button.hot { color: var(--blue-deep); font-weight: 800; }

  /* 띠(알림 한 줄) */
  .strip { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; background: var(--blue-bg); color: var(--blue-deep); }
  .strip span { flex: 1; min-width: 0; }
  .strip.warn { background: var(--amber-bg); color: var(--amber-text); border-bottom: 1px solid var(--line); }
  .strip.in { border-radius: 8px; }

  /* ── 몸통: 2열(cols) · 2행(rows) · 좁은 화면(narrow) ── */
  #main { flex: 1; min-height: 0; }
  #left { min-width: 0; }
  .leftIn { margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #right { min-width: 0; background: var(--bg); }
  /* 2열: 왼쪽은 장표 칸(제 스크롤), 오른쪽은 글 줄(머리 고정 + 목록 스크롤) */
  body.cols #main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 36%, 520px); }
  body.cols.big #main { grid-template-columns: minmax(0, 1fr) 320px; }
  body.cols #left { min-height: 0; overflow: auto; padding: 12px 14px 16px; border-right: 1px solid var(--line); }
  body.cols #right { min-height: 0; display: flex; flex-direction: column; }
  body.cols .rowsWrap { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 96px; }
  /* 2행: 한 칸이 통째로 스크롤된다 — 장표가 위(폭 가득), 글 줄은 그 아래 두 열 */
  body.rows #main { overflow-y: auto; }
  body.rows #left { padding: 12px 14px 4px; }
  body.rows #right { border-top: 1px solid var(--line); margin-top: 8px; }
  body.rows .rowsWrap { column-count: 2; column-gap: 20px; padding: 6px 14px 96px; }
  body.rows .rowsWrap > * { break-inside: avoid; }
  /* 좁은 화면(곁): 머리줄 → 장 띠 → 작은 장표 → 한 줄 → 글 줄 → 보내기 */
  body.narrow #main { display: flex; flex-direction: column; }
  body.narrow #left { flex: none; padding: 6px 10px 6px; }
  body.narrow .leftIn { gap: 6px; }
  body.narrow #right { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  body.narrow .rowsWrap { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 0 20px; }
  body.narrow .rh, body.narrow #sendBtn, body.narrow #docCmBtn, body.narrow #layoutSeg { display: none; }
  body.narrow .pill .n { display: none; }
  body.narrow #docSel { flex: 1 1 80px; }
  body.narrow .pills { flex: none; }

  /* 장 띠(번호 칩) */
  .chips { display: flex; flex-wrap: wrap; gap: 5px; padding-top: 6px; }
  body.narrow .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -10px; padding: 7px 10px 2px; }
  body.narrow .chips::-webkit-scrollbar { display: none; }
  .chip { position: relative; flex: none; min-width: 28px; height: 26px; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); color: var(--ink-sub); font: 700 12px var(--mono); display: inline-grid; place-items: center; }
  .chip:hover { border-color: var(--muted-2); color: var(--ink); }
  .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .chip.chg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--violet); }
  .chip.on.chg::after { background: #fff; }
  .chip i { position: absolute; right: -6px; top: -7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font: 800 12px/16px var(--font); font-style: normal; color: #fff; background: var(--coral); display: grid; place-items: center; }
  .chip i.e { background: var(--yellow); color: #3A2D00; }

  /* 장표 무대 — 칸 = 장표 크기 그대로(안쪽 여백 0 · 넘침 숨김). 테두리는 그림자로 그려 칸의 안쪽 크기를 건드리지 않는다. */
  .stage { position: relative; flex: none; width: 100%; overflow: hidden; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px var(--line-2), 0 6px 22px rgba(21,35,59,.09); }
  .stage.doc { overflow-y: auto; }
  .canvas { position: relative; width: 100%; height: 180px; overflow: hidden; }
  .canvas iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
  .hit { position: absolute; inset: 0; cursor: pointer; }
  body.narrow .hit { cursor: zoom-in; }
  .hl { position: absolute; pointer-events: none; border: 2px solid var(--blue); background: rgba(45,107,240,.10); border-radius: 4px; box-shadow: 0 0 0 3px rgba(45,107,240,.16); transition: all .08s; z-index: 3; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #576889; font-size: 13px; background: #F6F8FC; z-index: 4; }
  /* 좁은 화면에서 작은 장표를 누르면 크게 — 칸 가득 펴고 가로세로로 민다 */
  body.zoom .stage { position: fixed; left: 0; right: 0; top: 44px; bottom: 0; z-index: 15; border-radius: 0; overflow: auto; box-shadow: none; background: var(--soft-2); }
  body.zoom .hit { cursor: pointer; }
  #zoomClose { display: none; }
  body.zoom #zoomClose { display: inline-flex; position: fixed; right: 10px; top: 52px; z-index: 17; box-shadow: 0 4px 14px rgba(21,35,59,.2); }

  /* 장표 아래 한 줄: 「2 / 18 · 제목」 · 안 고르기 · ‹ › · 장 전체 의견 */
  .under { display: flex; align-items: center; gap: 6px; min-height: 28px; font-size: 13px; }
  .under .t { flex: 1; font-weight: 800; color: var(--ink); }
  .under .t small { font: 700 12px var(--mono); color: var(--muted); margin-right: 6px; }
  .vars { display: inline-flex; gap: 4px; align-items: center; flex: none; font-size: 12px; color: var(--muted); }
  .vars .v { height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink-sub); font-size: 12px; font-weight: 700; }
  .vars .v.on { background: var(--mint-bg); color: var(--mint-deep); border-color: var(--mint-deep); }
  .ib.sm { height: 26px; min-width: 26px; padding: 0 8px; font-size: 12px; }
  .ib.sm.ic { padding: 0; width: 26px; }
  .ib.has { color: var(--amber-text); border-color: var(--amber); background: var(--amber-bg); }
  body.cols #cmToggle { display: none; }
  .ta { width: 100%; resize: none; overflow: hidden; font: 500 13.5px/1.5 var(--font); color: var(--ink); background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; outline: none; min-height: 36px; display: block; }
  .ta:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(45,107,240,.12); }
  .ta::placeholder { color: var(--muted-2); font-weight: 500; }

  /* 글 줄 */
  .rh { flex: none; background: var(--bg); border-bottom: 1px solid var(--line); padding: 9px 14px 8px; }
  .rh b { display: block; font-size: 13.5px; }
  .rh span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .rh kbd { font: inherit; font-weight: 800; color: var(--ink); background: var(--soft-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; }
  .sep { margin: 8px 14px 2px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .2px; }
  .sep:empty { padding-top: 0; margin: 6px 14px 0; }
  .rowsWrap > .sep:first-child { border-top: 0; margin-top: 2px; padding-top: 4px; }
  .rowsWrap > .sep:first-child:empty { display: none; }
  body.rows .sep { margin-left: 0; margin-right: 0; }
  .row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px; padding: 2px 10px 2px 6px; border-left: 3px solid transparent; }
  body.rows .row { padding-left: 0; padding-right: 0; }
  .row:hover { background: var(--soft); }
  .row:focus-within { background: var(--soft-2); border-left-color: var(--blue); }
  .row.ed { border-left-color: var(--yellow); }
  .row.cm { border-left-color: var(--amber); }
  .row.ed.cm { border-left-color: var(--yellow); }
  .row.sent { opacity: .8; }
  .row.pinned { border-left-color: var(--amber); }
  .no { padding-top: 6px; text-align: right; font: 700 12px var(--mono); color: var(--muted-2); user-select: none; }
  .row.ed .no { color: var(--amber-text); }
  .col { min-width: 0; display: grid; gap: 4px; }
  .ed { font-size: var(--row-fs); line-height: 1.5; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 4px 8px; outline: none; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; min-height: 30px; }
  .row:hover .ed { border-color: var(--line-2); background: var(--bg); }
  .ed:focus { border-color: var(--blue); background: var(--bg); box-shadow: 0 0 0 3px rgba(45,107,240,.12); }
  .row.ed .ed { background: var(--yellow-bg); border-color: var(--yellow); border-width: 0 0 2px; border-radius: 6px 6px 0 0; }
  .row.del .ed::before { content: "(삭제) 이 글을 뺍니다"; color: var(--coral-text); font-weight: 700; }
  .row.del .ed { background: var(--coral-bg); }
  .ed[contenteditable=false] { cursor: default; }
  .orig { display: none; font-size: 12px; line-height: 1.45; font-weight: 600; color: var(--muted); padding: 0 8px; align-items: baseline; gap: 8px; }
  .row.ed .orig { display: flex; }
  .orig s { text-decoration-color: var(--muted-2); flex: 1 1 auto; min-width: 0; }
  .orig button { flex: none; font: 800 12px var(--font); color: var(--blue-deep); background: none; border: 0; padding: 0; text-decoration: underline; }
  .nt { display: none; width: 100%; resize: none; overflow: hidden; font: 600 13px/1.45 var(--font); color: var(--amber-text); background: var(--amber-bg); border: 1px dashed var(--amber); border-radius: 7px; padding: 5px 8px; outline: none; min-height: 30px; }
  .nt::placeholder { color: var(--amber); font-weight: 600; }
  .nt:focus { box-shadow: 0 0 0 3px rgba(217,154,91,.16); }
  .row:focus-within .nt, .row.cm .nt, .row.show .nt { display: block; }   /* 행의 cm 은 「의견 있음」 상태, nt 는 의견 칸 — 이름이 같으면 행이 사라진다 */
  .pin { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; font-weight: 700; color: var(--amber-text); background: var(--amber-bg); border-left: 3px solid var(--amber); border-radius: 6px; padding: 5px 9px; }
  .pin .i { width: 14px; height: 14px; margin-top: 2px; }
  .st { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 5px; padding: 0 6px; }
  .st.sent { background: var(--soft-2); color: var(--muted); }
  .st.chg { background: var(--violet-bg); color: var(--violet-text); }
  .tags { display: flex; gap: 6px; align-items: center; padding: 2px 8px 0; }
  .ai { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 4px 8px; line-height: 1.45; }
  .ai.applied { background: var(--mint-bg); color: var(--mint-deep); }
  .ai.declined { background: var(--soft-2); color: var(--muted); }
  .ai.options { background: var(--blue-bg); color: var(--blue-deep); }
  .fold { margin: 8px 14px 0; height: 30px; padding: 0 10px; border: 1px dashed var(--line-2); border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--soft); display: flex; align-items: center; gap: 6px; width: calc(100% - 28px); text-align: left; }
  body.rows .fold { margin-left: 0; width: 100%; }
  .fold .i { width: 14px; height: 14px; }
  .sentCm { padding: 10px 14px 0; }
  body.rows .sentCm { padding-left: 0; padding-right: 0; }
  .sentCm .lab { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 4px; }
  .orphans { margin: 10px 14px 0; font-size: 12.5px; color: var(--ink-sub); background: var(--amber-bg); border: 1px solid var(--amber); border-radius: 8px; padding: 7px 10px; }
  body.rows .orphans { margin-left: 0; margin-right: 0; }
  .orphans summary { font-weight: 800; color: var(--amber-text); cursor: pointer; }
  .orphans pre { margin: 6px 0 0; white-space: pre-wrap; font: 12px/1.55 var(--mono); color: var(--ink); }

  /* 좁은 화면 아래 보내기 */
  #sendBar { display: none; flex: none; border-top: 1px solid var(--line); padding: 8px 10px 9px; background: var(--soft); }
  body.narrow #sendBar { display: block; }
  #sendBar .ib.pri { width: 100%; height: 36px; font-size: 13px; }
  #sendBar .fine { text-align: center; margin-top: 4px; }

    $('rows').scrollTop = 0;
  }
  /** 장표 아래 한 줄: 「2 / 18 · 제목」(말줄임) · 안 고르기 · ‹ › · 장 전체 의견(좁은 화면 · 2행에서는 눌러야 펴진다). */
  function renderUnder(s) {
    var u = $('under'); u.innerHTML = '';
    var t = el('span', 't clip'); t.title = s.title;
    if (st.mode === 'slides') t.appendChild(el('small', '', (s.i + 1) + ' / ' + st.sections.length));
    t.appendChild(document.createTextNode(s.title));
    u.appendChild(t);
    var v = st.verCache[st.doc + '#' + st.ver]; var vars = v ? variantsOf(v, s.id) : [];
    if (vars.length > 1) {
      var w = el('span', 'vars'); if (!st.layoutNarrow) w.appendChild(el('span', '', '안 고르기'));
      var picked = pickOf(s.id); if (picked == null) picked = vars[0];
      vars.forEach(function (vn, i) { var b = el('button', 'v' + (vn === picked ? ' on' : '')); b.type = 'button'; b.textContent = vn || (i + 1) + '안'; b.onclick = function () { pick(s.id, vn).catch(fail); }; w.appendChild(b); });
      u.appendChild(w);
    }
    if (st.sections.length > 1) {
      var p = el('button', 'ib sm ic'); p.type = 'button'; p.innerHTML = svg('left'); p.title = '앞 장'; p.setAttribute('aria-label', '앞 장'); p.disabled = s.i <= 0; p.onclick = function () { showSlide(s.i - 1).catch(fail); };
      var n = el('button', 'ib sm ic'); n.type = 'button'; n.innerHTML = svg('right'); n.title = '다음 장'; n.setAttribute('aria-label', '다음 장'); n.disabled = s.i >= st.sections.length - 1; n.onclick = function () { showSlide(s.i + 1).catch(fail); };
      u.appendChild(p); u.appendChild(n);
    }
    var sr = scopeRow('slide', s.id); var has = !!(sr && sr.note && String(sr.note).trim());
    var tg = el('button', 'ib sm' + (has ? ' has' : '')); tg.type = 'button'; tg.id = 'cmToggle';
    tg.innerHTML = svg('plus') + '<span>장 전체 의견</span>';
    tg.onclick = function () { st.cmOpen[s.id] = !cmShown(s.id); syncSlideCm(s.id); if (cmShown(s.id)) $('slideCm').focus(); };
    u.appendChild(tg);
    var ta = $('slideCm'); ta.value = sr ? (sr.note || '') : '';
    syncSlideCm(s.id);
  }
  /** 장 전체 의견 칸이 펴져 있나 — 2열은 늘 펴져 있고, 좁은 화면 · 2행은 적어 둔 것이 있거나 눌렀을 때만. */
  function cmShown(sid) {
    if (document.body.classList.contains('cols')) return true;
    if (st.cmOpen[sid] != null) return !!st.cmOpen[sid];
    var sr = scopeRow('slide', sid); return !!(sr && sr.note && String(sr.note).trim());
  }
  function syncSlideCm(sid) { var ta = $('slideCm'); ta.hidden = !cmShown(sid); if (!ta.hidden) autoGrow(ta); }
  async function pick(sid, variant) {
    var ex = st.picks.filter(function (x) { return x.doc === st.doc && Number(x.ver) === st.ver && x.slide_id === sid; })[0];
    if (ex) { await sdk.store.update('picks', { id: ex.id }, { variant: variant }); ex.variant = variant; }
    else { var row = { doc: st.doc, ver: st.ver, slide_id: sid, variant: variant, session: L.session || '' }; var ins = await sdk.store.insert('picks', row); row.id = ins && ins.id; st.picks.push(row); }
    var v = st.verCache[st.doc + '#' + st.ver]; var fi = st.cur;
    await mount(assemble(v)); await showSlide(fi);
  }
  $('slideCm').addEventListener('input', function () {
    var ta = $('slideCm'); autoGrow(ta); var sid = st.sections[st.cur] && st.sections[st.cur].id; if (!sid) return;
    var tg = $('cmToggle'); if (tg) tg.classList.toggle('has', !!ta.value.trim());
    schedule('slide:' + sid, async function () { await upsertScope('slide', sid, ta.value); renderChips(); renderSend(); });
  });
  $('docCm').addEventListener('input', function () { schedule('doc', async function () { await upsertScope('doc', '', $('docCm').value); renderSend(); }); });

  /* ───────────── 보내기 ───────────── */
  //  보내기는 **사람이 누른 동작 안에서** 끝나야 한다 — 호스트가 chat.send 를 받을 때 userActivation 을 본다(타이머 · 데이터 콜백에서
  //   보내면 -32001). 그래서 [세션에 보내기]를 누른 자리에서 ① 묶음 번호를 이미 읽어 둔 행으로 셈하고 ② 한 번의 store.update 로
  //   이 문서의 초안을 통째로 잠그고(행마다 따로 부르지 않는다 — 누름이 유효한 몇 초 안에 끝나야 한다) ③ 곧바로 chat.send 한다.
  //   못 알렸으면(세션이 멈췄다 · 거부됐다) 묶음은 잠긴 채 두고 「다시 보내기」 띠를 남긴다 — 다시 누르는 것이 새 사람 동작이다.
  function mine(c) { return c.doc === st.doc; }   // 이 문서의 초안은 화면에 보이는 그대로 한 묶음이다(다른 세션에서 남긴 초안이 보이면 그것도 같이 간다)
  function countsOf(rows) {
    var o = { e: 0, n: 0, s: 0, d: 0, bySlide: {} };
    rows.forEach(function (c) {
      if (c.scope === 'doc') { o.d++; return; }
      var k = c.slide_id || '?'; var b = o.bySlide[k] = o.bySlide[k] || { e: 0, n: 0, s: 0 };
      if (c.scope === 'slide') { o.s++; b.s++; return; }
      if (c.edited != null) { o.e++; b.e++; }
      if (c.note && String(c.note).trim()) { o.n++; b.n++; }
    });
    return o;
  }
  function lineFor(rows, bundle, ver) {
    var c = countsOf(rows);
    var picksN = st.picks.filter(function (x) { return x.doc === st.doc && Number(x.ver) === Number(ver); }).length;
    return '[장표 수정] ' + st.title + ' · 판 ' + ver + ' · 고친 글 ' + c.e + ' · 의견 ' + c.n + ' · 장 전체 의견 ' + c.s + (c.d ? ' · 문서 의견 ' + c.d : '') + (picksN ? ' · 고른 안 ' + picksN : '') + ' → 반영해 주세요 (묶음 #' + bundle + ')';
  }
  function sendSummary() {
    var ds = drafts().filter(mine);
    var maxB = 0; st.comments.forEach(function (c) { if (c.doc === st.doc && c.bundle && Number(c.bundle) > maxB) maxB = Number(c.bundle); });
    var c = countsOf(ds);
    return { ds: ds, c: c, bundle: maxB + 1, msg: lineFor(ds, maxB + 1, st.ver), total: ds.length };
  }
  /** 가장 최근 묶음이 «보냈는데 답이 하나도 없다» 면 다시 알릴 수 있다(앱을 다시 열었을 때도). */
  function pendingBundle() {
    var rows = st.comments.filter(function (c) { return mine(c) && c.bundle; });
    if (!rows.length) return null;
    var k = Math.max.apply(null, rows.map(function (c) { return Number(c.bundle); }));
    var mineK = rows.filter(function (c) { return Number(c.bundle) === k; });
    if (mineK.some(function (c) { return c.status !== 'sent' || (c.reply && String(c.reply).trim()); })) return null;
    var ver = Math.max.apply(null, mineK.map(function (c) { return Number(c.ver) || 0; }));
    return { bundle: k, msg: lineFor(mineK, k, ver || st.ver) };
  }
  function renderSend() {
    var sm = sendSummary(); var label = (sdk.chat ? 'AI에게 보내기' : '고친 글과 의견 복사') + (sm.total ? ' · ' + sm.total : '');
    ['sendBtn', 'sendBtn2'].forEach(function (id) { var b = $(id); b.textContent = label; b.disabled = !sm.total; });
    $('sendFine').textContent = sdk.chat ? (sm.total ? '누르면 세션에 바로 전달됩니다 · 묶음 #' + sm.bundle : '고친 글이나 의견이 생기면 보낼 수 있습니다') : '세션에 붙여 연 화면이 아니라 복사해서 붙여 넣습니다';
  }
  async function openSend() {
    await flushSaves();   // 방금 친 글이 아직 저장 대기 중일 수 있다 — 묶음을 잠그기 전에 내려 쓴다(여기는 아직 «보내기» 누름이 아니다)
    var sm = sendSummary(); if (!sm.total) { toast('아직 고친 글이나 의견이 없습니다'); renderSend(); return; }
    $('smTitle').textContent = '묶음 #' + sm.bundle + ' · 판 ' + st.ver + ' · ' + st.title;
    var list = $('smList'); list.innerHTML = '';
    st.sections.forEach(function (s) { var b = sm.c.bySlide[s.id]; if (!b) return; var parts = []; if (b.e) parts.push('고친 글 ' + b.e); if (b.n) parts.push('의견 ' + b.n); if (b.s) parts.push('장 전체 의견 ' + b.s); list.appendChild(el('span', 'clip', (st.mode === 'slides' ? (s.i + 1) + '쪽 · ' : '') + s.title)); list.appendChild(el('span', '', parts.join(' · '))); });
    if (sm.c.d) { list.appendChild(el('span', '', '문서 전체')); list.appendChild(el('span', '', '의견 ' + sm.c.d)); }
    $('smMsg').textContent = sm.msg;
    $('smGo').textContent = sdk.chat ? '세션에 보내기' : '복사하기';
    $('smFine').textContent = sdk.chat ? '보내면 이 묶음은 잠기고, 그 뒤에 고치는 것은 묶음 #' + (sm.bundle + 1) + ' 이 됩니다.' : '복사한 글을 세션 입력칸에 붙여 넣으세요. 묶음은 지금처럼 잠깁니다.';
    $('sendModal').hidden = false;
  }
  function exportText(sm) {   // 세션에 바로 보낼 수 없는 화면에서 붙여 넣을 전문
    var out = [sm.msg, '', '(앱 표 comments 의 묶음 #' + sm.bundle + ' 과 같은 내용 · 줄 나눔은 / 로)'];
    st.sections.forEach(function (s) {
      var lines = [];
      sm.ds.forEach(function (c) { if (c.slide_id !== s.id) return; if (c.scope === 'slide') { lines.push('· 장 전체 의견: ' + c.note); return; } lines.push('- 원문: 「' + String(c.orig || '').replace(/\n/g, ' / ') + '」'); if (c.edited != null) lines.push('  고친 글: ' + (c.edited ? '「' + c.edited.replace(/\n/g, ' / ') + '」' : '(삭제)')); if (c.note && String(c.note).trim()) lines.push('  의견: ' + String(c.note).trim()); });
      if (lines.length) { out.push('', '[' + (s.i + 1) + '쪽 · ' + s.title + ' · id ' + s.id + ']'); out = out.concat(lines); }
    });
    sm.ds.forEach(function (c) { if (c.scope === 'doc') out.push('', '[문서 전체 의견]', c.note); });
    return out.join('\n');
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove(); return ok;
  }
  /** 세션에 한 줄을 알린다. 못 알리면 띠를 남긴다(묶음은 이미 잠겨 있다). 반드시 click 핸들러에서 곧바로 부른다. */
  async function notify(bundle, msg) {
    var why = '';
    try {
      var r = await sdk.chat.send(msg);
      if (r && r.sent) { st.unnotified = null; renderBanner(); toast('세션에 보냈습니다 · 묶음 #' + bundle); return true; }
      why = r && r.draft ? '세션이 멈춰 있어 입력칸에 넣어 두었어요' : '세션 화면을 열고 다시 보내 주세요';
    } catch (e) { why = e && e.message ? e.message : String(e); }
    st.unnotified = { bundle: bundle, msg: msg, why: why }; renderBanner();
    return false;
  }
  function renderBanner() {
    var b = $('notifyBanner'), u = st.unnotified;
    b.hidden = !u; if (!u) { renderMenu(); return; }
    b.querySelector('span').textContent = '묶음 #' + u.bundle + ' 는 저장됐지만 세션에 알리지 못했어요' + (u.why ? ' · ' + u.why : '');
    renderMenu();
  }
  $('notifyRetry').addEventListener('click', function () { var u = st.unnotified; if (u) notify(u.bundle, u.msg); });
  $('notifyClose').addEventListener('click', function () { st.unnotified = null; renderBanner(); });
  async function doSend() {
    var sm = sendSummary(); if (!sm.total) return;
    var go = $('smGo'); go.disabled = true;
    try {
      var when = nowIso();
      await sdk.store.update('comments', { doc: st.doc, status: 'draft' }, { status: 'sent', bundle: sm.bundle, sent_at: when });   // 묶음을 한 번에 잠근다
      sm.ds.forEach(function (c) { c.bundle = sm.bundle; c.status = 'sent'; c.sent_at = when; });
      $('sendModal').hidden = true;
      if (sdk.chat) await notify(sm.bundle, sm.msg);
      else toast((await copyText(exportText(sm))) ? '복사했습니다 · 세션 입력칸에 붙여 넣으세요' : '복사하지 못했어요 · 묶음 #' + sm.bundle + ' 는 저장됐습니다', 3000);
      renderRows();
    } catch (e) { toast('보내지 못했어요: ' + (e && e.message ? e.message : e), 3200); }
    go.disabled = false;
  }
  $('sendBtn').addEventListener('click', function () { openSend().catch(fail); });
  $('sendBtn2').addEventListener('click', function () { openSend().catch(fail); });
  $('smGo').addEventListener('click', function () { doSend(); });
  function openDocCm() { var r = scopeRow('doc', ''); $('docCm').value = r ? r.note : ''; $('docCmModal').hidden = false; $('docCm').focus(); }
  $('docCmBtn').addEventListener('click', openDocCm);
  [].forEach.call(document.querySelectorAll('.modal [data-close]'), function (b) { b.addEventListener('click', function () { b.closest('.modal').hidden = true; }); });
  [].forEach.call(document.querySelectorAll('.modal'), function (m) { m.addEventListener('click', function (e) { if (e.target === m) m.hidden = true; }); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      [].forEach.call(document.querySelectorAll('.modal'), function (m) { m.hidden = true; });
      $('menu').hidden = true; if (st.zoom) setZoom(false);
      return;
    }
    var t = e.target; if (t && (t.isContentEditable || /^(TEXTAREA|INPUT|SELECT)$/.test(t.tagName))) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (st.cur == null) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); showSlide(Math.min(st.sections.length - 1, st.cur + 1)).catch(fail); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showSlide(Math.max(0, st.cur - 1)).catch(fail); }
  });

  /* ───────────── 표시 설정 ───────────── */
  $('prefsBtn').addEventListener('click', function () { $('prefsModal').hidden = false; });
  //  호스트의 앱 탭 ⋯ 메뉴 「표시 설정」 — 구독해야 그 항목이 켜진다(구독하지 않은 앱은 흐리게 뜬다).
  sdk.onPrefsOpen(function () { $('prefsModal').hidden = false; });
  function choose(k, v) {
    var p = {};
    if (k === 'slide') { var cur = st.prefs.slide && typeof st.prefs.slide === 'object' ? Object.assign({}, st.prefs.slide) : {}; cur[pref('layout')] = v; p.slide = cur; }
    else p[k] = v;
    setPref(p); applyPrefs();
  }
  [].forEach.call($('layoutSeg').children, function (b) { b.addEventListener('click', function () { choose('layout', b.getAttribute('data-l')); }); });
  [].forEach.call(document.querySelectorAll('#prefsModal .seg[data-pref]'), function (seg) { var k = seg.getAttribute('data-pref'); [].forEach.call(seg.children, function (b) { b.addEventListener('click', function () { choose(k, b.getAttribute('data-v')); }); }); });
  [].forEach.call(document.querySelectorAll('#prefsModal input[data-pref]'), function (c) { c.addEventListener('change', function () { choose(c.getAttribute('data-pref'), c.checked); }); });

  /* 머리줄 ⋯ 메뉴 — 늘 있는 것이 아니라, 넣을 것이 있을 때만 단추가 선다. */
  function menuItems() {
    var items = [];
    var pb = sdk.chat && !st.unnotified ? pendingBundle() : null;
    if (pb) items.push({ label: '묶음 #' + pb.bundle + ' 다시 알리기', hot: true, run: function () { notify(pb.bundle, pb.msg); } });
    if (st.layoutNarrow && st.doc) items.push({ label: '문서 전체 의견', run: openDocCm });
    if (!st.allDocs && st.docs.length > myDocs().length) items.push({ label: '다른 세션에서 올린 문서 보기', run: function () { st.allDocs = true; renderDocSel(); renderMenu(); toast('문서 고르는 칸에 다른 세션의 문서가 함께 보입니다'); } });
    return items;
  }
  function renderMenu() {
    var items = menuItems(); var box = $('menu');
    $('moreBtn').hidden = !items.length; if (!items.length) box.hidden = true;
    box.innerHTML = '';
    items.forEach(function (it) { var b = el('button', it.hot ? 'hot' : '', it.label); b.type = 'button'; b.onclick = function () { box.hidden = true; it.run(); }; box.appendChild(b); });
  }
  $('moreBtn').addEventListener('click', function (e) { e.stopPropagation(); renderMenu(); $('menu').hidden = !$('menu').hidden; });
  document.addEventListener('click', function (e) { if (!$('menu').hidden && !$('menu').contains(e.target)) $('menu').hidden = true; });

  $('docSel').addEventListener('change', function () { var v = $('docSel').value; if (v && v !== st.doc) openDoc(v).catch(fail); });
  $('allDocsBtn').addEventListener('click', function () { st.allDocs = true; boot(true).catch(fail); });
  $('newVerBanner').querySelector('button').addEventListener('click', function () { var latest = st.vers[st.vers.length - 1]; if (latest) openVersion(latest).catch(fail); });
  window.addEventListener('resize', function () { if (applyLayout()) applyPrefs(); });
  new ResizeObserver(function () { fit(); }).observe($('left'));
  function fail(e) { toast('문제가 생겼어요: ' + (e && e.message ? e.message : e), 3500); console.error(e); }

  /* ───────────── 바깥에서 데이터가 바뀌면(세션의 AI 가 썼다) ───────────── */
  var reloadT = 0;
  sdk.store.onChange && sdk.store.onChange(function (ev) {
    if (ev && ev.source === 'app-ui') return;
    clearTimeout(reloadT);
    reloadT = setTimeout(async function () {
      try {
        var before = st.vers.slice(); await loadDocs(); renderDocSel();
        if (!st.doc) { boot(false); return; }
        await loadVersionMeta(st.doc); await loadComments(st.doc);
        var latest = st.vers[st.vers.length - 1];
        if (latest && before.indexOf(latest) < 0 && latest !== st.ver) { var b = $('newVerBanner'); b.querySelector('span').textContent = '새 판 ' + latest + ' 이 올라왔습니다'; b.hidden = false; }
        // 지금 판에 안(variant)이 더 올라왔으면 장표를 다시 조립한다(고치던 줄은 데이터라 그대로)
        var key = st.doc + '#' + st.ver; var old = st.verCache[key]; delete st.verCache[key];
        var fresh = await loadVersion(st.doc, st.ver);
        var sig = function (v) { return v.slides.map(function (x) { return x.slide_id + '|' + (x.variant || ''); }).join(','); };
        if (old && sig(old) !== sig(fresh) && st.cur != null) { var fi = st.cur; await mount(assemble(fresh)); await showSlide(fi); toast('새 안이 올라왔습니다 · 장표 아래에서 고르세요'); }
        renderVers(); renderRows(); renderMenu();
      } catch (e) { console.error(e); }
    }, 600);
  });

  /* ───────────── 시작 ───────────── */
  async function boot(keepDoc) {
    if (!L.session) sdk.chat = null;   // 세션에 붙어 열린 화면이 아니면 보낼 곳이 없다 — 보내기는 「복사」가 된다
    try { st.prefs = (await sdk.prefs.get()) || {}; } catch (e) { st.prefs = {}; }
    await loadDocs();
    var vis = visibleDocs();
    $('empty').hidden = !!vis.length; $('main').hidden = !vis.length; $('top').hidden = !vis.length;
    if (!vis.length) {
      var others = st.docs.length - myDocs().length;
      $('allDocsBtn').hidden = !(others > 0 && !st.allDocs);
      $('allDocsBtn').textContent = '다른 세션에서 올린 문서 보기 · ' + others;
      if (st.allDocs) { $('emptyT').textContent = '올라온 문서가 없어요'; $('emptyP').textContent = '어느 세션에서도 아직 문서를 올리지 않았습니다. 세션의 AI 가 HTML 을 만들면 여기에 올라옵니다.'; }
      return;
    }
    applyPrefs();
    renderDocSel();
    var want = (keepDoc && st.doc) || pref('lastDoc');
    var d = vis.filter(function (x) { return x.doc === want; })[0] || vis[0];
    await openDoc(d.doc);
  }
  L.ready.then(function () { return boot(false); }).catch(fail);
})();
</script>
