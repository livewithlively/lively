<!--
  라이블리 앱 — 장표 수정 (#4596). 이 파일 하나로 완결된다(외부 스크립트·스타일·네트워크 없음).
  · 세션의 AI 가 올린 HTML 산출물(장표·보고서·시안)을 **판(version)** 단위로 받아 장표와 글 줄을 나란히 놓는다.
    글 줄을 고치면 장표에 바로 반영되고, 의견을 달고, [AI에게 보내기]로 묶음을 세션에 곧바로 보낸다(lively.chat.send).
  · 장표는 앱 안의 **중첩 iframe(srcdoc)** 에 그린다. 자식 문서는 출처가 따로라 DOM 에 못 닿으므로(실측 #4593) 머리에
    대리 스크립트(AGENT)를 끼우고 postMessage 로 글 줄 뽑기·고치기·좌표를 주고받는다. 글 줄 뽑는 규칙은 세일즈 덱
    워딩 시트(project/4577/세일즈덱/rv3/sheet.js)에서 옮겼다 — 굵게·색 꼬리표는 지키고, 숨은 글·번호 동그라미는 뺀다.
  · 판 = versions 표의 머리 1행 + 장 N행 + 꼬리 1행. 머리의 `__ASSET:<sha>__` 자리표는 assets 표(sha · seq 조각)로 메운다.
  · 배치는 둘 — 2열(왼쪽에 장이 세로로 이어진 칸, 오른쪽에 지금 장의 글 줄) · 2행(위에 장표, 아래에 글 줄). **고른 배치는 폭이
    좁아도 그대로 선다**(원준 2026-10-07 「옵션으로 하려면 하드하게 정해져야지」). 고른 적이 없을 때만 폭으로 정한다(640 미만 = 2행).
    좁은 폭(compact)은 배치가 아니라 촘촘함이다(머리줄 단추 줄임 · 보내기는 바닥 막대).
  · 무대(stage)는 **장들이 세로로 이어진 칸**이다 — 자식 문서가 모든 장을 위에서 아래로 놓고(대리 스크립트), 무대가 그 위를 민다.
    2열은 칸 높이만큼, 2행은 한 장 높이만큼 보인다. 지금 장 = 가장 많이 보이는 장(밀면 따라온다) 또는 누른 장.
    글 줄 칸(rowsScroll)은 무대와 따로 민다 — 장표의 아래쪽 글을 눌러도 장표는 제자리에 있고 글 줄만 그 줄로 간다.
  · 문서는 세션으로 가르지 않는다 — 앱의 표는 워크스페이스에 하나이고, 장표는 세션보다 오래 산다(세션은 닫히고 복제되고 옮겨진다).
    문서 고르기에는 전부가 뜨고(이 세션에서 올린 것이 먼저), 세션은 「어디로 보내나 · 누가 올렸나」 로만 남는다.
    이 세션에 열 문서가 아직 없으면 **불러오기 화면**이 선다: 이 세션 프로젝트의 자료에 있는 HTML(lively.files · 최신순)과 앱에 있는 문서를
    눌러서 연다. 파일은 앱이 그 자리에서 나눠 올린다(아래 deck-split 블록 — bin/deck-push.mjs 와 같은 글).
  · 도구는 저마다 **그것만** 한다(원준 2026-10-08 «각각의 모드에서는 명확하게 그것만»): 고르기 = 글과 디자인 개체를 고른다(핀을 꽂지 않는다) ·
    핀 = 누른 자리에 핀 · 영역 = 끌어서 상자. 고르기에서 글이 아닌 것(상자 · 도식 · 그림)을 누르면 대리 스크립트가 그 자리의 개체를 찾아(pick)
    그 테두리로 의견을 단다(unit_key `obj:x,y,w,h` · orig 에 개체의 꼴과 안의 글). 빈 자리는 아무 일도 없다.
  · 글 칸에서 글을 끌어 고르면 **색 강조 · 굵게 · 풀기** 가 뜬다 — 강조의 자리를 사람이 정한다. 고친 글(edited)에는 `==색 강조==` · `**굵게**` 표시로 남고,
    장표에는 그 글 줄이 원래 쓰던 강조 꼴(없으면 문서의 다른 곳에서 쓰는 꼴)로 그린다. 표시를 뺀 글이 원문과 맞는지로 행을 글 줄에 붙인다(unmark).
  · 글이 아닌 것(그림 · 도식 · 빈 자리)에는 **자리 의견**을 단다(comments.scope 'spot'): 핀(한 점) · 영역(끌어서 상자) · 개체(고른 것의 테두리).
  · **장 순서는 들어서 옮긴다**(원준 2026-10-08 «들어서 옮기는 것처럼 · 구분선으로 어디 들어가는지 · 앞뒤가 어떤 슬라이드인지»): 번호 줄의 번호를 끌면 번호가
    손을 따라오고 들어갈 자리에 구분선이 서며 다른 번호들이 비켜난다. 끄는 동안 무대가 줄어 앞뒤 장이 함께 보이고(st.overview) 든 장이 새 자리로 미끄러져
    들어간다(자식 문서의 놓는 순서를 그때그때 바꾼다 — order {anim, lift}). 옆에 앞 · 여기 · 뒤의 장 제목이 뜬다. 좁은 2열에서는 장 목록의 장을 직접 든다
    (order {liftY} · liftmove — 장이 손을 따라오고 빈 자리가 열린다). 놓을 때 순서로 남긴다. Esc 는 거둔다.
  · **누르는 동안에는 다시 그리지 않는다**(whenUp): 사파리는 누른 것(mousedown 의 대상)이 떼기 전에 갈아 끼워지면 click 을 내지 않는다. 글을 고치고 곧바로
    보내기 · 장 번호를 누르면(칸을 떠나며 저장이 돌고, 저장이 끝나며 번호 줄 · 보내기 단추를 다시 그렸다) 그 누름이 사라졌다 — 저장 · 바깥 변경 뒤의 다시 그리기는
    손을 뗀 뒤로 미루고, 단추의 글은 글 마디를 갈지 않고 값만 바꾼다(setText).
  · **새 판이 오면 알리고, 사람이 누르면 연다**(원준 2026-10-09 «자동으로 띄우지 말고 … 로드할까요? 추가 수정분은 새 판에 얹습니다»): 올리기가 끝난 판
    (docs.latest_ver — 올리기는 판 행을 먼저 쓰고 문서 행을 맨 끝에 고친다)이 생기면 머리줄 아래 띠에 「AI가 판 N 을 만들었습니다」 + 「바뀐 곳 훑어보기」 · 「판 N 열기」.
    안 보낸 고침은 새 판으로 따라온다(원문이 같은 줄에 그대로). 그 사이 원문이 바뀐 줄은 가장 비슷한 줄에 **의견으로** 얹는다(adoptOrphans).
    보낸 뒤 답을 기다리는 동안은 머리줄에 「AI 고치는 중 m:ss」 가 선다(마냥 기다리지 않게).
  · **바뀐 곳 훑어보기**(review · 원준 2026-10-09 «전후 비교는 글이 아니라 그림으로»): 바뀐 **장**을 하나씩 — 왼쪽에 앞 판과 지금 판의 그 장을 실제로 그려
    나란히 세우고(좁으면 위아래), 「겹쳐 보기」 는 같은 자리에서 누르는 동안 앞 판을 보여 준다(깜빡여 견주기). 바뀐 글의 자리는 두 그림에 테두리로.
    두 판을 작은 틀(PEEK 스크립트 · 장 하나만 보이게) 둘에 따로 띄운다. 장이 «바뀌었나» 는 글이 아니라 그 장의 HTML 로 본다(그림 · 배치만 바뀐 장도 잡힌다).
    오른쪽에는 그 장의 바뀐 글(전 → 후)과 의견 칸. 앞 판의 글은 그 장의 HTML 에서 글 덩이를 뽑아(chunksOf) 가장 비슷한 것을 «전» 으로 짝짓는다.
  · **AI 의 질문은 앱 안에서 답한다**(원준 2026-10-09 «매번 세션을 열어 확인해야 한다 · 앱 안에서 결정하게»): 세션의 AI 가 사람의 결정이 필요하면 채팅에만 묻지 않고
    comments 에 scope 'ask' · status 'ask' 행을 쓴다(note = 질문 · orig = 선택지 줄마다 · slide_id = 관련 장). 앱은 띠 「AI가 결정을 기다립니다」 와 답하는 창을 띄우고,
    답하면 reply · status 'answered' 를 적고 그 누름 안에서 세션에 한 줄을 보낸다(AI 가 이어서 한다).
  · **의견이 가리키는 곳을 고른다**: 글 줄 칸 머리의 의견 칸은 「이 장」 · 「문서 전체」 를 눌러 바꾼다(한 칸 · 문서 전체는 보라).
  · **되돌리기**(⌘Z · 머리줄 ↶): 글 칸 안에서는 브라우저의 되돌리기 그대로(강조도 execCommand 로 넣어 거기 쌓인다). 칸 밖에서는 앱이 한 일을 되돌린다 —
    글 고침(칸을 떠날 때 한 걸음) · 원래대로 · 의견 · 자리 의견 지움 · 순서 바꿈.
  · 좁은 폭에서도 오른쪽이 잘리지 않는다 — 칸의 최소 폭은 비율로 줄고, 글 줄 칸이 좁으면 머리의 단추가 그림만 남는다(body.r-tight · r-tiny).
  · 장표 칸과 글 줄 칸의 **경계는 끌어서 정한다**(원준 2026-10-08): 2열은 폭, 2행은 높이. prefs.split 에 배치 · 넓이마다 따로(cw · cc · rw · rc = 장표 칸의 몫 0~1).
    끌어 정한 뒤에는 장표가 그 칸을 채운다(«한 화면에» 로 줄이지 않는다). 두 번 누르면 처음대로, 설정에서 장표 크기를 다시 고르면 그 고른 것이 선다. 자리는 장의 왼쪽 위 0,0 · 오른쪽 아래 1,1 비율로 unit_key 에(`pin:x,y` · `box:x,y,w,h`),
    그 자리에 무엇이 있는지(도식 · 가까운 글 · 영역 안의 글)는 대리 스크립트가 살펴 orig 에 적는다 — 세션의 AI 가 «어디» 인지 알도록.
  · 장 번호를 끌면 순서가 바뀐다 — 미리보기만 그 순서로 서고(자식 문서의 놓는 순서), «순서 바꾸기» 는 의견 한 줄(scope 'order')로 남아
    보내기에 실린다. 원본의 순서는 세션의 AI 가 바꾼다.
  · 문서는 자료의 HTML 뿐 아니라 **내 컴퓨터의 파일**로도 연다(파일 고르기 · 끌어다 놓기 — 샌드박스 안에서도 된다는 것을 실측했다).
  · 호스트가 화면 아래를 가리면(곁칸의 독) --lively-inset-bottom 으로 알려 준다 — 바닥 막대와 스크롤 끝을 그만큼 올린다.
  · **저장은 결코 잃지 않는다**(원준 2026-10-07 «가장 중요한 것 중 하나는 실시간 저장»). 친 글은 «바라는 값» 으로 메모리에 먼저 서고(st.want),
    줄(같은 글 줄 · 같은 의견 칸)마다 한 번에 하나씩 표에 쓴다 — 겹쳐 쓰면 같은 글 줄의 행이 둘 생긴다. 못 쓰면 버리지 않고 다시 쓴다(1초 → … → 15초).
    다 쓸 때까지 머리줄에 「저장 중」 · 「저장 안 됨」 이 서고, 글 줄을 다시 그려도 바라는 값이 그대로 보인다. 화면이 가려지거나 닫힐 때 · 칸을 떠날 때는
    기다리지 않고 곧바로 쓴다. 저장 안 된 것이 있으면 보내지 않는다.
  · 보낸 글은 화면에 남는다 — 그 판에서 이미 보낸 고친 글은 글 칸과 장표에 그대로 서고(회색 밑줄 · 「보냄 #K」), 그 위에 덧고친 것만 다음 묶음이 된다.
    덧고친 행의 orig 는 «바탕 글»(앞서 보낸 고친 글)이다 — AI 가 앞 묶음을 반영한 원본에서 그 글을 찾아 바꾸고, 새 판이 오면 그 글에 다시 붙는다.
  · **세로 공간은 본문의 것이다**(원준 2026-10-07 «본문보다 버튼으로 된 탭이 세로줄을 너무 많이 차지한다 … 비효율»). 장표 위에 서는 줄은 머리줄 하나뿐이다.
    장 번호는 장표 **왼쪽의 세로 줄**(rail)로, 장 제목 · 장 전체 의견은 글 줄 칸의 머리로, 도구(글 고르기 · 핀 · 영역)는 머리줄로, 판은 단추 하나(누르면 목록)로 갔다.
    앞뒤 넘기기 단추는 없앴다(세로 줄 · 무대 밀기 · 화살표 키가 같은 일을 한다).
  · 머리줄은 한 줄이다 — 문서 · 판 · 도구 · 저장 상태 · ⋯ · 보내기. 배치(2열/2행)와 문서 전체 의견은 ⋯ 안에 있다. 호스트가 메뉴를 열어 줄 수 있으면
    (lively.ui.openMenu) 호스트의 앱 머리줄을 접고(lively.ui.chrome) 앱의 ⋯ 하나에 두 메뉴를 합친다.
  · 보내기는 **사람이 누른 동작 안에서** 끝나야 한다(호스트가 userActivation 을 본다): 누른 자리에서 묶음을 한 번의
    store.update 로 잠그고 곧바로 chat.send. 못 알렸으면 묶음은 잠긴 채 「다시 보내기」 띠를 남긴다.
  · 샌드박스 규칙: 폼 제출 금지(click·keydown) · 한글 조합 중 Enter 무시 · localStorage 없음(불투명 오리진) → 개인 설정은
    lively.prefs, 임시 상태만 메모리. SDK 가 아직 없는 호스트(chat·prefs 가 없을 때)에서도 깨지지 않게 기능을 감지한다.
  · 고치기: 이 앱의 모양을 바꾸고 싶으면 세션에 말한다(AI 가 app_pull → ui/index.html 수정 → app_save). 설명은 README.md.
-->

  /* ── 머리줄 ── */
  #top { flex: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--soft); position: relative; z-index: 16; }
  .docBtn { flex: 0 1 240px; min-width: 72px; height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0 5px 0 9px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink); font: 700 13px var(--font); text-align: left; }
  .docBtn:hover, .docBtn[aria-expanded=true] { border-color: var(--muted-2); }
  .docBtn span { flex: 1; }
  .docBtn .i { width: 14px; height: 14px; color: var(--muted); }
  /* 문서 고르기 — 앱에 있는 문서 전부(이 세션 것 먼저) + 다른 HTML 불러오기 */
  .docMenu { position: absolute; left: 10px; top: 40px; z-index: 26; width: min(360px, calc(100vw - 20px)); max-height: min(72vh, 480px); overflow-y: auto; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 34px rgba(21,35,59,.18); padding: 5px; }
  .dm-l { padding: 7px 9px 3px; font-size: 12px; font-weight: 800; color: var(--muted); }
  .dm-i { width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 6px; align-items: center; padding: 6px 9px; border: 0; border-radius: 7px; background: none; text-align: left; }
  .dm-i:hover { background: var(--soft-2); }
  .dm-i .i { width: 14px; height: 14px; color: var(--blue); visibility: hidden; }
  .dm-i.on .i { visibility: visible; }
  .dm-i b { font-size: 13px; font-weight: 700; color: var(--ink); }
  .dm-i.on b { font-weight: 800; }
  .dm-i small { grid-column: 2; font-size: 12px; color: var(--muted); }
  .dm-add { width: 100%; display: flex; align-items: center; gap: 6px; height: 34px; margin-top: 4px; padding: 0 9px; border: 0; border-top: 1px solid var(--line); border-radius: 0 0 7px 7px; background: none; font-size: 13px; font-weight: 800; color: var(--blue-deep); text-align: left; }
  .dm-add:hover { background: var(--blue-bg); }
  .dm-add .i { width: 14px; height: 14px; }
  /* 판 — 단추 하나(지금 판). 누르면 목록이 내려온다(판이 늘어도 머리줄을 먹지 않는다) */
  .verBtn { flex: none; height: 28px; padding: 0 5px 0 9px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink-sub); font: 700 12.5px var(--font); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .verBtn:hover:not(:disabled), .verBtn[aria-expanded=true] { border-color: var(--muted-2); color: var(--ink); }
  .verBtn:disabled { cursor: default; padding-right: 9px; }
  .verBtn:disabled .i { display: none; }
  .verBtn .i { width: 14px; height: 14px; color: var(--muted); }
  .verBtn .n { font-size: 12px; font-weight: 800; border-radius: 5px; padding: 0 5px; background: var(--violet-bg); color: var(--violet-text); }
  body.compact .verBtn .n { display: none; }
  .pills { position: absolute; top: 36px; z-index: 26; min-width: 150px; max-height: min(60vh, 360px); overflow-y: auto; display: grid; gap: 2px; padding: 5px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 34px rgba(21,35,59,.18); }
  .pill { height: 30px; padding: 0 9px; border: 0; border-radius: 7px; background: none; color: var(--ink); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; text-align: left; }
  .pill:hover { background: var(--soft-2); }
  .pill.on { font-weight: 800; color: var(--blue-deep); }
  .pill .n { font-size: 12px; font-weight: 800; border-radius: 5px; padding: 0 5px; background: var(--violet-bg); color: var(--violet-text); }
  .sp { flex: 1; min-width: 0; }
  /* 저장 상태 — 다 쓰면 「저장됨」, 쓰는 중이면 「저장 중」, 못 쓰면 「저장 안 됨 N」(누르면 지금 다시) */
  .svst { flex: none; height: 28px; padding: 0 4px; border: 0; background: none; font: 700 12px var(--font); color: var(--muted-2); white-space: nowrap; cursor: default; }
  .svst.busy { color: var(--blue-deep); }
  /* 보낸 뒤 답을 기다리는 동안 — 「AI 고치는 중 m:ss」. 마냥 기다리지 않게: 도는 점과 흐른 시간 */
  .aist { flex: none; height: 24px; padding: 0 9px 0 8px; border-radius: 12px; background: var(--blue-bg); color: var(--blue-deep); font: 700 12px var(--font); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .aist[hidden] { display: none; }
  .aist b { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: aipulse 1.1s ease-in-out infinite; }
  .aist i { font: 700 12px var(--mono); font-style: normal; }
  @keyframes aipulse { 0%, 100% { opacity: .25; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.15); } }
  body.compact .aist .lb { display: none; }
  .svst.bad { color: var(--amber-text); background: var(--amber-bg); border-radius: 7px; padding: 0 8px; cursor: pointer; }
  #moreBtn.hot { color: var(--blue-deep); border-color: var(--blue); }
  .ib { flex: none; height: 28px; min-width: 28px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink-sub); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
  .ib:hover:not(:disabled) { border-color: var(--muted-2); color: var(--ink); }
  .ib.ic { padding: 0; width: 28px; }
  .ib.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ib.pri:hover:not(:disabled) { color: var(--bg); filter: brightness(1.12); }
  .ib:disabled { opacity: .42; cursor: default; }
  .ib.off { opacity: .5; }   /* 보낼 것이 없는 보내기 단추 — 흐리지만 눌린다(누르면 왜 못 보내는지 말한다 · 꺼 놓고 말이 없으면 «한 번 보내면 끝인가» 로 읽힌다) */
  .seg { display: inline-flex; flex: none; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--bg); }
  .seg button { height: 26px; padding: 0 9px; border: 0; background: transparent; color: var(--ink-sub); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .menu { position: absolute; right: 10px; top: 40px; z-index: 25; min-width: 220px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 34px rgba(21,35,59,.18); padding: 5px; display: grid; }
  .menu button { height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .menu button:hover { background: var(--soft-2); }
  .menu button.hot { color: var(--blue-deep); font-weight: 800; }

  /* 띠(알림 한 줄) */
  .strip { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; background: var(--blue-bg); color: var(--blue-deep); }
  .strip span { flex: 1; min-width: 0; }
  .strip.warn { background: var(--amber-bg); color: var(--amber-text); border-bottom: 1px solid var(--line); }
  .strip.in { flex: none; border-radius: 8px; }

  /* ── 몸통: 배치는 둘(2열 cols · 2행 rows) — 고른 대로 선다. 좁은 폭(compact · 640 미만)은 촘촘하게만 한다 ── */
  #main { flex: 1; min-height: 0; }
  #left { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .leftIn { width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  /* 장 번호 줄 + 무대 — 번호는 장표 왼쪽에 세로로 선다(세로 공간은 본문의 것이다) */
  .stageWrap { position: relative; flex: none; display: flex; min-height: 0; padding-left: 40px; }
  .stageWrap.norail, body.cols.compact .stageWrap { padding-left: 0; }
  body.cols .stageWrap { flex: 1 1 0; }
  #right { position: relative; min-width: 0; min-height: 0; background: var(--bg); display: flex; flex-direction: column; }
  /* 경계 손잡이 — 장표 칸과 글 줄 칸 사이. 끌어서 폭(2열) · 높이(2행)를 정한다. 두 번 누르면 처음대로 */
  #split { position: absolute; z-index: 6; touch-action: none; }
  #split::after { content: ""; position: absolute; background: var(--blue); opacity: 0; transition: opacity .12s; border-radius: 2px; }
  #split:hover::after, body.splitting #split::after { opacity: .85; }
  body.cols #split { left: -6px; top: 0; bottom: 0; width: 11px; cursor: col-resize; }
  body.cols #split::after { left: 4px; top: 0; bottom: 0; width: 3px; }
  body.rows #split { top: -6px; left: 0; right: 0; height: 11px; cursor: row-resize; }
  body.rows #split::after { top: 4px; left: 0; right: 0; height: 3px; }
  body.splitting, body.splitting * { user-select: none !important; }
  body.splitting.cols, body.splitting.cols * { cursor: col-resize !important; }
  body.splitting.rows, body.splitting.rows * { cursor: row-resize !important; }
  body.splitting #frame { pointer-events: none; }
  body.zoom #split { display: none; }
  /* 글 줄은 제 칸에서만 민다 — 장표(무대)와 따로 */
  .rowsScroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .rowsScroll::after { content: ""; display: block; height: var(--lively-inset-bottom, 0px); }   /* 호스트가 아래를 가리면(곁칸의 독) 마지막 줄이 그 위로 올라온다 */
  body.cols .stage > .canvas { margin-bottom: var(--lively-inset-bottom, 0px); }
  /* 2열: 왼쪽은 장이 세로로 이어진 칸(무대가 남는 높이를 다 쓴다), 오른쪽은 지금 장의 글 줄 */
  body.cols #main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 36%, 520px); }
  body.cols.big #main { grid-template-columns: minmax(0, 1fr) 320px; }
  body.cols.compact #main { grid-template-columns: minmax(min(92px, 34%), 36%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }   /* 아주 좁으면 장 목록도 비율로 준다 */
  body.cols.compact #sendBar { grid-column: 1 / -1; }   /* 바닥 막대는 두 칸을 다 쓴다 */
  body.cols #left { padding: 8px 10px 0 8px; border-right: 1px solid var(--line); }
  body.cols.compact #left { padding: 6px 6px 0; }
  body.cols .leftIn { flex: 1; }
  body.cols .stage { border-radius: 8px 8px 0 0; }
  body.cols:not(.compact) .rowsWrap { padding: 4px 0 96px; }
  /* 2행: 장표는 위에 서 있고, 글 줄만 그 아래에서 내려간다 */
  body.rows #main { display: flex; flex-direction: column; }
  body.rows #left { flex: none; padding: 8px 10px 8px 8px; }
  body.rows.compact #left { padding: 6px 8px 6px 6px; }
  body.rows #right { flex: 1; border-top: 1px solid var(--line); }
  body.rows:not(.compact) .rowsWrap { column-count: 2; column-gap: 20px; padding: 6px 14px 96px; }
  body.rows .rowsWrap > * { break-inside: avoid; }
  /* 좁은 폭: 머리줄 단추를 줄이고 보내기는 바닥 막대로 */
  body.compact .leftIn { gap: 6px; }
  body.compact .rowsWrap { padding: 2px 0 20px; }
  body.compact #sendBtn { display: none; }
  body.compact .docBtn { flex: 1 1 72px; min-width: 40px; }

  /* 장 번호 줄 — 세로로 서고, 길면 그 안에서 위아래로 민다(휠 · 끌기가 그대로 먹는다). 지금 장은 늘 보이게 따라온다 */
  .chips { position: absolute; left: 0; top: 0; bottom: 0; width: 34px; display: flex; flex-direction: column; flex-wrap: nowrap; gap: 6px; padding: 8px 0 8px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }   /* 무대 높이를 따른다(번호가 많아도 무대를 늘리지 않는다) */
  .chips::-webkit-scrollbar { display: none; }
  .chips::-webkit-scrollbar { display: none; }   /* 사파리(옛 판)는 scrollbar-width 를 모른다 — 번호 줄에 스크롤 막대가 서면 번호가 잘린다 */
  body.cols.compact .chips { display: none; }   /* 좁은 2열은 왼쪽의 장 목록이 곧 번호 줄이다(장마다 번호가 붙는다) */
  .chip { position: relative; flex: none; width: 27px; height: 24px; padding: 0; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); color: var(--ink-sub); font: 700 12px var(--mono); display: inline-grid; place-items: center; }
  .chip:hover { border-color: var(--muted-2); color: var(--ink); }
  .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .chip.chg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--violet); }
  .chip.on.chg::after { background: #fff; }
  .chip i { position: absolute; right: -6px; top: -7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font: 800 12px/16px var(--font); font-style: normal; color: #fff; background: var(--coral); display: grid; place-items: center; }
  .chip i.e { background: var(--yellow); color: #3A2D00; }
  /* 장 번호를 끌어 순서 바꾸기 — 잡은 칩은 흐리게, 놓일 자리는 파란 막대 */
  .chip { touch-action: none; }
  .chip.mv { border-style: dashed; border-color: var(--violet); color: var(--violet-text); }
  .chip.on.mv { color: #fff; border-style: solid; }
  /* 순서 끌기 — 든 번호는 손을 따라오고(float), 번호 줄에는 들어갈 자리의 구분선(chipph)이 선다 */
  .chip.float { position: fixed; z-index: 40; margin: 0; background: var(--blue); color: #fff; border-color: var(--blue); border-style: solid; transform: scale(1.25) rotate(-4deg); box-shadow: 0 10px 22px rgba(21,35,59,.38); transition: transform .12s ease, box-shadow .12s ease; }
  .chip.float.drop { transform: none; box-shadow: 0 2px 6px rgba(21,35,59,.2); transition: left .14s ease, top .14s ease, transform .14s ease, box-shadow .14s ease; }
  .chip.float::after { display: none; }
  .chipph { flex: none; display: block; width: 27px; height: 12px; position: relative; }
  .chipph::before { content: ""; position: absolute; left: -2px; right: -2px; top: 4px; height: 4px; border-radius: 2px; background: var(--blue); box-shadow: 0 0 0 3px rgba(45,107,240,.18); }
  body.reorder, body.reorder * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
  body.reorder .curp, body.reorder .spot, body.reorder .pno, body.reorder #hl, body.reorder #ohl { display: none !important; }
  body.reorder .stage { scroll-snap-type: none !important; }
  /* 끄는 동안 옆에 뜨는 앞 · 여기 · 뒤 */
  #roHint { position: fixed; z-index: 41; pointer-events: none; width: max-content; max-width: min(300px, calc(100vw - 64px)); padding: 7px 11px 8px 9px; border-radius: 10px; background: var(--ink); color: var(--bg); font: 600 12.5px/1.45 var(--font); box-shadow: 0 10px 28px rgba(21,35,59,.35); display: grid; gap: 3px; }
  #roHint[hidden] { display: none; }
  #roHint div { display: flex; gap: 8px; min-width: 0; padding-left: 7px; border-left: 3px solid transparent; }
  #roHint .k { flex: none; width: 2.3em; opacity: .62; font-weight: 700; }
  #roHint .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .82; }
  #roHint .me { border-left-color: var(--blue); }
  #roHint .me .k, #roHint .me .t { opacity: 1; font-weight: 800; }
  /* (좁은 2열) 든 장이 놓일 빈 자리 · 손 옆의 쪽 번호 */
  #roSlot { position: absolute; z-index: 4; pointer-events: none; box-sizing: border-box; border: 2px dashed var(--blue); border-radius: 5px; background: rgba(45,107,240,.10); transition: top .2s cubic-bezier(.2,.8,.2,1); }
  #roBadge { position: fixed; z-index: 41; pointer-events: none; padding: 3px 9px; border-radius: 10px; background: var(--ink); color: var(--bg); font: 700 12px var(--font); white-space: nowrap; box-shadow: 0 6px 18px rgba(21,35,59,.3); }


  /* 장표 무대 — 장들이 세로로 이어진 칸(제 스크롤). 캔버스 폭 = 장 폭(배율 = 캔버스 폭 ÷ 원본 폭), 캔버스 높이 = 이어 놓은 장 전체. */
  .stage { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; border-radius: 8px; background: var(--soft-2); box-shadow: 0 0 0 1px var(--line-2), 0 6px 22px rgba(21,35,59,.09); }
  body.rows .stage { scroll-snap-type: y proximity; }
  .stage.doc { background: #fff; }
  .canvas { position: relative; width: 100%; height: 180px; overflow: hidden; }
  .canvas iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; }
  .stage.doc .canvas iframe { background: #fff; }
  .hit { position: absolute; inset: 0; cursor: pointer; }
  body.compact .hit { cursor: zoom-in; }
  /* 지금 장 테두리 — 장이 여럿 보이는 2열에서만 */
  .curp { position: absolute; left: 0; pointer-events: none; border-radius: 2px; box-shadow: inset 0 0 0 2px var(--blue); z-index: 2; }
  body.rows .curp, .stage.doc .curp { display: none; }
  /* 장 번호 꼬리표 — 장 띠가 없는 좁은 2열에서만 */
  .pno { position: absolute; left: 3px; display: none; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 5px; font: 800 12px/16px var(--mono); color: #fff; background: rgba(21,35,59,.72); pointer-events: none; z-index: 3; text-align: center; }
  .pno.on { background: var(--blue); }
  .pno.has { background: var(--coral); }
  body.cols.compact .pno { display: block; }
  .snap { position: absolute; left: 0; width: 1px; height: 1px; pointer-events: none; scroll-snap-align: start; }
  /* 자리에 단 의견 — 핀(한 점)과 영역(상자). 안 보낸 것은 호박색, 보낸 것은 회색, 반영된 것은 민트 */
  .spot { position: absolute; z-index: 6; margin: 0; }
  .spot.pin { min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; transform: translate(-50%, -50%); display: grid; place-items: center; font: 800 12px/1 var(--mono); color: #3A2400; background: var(--amber); border: 2px solid #fff; box-shadow: 0 2px 7px rgba(21,35,59,.38); cursor: pointer; }
  .spot.box { border: 2px dashed var(--amber); background: rgba(217,154,91,.10); border-radius: 4px; pointer-events: none; }   /* 상자 안의 글은 그대로 눌린다 — 번호표만 눌린다 */
  .spot.box b { position: absolute; left: -2px; top: -2px; min-width: 20px; height: 20px; padding: 0 5px; border: 0; border-radius: 4px 0 7px 0; display: grid; place-items: center; font: 800 12px/1 var(--mono); color: #3A2400; background: var(--amber); pointer-events: auto; cursor: pointer; }
  .spot.box.obj { border-style: solid; }   /* 고른 개체의 테두리(끌어서 잡은 영역은 점선) */
  .spot.sent.pin, .spot.sent.box b { background: var(--muted-2); color: #fff; }
  .spot.sent.box { border-color: var(--muted-2); background: rgba(138,153,181,.08); }
  .spot.applied.pin, .spot.applied.box b { background: var(--mint); color: #fff; }
  .spot.applied.box { border-color: var(--mint); background: rgba(22,199,154,.07); }
  .spot.on.pin { box-shadow: 0 0 0 4px rgba(45,107,240,.35), 0 2px 7px rgba(21,35,59,.38); }
  .spot.on.box { box-shadow: 0 0 0 3px rgba(45,107,240,.30); }
  .spot.far { opacity: .6; }
  body.cols.compact:not(.zoom) .spot { display: none; }      /* 손톱만 한 장 목록에는 그리지 않는다 */
  .ohl { position: absolute; z-index: 3; pointer-events: none; border: 2px solid var(--blue); border-radius: 4px; background: rgba(45,107,240,.06); }   /* 고르기로 지날 때의 개체 테두리 */
  .mq { position: absolute; z-index: 7; pointer-events: none; border: 2px dashed var(--blue); background: rgba(45,107,240,.10); border-radius: 4px; }
  body.tool-pin .hit, body.tool-box .hit { cursor: crosshair; }
  body.tool-box .hit { touch-action: none; }
  .hl { position: absolute; pointer-events: none; border: 2px solid var(--blue); background: rgba(45,107,240,.10); border-radius: 4px; box-shadow: 0 0 0 3px rgba(45,107,240,.16); transition: all .08s; z-index: 4; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #576889; font-size: 13px; background: #F6F8FC; z-index: 5; min-height: 120px; }
  /* 좁은 폭에서 작은 장표를 누르면 크게 — 칸 가득 펴고 가로세로로 민다 */
  body.zoom .stage { position: fixed; left: 0; right: 0; top: 40px; bottom: 0; z-index: 15; border-radius: 0; overflow: auto; box-shadow: none; background: var(--soft-2); height: auto !important; max-height: none !important; scroll-snap-type: none; }
  body.zoom .hit { cursor: pointer; }
  #zoomClose { display: none; }
  body.zoom #zoomClose { display: inline-flex; position: fixed; right: 10px; top: 48px; z-index: 17; box-shadow: 0 4px 14px rgba(21,35,59,.2); }

  /* 장표 아래 한 줄: 「2 / 18 · 제목」 · 안 고르기 · ‹ › · 장 전체 의견 */
  /* 장표에서 누를 때의 도구 — 글 고르기 · 핀 · 영역. 머리줄에 선다. 작은 장표(좁은 폭)에서는 크게 폈을 때만 */
  .tools button { width: 28px; padding: 0; justify-content: center; }
  body.compact:not(.zoom) #tools { display: none; }
  body.zoom #tools { display: inline-flex; position: fixed; left: 10px; top: 48px; z-index: 17; box-shadow: 0 4px 14px rgba(21,35,59,.2); }
  .vars { display: inline-flex; gap: 4px; align-items: center; flex: none; font-size: 12px; color: var(--muted); }
  .vars .v { height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink-sub); font-size: 12px; font-weight: 700; }
  .vars .v.on { background: var(--mint-bg); color: var(--mint-deep); border-color: var(--mint-deep); }
  .ib.sm { height: 26px; min-width: 26px; padding: 0 8px; font-size: 12px; }
  .ib.sm.ic { padding: 0; width: 26px; }
  .ib.has { color: var(--amber-text); border-color: var(--amber); background: var(--amber-bg); }
  #cmToggle { display: none; }
  body.compact #cmToggle { display: inline-flex; }
  .ta { flex: none; width: 100%; resize: none; overflow: hidden; font: 500 13.5px/1.5 var(--font); color: var(--ink); background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; outline: none; min-height: 36px; display: block; }
  .ta:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(45,107,240,.12); }
  .ta::placeholder { color: var(--muted-2); font-weight: 500; }

  /* 글 줄 */
  /* 글 줄 칸의 머리 — 지금 장(「2 / 17 · 제목」 · 글 수) 한 줄 + 장 전체 의견 칸. 장표 위가 아니라 여기 선다 */
  .rh { flex: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; background: var(--bg); border-bottom: 1px solid var(--line); padding: 7px 12px 8px; }
  body.compact .rh { padding: 6px 10px 6px; }
  .rhLine { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 13px; min-width: 0; }
  .rhLine small { flex: none; font: 700 12px var(--mono); color: var(--muted); }
  .rhLine b { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 800; color: var(--ink); }
  .rhLine .cnt { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  body.compact .rhLine .cnt { display: none; }
  /* 글 줄 칸이 좁으면 머리의 단추는 그림만 남고(r-tight), 더 좁으면 도움말도 뺀다(r-tiny) — 오른쪽이 잘리지 않게 */
  body.r-tight #cmToggle span { display: none; }
  body.r-tight #cmToggle { padding: 0 6px; }
  body.r-tight .rhLine { gap: 6px; }
  body.r-tiny .rhLine .ib.ic { display: none; }
  body.r-tiny .rh { padding-left: 6px; padding-right: 6px; }
  .rh .ta { min-height: 32px; padding: 5px 9px; font-size: 13px; }
  /* 의견이 가리키는 곳 — 이 장 / 문서 전체. 한 칸을 눌러 바꾼다(문서 전체는 보라) */
  .cmBox { display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
  .cmBox[hidden] { display: none; }
  .cmBox .ta { flex: 1; min-width: 0; }
  .cmSeg { flex: none; display: inline-flex; height: 32px; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
  .cmSeg button { position: relative; border: 0; background: var(--bg); padding: 0 9px; font: 700 12px var(--font); color: var(--muted); white-space: nowrap; }
  .cmSeg button + button { border-left: 1px solid var(--line-2); }
  .cmSeg button.on { background: var(--ink); color: var(--bg); }
  .cmSeg button[data-s="doc"].on { background: var(--violet); color: #fff; }
  .cmSeg button.has::after { content: ""; position: absolute; right: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--coral); }
  .cmBox.doc .ta { border-color: var(--violet); box-shadow: inset 3px 0 0 var(--violet); }
  body.r-tight .cmBox { flex-direction: column; align-items: stretch; }
  body.r-tight .cmSeg { align-self: flex-start; height: 26px; }
  /* 바뀐 곳 훑어보기 — 글 줄 칸을 덮는다 */
  #review { position: absolute; inset: 0; z-index: 8; background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
  #review[hidden] { display: none; }
  .rvHead { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rvHead b { flex: 1; min-width: 0; font-weight: 800; }
  .rvHead .cnt { flex: none; font: 700 12px var(--mono); color: var(--muted); }
  .rvBody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px calc(16px + var(--lively-inset-bottom, 0px)); display: grid; gap: 10px; align-content: start; }
  .rvLoc { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-sub); min-width: 0; }
  .rvLoc .clip { flex: 1; min-width: 0; }
  .rvTag { flex: none; font-size: 12px; font-weight: 800; padding: 1px 7px; border-radius: 6px; background: var(--violet-bg); color: var(--violet-text); }
  .rvBox { border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px 9px; font-size: var(--row-fs, 14.5px); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .rvBox small { display: block; font: 800 12px var(--font); color: var(--muted); margin-bottom: 3px; }
  .rvBox.was { background: var(--soft); color: var(--ink-sub); }
  .rvBox.now { border-color: var(--blue); }
  .rvBox del { text-decoration: line-through; background: rgba(229,100,80,.16); color: inherit; border-radius: 3px; }
  .rvBox ins { text-decoration: none; background: rgba(45,107,240,.16); border-radius: 3px; font-weight: 700; }
  .rvBox.none { color: var(--muted); font-size: 13px; }
  .rvActs { display: flex; flex-wrap: wrap; gap: 6px; }
  .rvFoot { flex: none; display: flex; gap: 6px; padding: 8px 10px calc(8px + var(--lively-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .rvFoot .ib { flex: 1; justify-content: center; }
  .rvDone { text-align: center; padding: 28px 10px; display: grid; gap: 10px; justify-items: center; }
  .rvDone b { font-size: 15px; }
  #newVerBanner { flex-wrap: wrap; }
  /* 그림으로 견주기 — 왼쪽 칸을 덮는다 */
  #left { position: relative; }
  #cmp { position: absolute; inset: 0; z-index: 9; background: var(--soft-2); display: flex; flex-direction: column; min-width: 0; }
  #cmp[hidden] { display: none; }
  .cmpBar { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-sub); }
  .cmpBar .sp { flex: 1; }
  .cmpBar .seg2 { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--bg); }
  .cmpBar .seg2 button { border: 0; background: none; height: 26px; padding: 0 9px; font: 700 12px var(--font); color: var(--muted); }
  .cmpBar .seg2 button.on { background: var(--ink); color: var(--bg); }
  #cmpHold { height: 26px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--blue); background: var(--bg); color: var(--blue-deep); font: 700 12px var(--font); touch-action: none; user-select: none; -webkit-user-select: none; }
  #cmpHold:active, #cmpHold.down { background: var(--blue); color: #fff; }
  .cmpGrid { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 8px; padding: 0 8px calc(8px + var(--lively-inset-bottom, 0px)); align-content: start; grid-template-columns: minmax(0, 1fr); }
  .cmpGrid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cmpPane { min-width: 0; display: grid; gap: 4px; align-content: start; }
  .cmpPane > b { font: 800 12px var(--font); color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .cmpPane.now > b { color: var(--blue-deep); }
  .cmpShot { position: relative; overflow: hidden; background: #fff; border-radius: 6px; box-shadow: 0 0 0 1px var(--line-2), 0 4px 14px rgba(21,35,59,.08); min-height: 40px; }
  .cmpPane.now .cmpShot { box-shadow: 0 0 0 2px var(--blue), 0 4px 14px rgba(21,35,59,.08); }
  .cmpShot iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
  .cmpShot .none { padding: 26px 10px; text-align: center; color: var(--muted); font-size: 13px; }
  .cmpMark { position: absolute; pointer-events: none; border-radius: 3px; box-shadow: 0 0 0 2px rgba(229,100,80,.9); background: rgba(229,100,80,.10); }
  .cmpPane.now .cmpMark { box-shadow: 0 0 0 2px rgba(45,107,240,.95); background: rgba(45,107,240,.10); }
  .cmpGrid.flip .cmpPane.was { display: none; }
  .cmpGrid.flip.showWas .cmpPane.was { display: grid; }
  .cmpGrid.flip.showWas .cmpPane.now { display: none; }
  body.review.compact #main { grid-template-columns: minmax(0, 46%) minmax(0, 1fr) !important; }   /* 좁은 2열도 견주는 동안은 그림 칸을 넓힌다 */
  .rvChg { border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px 9px; display: grid; gap: 6px; }
  .rvChg .t { font-size: var(--row-fs, 14.5px); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .rvChg .t del { text-decoration: line-through; background: rgba(229,100,80,.16); border-radius: 3px; }
  .rvChg .t ins { text-decoration: none; background: rgba(45,107,240,.16); border-radius: 3px; font-weight: 700; }
  .rvChg .k { font: 800 12px var(--font); color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .rvChg .k .sp { flex: 1; }
  .rvChg .ta { min-height: 30px; font-size: 13px; padding: 4px 8px; }
  .rvNote { font-size: 13px; color: var(--ink-sub); }
  /* AI 의 질문 */
  .strip.ask { background: var(--violet-bg); color: var(--violet-text); }
  .askQ { border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
  .askQ + .askQ { margin-top: 10px; }
  .askQ .q { font-size: 14.5px; font-weight: 700; white-space: pre-wrap; }
  .askQ .where { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .askOpts { display: grid; gap: 6px; }
  .askOpts button { text-align: left; border: 1.5px solid var(--line-2); border-radius: 10px; background: var(--bg); padding: 8px 10px; font: 600 13.5px var(--font); color: var(--ink); }
  .askOpts button.on { border-color: var(--violet); background: var(--violet-bg); color: var(--violet-text); font-weight: 800; }
  .askQ .go { display: flex; justify-content: flex-end; gap: 6px; }
  #undoBtn[hidden] { display: none; }
  body.compact #undoBtn { display: none; }
  .sep { margin: 8px 14px 2px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .2px; }
  .sep:empty { padding-top: 0; margin: 6px 14px 0; }
  .rowsWrap > .sep:first-child { border-top: 0; margin-top: 2px; padding-top: 4px; }
  .rowsWrap > .sep:first-child:empty { display: none; }
  body.rows:not(.compact) .sep { margin-left: 0; margin-right: 0; }
  .row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px; padding: 2px 10px 2px 6px; border-left: 3px solid transparent; }
  body.rows:not(.compact) .row { padding-left: 0; padding-right: 0; }
  .row:hover { background: var(--soft); }
  .row:focus-within { background: var(--soft-2); border-left-color: var(--blue); }
  .row.ed { border-left-color: var(--yellow); }
  .row.cm { border-left-color: var(--amber); }
  .row.ed.cm { border-left-color: var(--yellow); }
  .row.sent { opacity: .8; }
  /* 이 판에서 이미 보낸 고친 글 — 글 칸에 그대로 서 있다(안 보낸 고침의 노란색과 가른다) */
  .row.sed .ed { background: var(--soft-2); border-color: var(--muted-2); border-width: 0 0 2px; border-radius: 6px 6px 0 0; }
  .row.sed .orig { display: flex; }
  .row.sed:not(.ed) .orig button { display: none; }
  /* 고른 글 위에 뜨는 막대 — 색 강조 · 굵게 · 풀기 */
  #fmt { position: fixed; z-index: 28; display: inline-flex; gap: 2px; padding: 3px; background: var(--ink); border-radius: 9px; box-shadow: 0 8px 24px rgba(21,35,59,.3); }
  #fmt button { height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: none; color: var(--bg); font: 700 12.5px var(--font); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  #fmt button:hover { background: rgba(255,255,255,.16); }
  #fmt i { width: 11px; height: 11px; border-radius: 3px; background: var(--blue); box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }
  .sentnote { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .row.pinned { border-left-color: var(--amber); }
  .no { padding-top: 6px; text-align: right; font: 700 12px var(--mono); color: var(--muted-2); user-select: none; }
  .row.ed .no { color: var(--amber-text); }
  .col { min-width: 0; display: grid; gap: 4px; }
  .ed { font-size: var(--row-fs); line-height: 1.5; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 4px 8px; outline: none; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; min-height: 30px; }
  .row:hover .ed { border-color: var(--line-2); background: var(--bg); }
  .ed:focus { border-color: var(--blue); background: var(--bg); box-shadow: 0 0 0 3px rgba(45,107,240,.12); }
  .row.ed .ed { background: var(--yellow-bg); border-color: var(--yellow); border-width: 0 0 2px; border-radius: 6px 6px 0 0; }
  .row.del .ed::before { content: "(삭제) 이 글을 뺍니다"; color: var(--coral-text); font-weight: 700; }
  .row.del .ed { background: var(--coral-bg); }
  .ed[contenteditable=false] { cursor: default; }
  .orig { display: none; font-size: 12px; line-height: 1.45; font-weight: 600; color: var(--muted); padding: 0 8px; align-items: baseline; gap: 8px; }
  .row.ed .orig { display: flex; }
  .orig s { text-decoration-color: var(--muted-2); flex: 1 1 auto; min-width: 0; }
  .orig button { flex: none; font: 800 12px var(--font); color: var(--blue-deep); background: none; border: 0; padding: 0; text-decoration: underline; }
  .nt { display: none; width: 100%; resize: none; overflow: hidden; font: 600 13px/1.45 var(--font); color: var(--amber-text); background: var(--amber-bg); border: 1px dashed var(--amber); border-radius: 7px; padding: 5px 8px; outline: none; min-height: 30px; }
  .nt::placeholder { color: var(--amber); font-weight: 600; }
  .nt:focus { box-shadow: 0 0 0 3px rgba(217,154,91,.16); }
  .row:focus-within .nt, .row.cm .nt, .row.show .nt { display: block; }   /* 행의 cm 은 「의견 있음」 상태, nt 는 의견 칸 — 이름이 같으면 행이 사라진다 */
  /* 글 줄 칸의 자리 의견 */
  .sbadge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; font: 800 12px/1 var(--mono); color: #3A2400; background: var(--amber); }
  .sbadge.sent { background: var(--muted-2); color: #fff; }

  body.rows:not(.compact) .orphans { margin-left: 0; margin-right: 0; }

  /* 좁은 화면 아래 보내기 */
  #sendBar { display: none; flex: none; border-top: 1px solid var(--line); padding: 8px 10px calc(9px + var(--lively-inset-bottom, 0px)); background: var(--soft); }

  /* 불러오기 — 처음 화면과 「다른 HTML 불러오기」 가 같은 목록을 쓴다: 눌러서 여는 것이 먼저, 세션에 말하는 길은 그 다음 */
  .empty { flex: 1; min-height: 0; overflow-y: auto; display: grid; justify-items: center; align-content: start; padding: 22px 14px calc(28px + var(--lively-inset-bottom, 0px)); color: var(--ink-sub); }

  .pk-list { display: grid; gap: 5px; }
  .pk-i { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 8px 10px 8px 8px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--bg); text-align: left; }

  .pk-i:disabled { opacity: .55; cursor: default; }
  .pk-i .ico { grid-row: 1 / span 2; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--soft-2); color: var(--muted); }
  .pk-i .ico.doc { background: var(--blue-bg); color: var(--blue-deep); }
  .pk-i b { font-size: 13.5px; font-weight: 800; color: var(--ink); }
  .pk-i small { grid-column: 2; font-size: 12px; color: var(--muted); }
  .pk-i .go { grid-row: 1 / span 2; grid-column: 3; font-size: 12px; font-weight: 800; color: var(--blue-deep); white-space: nowrap; }
  .pk-more { justify-self: start; height: 28px; }

  .pk-say code { justify-self: start; font: 600 12.5px var(--mono); color: var(--ink); background: var(--soft-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 10px; white-space: pre-wrap; }
  .pk-drop { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 9px 10px 9px 8px; border: 1.5px dashed var(--line-2); border-radius: 9px; background: var(--soft); }
  .pk-drop.over, body.dropping .pk-drop { border-color: var(--blue); background: var(--blue-bg); }
  .pk-drop .ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
  .pk-drop b { font-size: 13.5px; font-weight: 800; color: var(--ink); }
  .pk-drop small { grid-column: 2; font-size: 12px; color: var(--muted); }
  .pk-drop .ib { grid-row: 1 / span 2; grid-column: 3; height: 30px; }
  #dropVeil { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: rgba(45,107,240,.14); border: 3px dashed var(--blue); font-size: 15px; font-weight: 800; color: var(--blue-deep); pointer-events: none; }
  body.dropping #dropVeil { display: grid; }
  .pk-none { padding: 12px; border: 1.5px dashed var(--line-2); border-radius: 9px; background: var(--soft); font-size: 13px; line-height: 1.55; }
  .pk-prog { font-size: 12.5px; font-weight: 700; color: var(--blue-deep); }
  #pickModal .card { width: min(560px, 100%); }
  #pickModal .mb { max-height: 70vh; overflow-y: auto; }

  /* 모달(보내기 · 표시 설정 · 문서 의견) */
  .modal { position: fixed; inset: 0; z-index: 30; background: rgba(21,35,59,.42); display: grid; place-items: center; padding: 14px; }
  .modal .card { width: min(420px, 100%); max-height: 94vh; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(21,35,59,.35); }
  .modal .mh { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 14px; }
  .modal .mh .ib { border-color: transparent; background: none; }
  .modal .mb { padding: 14px; font-size: 13px; display: grid; gap: 12px; }
  .modal .mf { padding: 0 14px 14px; display: flex; gap: 8px; justify-content: flex-end; }
  .modal .mf .ib { height: 34px; padding: 0 16px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; color: var(--ink-sub); }
  .kv span:nth-child(2n) { color: var(--ink); font-weight: 700; white-space: nowrap; }
  .msg { font: 600 12.5px/1.55 var(--font); color: var(--ink); background: var(--soft-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; }
  .fine { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .opt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .opt .lab { font-weight: 800; font-size: 12.5px; }
  .opt .seg button { height: 28px; padding: 0 12px; }
  .chks { display: grid; gap: 8px; }
  .chk { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--blue); }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); font: 700 13px var(--font); border-radius: 10px; padding: 10px 16px; box-shadow: 0 10px 30px rgba(21,35,59,.3); opacity: 0; pointer-events: none; transition: opacity .15s; max-width: 92vw; text-align: center; }
  #toast.on { opacity: 1; }

<script>
(function () {

  /* ───────────── SDK 적응 — 없는 기능은 감지해서 조용히 대신한다 ───────────── */
  var L = window.lively;
  var $ = function (id) { return document.getElementById(id); };
  var toastEl = $('toast'); var toastT = 0;
  function toast(m, ms) { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, ms || 2200); }
  /* 누르는 동안에는 다시 그리지 않는다 — 사파리는 mousedown 의 대상이 떼기 전에 갈아 끼워지면 click 을 내지 않는다(크롬은 낸다).
     저장이나 바깥 변경처럼 «제때를 고를 수 없는» 다시 그리기는 whenUp 으로 건다: 누르는 중이면 손을 뗀 뒤(그 누름의 click 이 나간 뒤)에 돈다. */
  var pressing = false, afterPress = [], pressT = 0;
  function pressEnd() { if (!pressing) return; pressing = false; clearTimeout(pressT); setTimeout(function () { var q = afterPress; afterPress = []; q.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); }, 0); }
  document.addEventListener('pointerdown', function () { pressing = true; clearTimeout(pressT); pressT = setTimeout(pressEnd, 15000); }, true);   // 15초 — 뗀 것을 못 들은 채로 영영 미루지 않게
  document.addEventListener('pointerup', pressEnd, true); document.addEventListener('pointercancel', pressEnd, true); window.addEventListener('blur', pressEnd);
  document.addEventListener('pointermove', function (e) { if (pressing && !e.buttons) pressEnd(); }, true);   // 창 밖에서 뗐다가 돌아왔다
  function whenUp(fn) { if (!pressing) { fn(); return; } if (afterPress.indexOf(fn) < 0) afterPress.push(fn); }
  /* 되돌리기 — 앱이 한 일의 더미. 글 칸 안에서 치는 것은 브라우저가 되돌린다(여기 쌓지 않는다). */
  var undos = [], undoing = false;
  function pushUndo(label, fn) { if (undoing) return; undos.push({ label: label, fn: fn }); if (undos.length > 60) undos.shift(); paintUndo(); }

  /* 바깥에서 표가 바뀔 때마다(AI 가 답을 한 줄씩 적는다) 글 줄 칸을 다시 그린다 — 그래도 고치던 칸에서 손이 떨어지면 안 된다:
     치는 중(한글 조합 중 · 방금 친 직후)에는 미뤘다가, 다시 그릴 때는 초점과 캐럿을 제자리에 돌려놓는다. */

  /** 무엇을 열까 — 보던 문서(다시 그릴 때) > 이 세션에서 마지막에 보던 것 > 이 세션에서 올린 것 가운데 최신. 없으면 불러오기 화면. */
