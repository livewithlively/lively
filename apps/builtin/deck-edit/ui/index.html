<!doctype html><meta charset="utf-8"><title>장표 수정</title>
<!--
  라이블리 앱 — 장표 수정 (#4596). 이 파일 하나로 완결된다(외부 스크립트·스타일·네트워크 없음).
  · 세션의 AI 가 올린 HTML 산출물(장표·보고서·시안)을 **판(version)** 단위로 받아 장표와 글 줄을 나란히 놓는다.
    글 줄을 고치면 장표에 바로 반영되고, 의견을 달고, [AI에게 보내기]로 묶음을 세션에 곧바로 보낸다(lively.chat.send).
  · 장표는 앱 안의 **중첩 iframe(srcdoc)** 에 그린다. 자식 문서는 출처가 따로라 DOM 에 못 닿으므로(실측 #4593) 머리에
    대리 스크립트(AGENT)를 끼우고 postMessage 로 글 줄 뽑기·고치기·좌표를 주고받는다. 글 줄 뽑는 규칙은 세일즈 덱
    워딩 시트(project/4577/세일즈덱/rv3/sheet.js)에서 옮겼다 — 굵게·색 꼬리표는 지키고, 숨은 글·번호 동그라미는 뺀다.
  · 판 = versions 표의 머리 1행 + 장 N행 + 꼬리 1행. 머리의 `__ASSET:<sha>__` 자리표는 assets 표(sha · seq 조각)로 메운다.
  · 배치는 둘 — 2열(왼쪽에 장이 세로로 이어진 칸, 오른쪽에 지금 장의 글 줄) · 2행(위에 장표, 아래에 글 줄). **고른 배치는 폭이
    좁아도 그대로 선다**(원준 2026-10-07 「옵션으로 하려면 하드하게 정해져야지」). 고른 적이 없을 때만 폭으로 정한다(640 미만 = 2행).
    좁은 폭(compact)은 배치가 아니라 촘촘함이다(머리줄 단추 줄임 · 보내기는 바닥 막대).
  · 무대(stage)는 **장들이 세로로 이어진 칸**이다 — 자식 문서가 모든 장을 위에서 아래로 놓고(대리 스크립트), 무대가 그 위를 민다.
    2열은 칸 높이만큼, 2행은 한 장 높이만큼 보인다. 지금 장 = 가장 많이 보이는 장(밀면 따라온다) 또는 누른 장.
    글 줄 칸(rowsScroll)은 무대와 따로 민다 — 장표의 아래쪽 글을 눌러도 장표는 제자리에 있고 글 줄만 그 줄로 간다.
  · 문서는 세션으로 가르지 않는다 — 앱의 표는 워크스페이스에 하나이고, 장표는 세션보다 오래 산다(세션은 닫히고 복제되고 옮겨진다).
    문서 고르기에는 전부가 뜨고(이 세션에서 올린 것이 먼저), 세션은 「어디로 보내나 · 누가 올렸나」 로만 남는다.
    이 세션에 열 문서가 아직 없으면 **불러오기 화면**이 선다: 이 세션 프로젝트의 자료에 있는 HTML(lively.files · 최신순)과 앱에 있는 문서를
    눌러서 연다. 파일은 앱이 그 자리에서 나눠 올린다(아래 deck-split 블록 — bin/deck-push.mjs 와 같은 글).
  · 호스트가 화면 아래를 가리면(곁칸의 독) --lively-inset-bottom 으로 알려 준다 — 바닥 막대와 스크롤 끝을 그만큼 올린다.
  · 보내기는 **사람이 누른 동작 안에서** 끝나야 한다(호스트가 userActivation 을 본다): 누른 자리에서 묶음을 한 번의
    store.update 로 잠그고 곧바로 chat.send. 못 알렸으면 묶음은 잠긴 채 「다시 보내기」 띠를 남긴다.
  · 샌드박스 규칙: 폼 제출 금지(click·keydown) · 한글 조합 중 Enter 무시 · localStorage 없음(불투명 오리진) → 개인 설정은
    lively.prefs, 임시 상태만 메모리. SDK 가 아직 없는 호스트(chat·prefs 가 없을 때)에서도 깨지지 않게 기능을 감지한다.
  · 고치기: 이 앱의 모양을 바꾸고 싶으면 세션에 말한다(AI 가 app_pull → ui/index.html 수정 → app_save). 설명은 README.md.
-->
<style>
  :root {
    --ink: #15233B; --ink-sub: #49566B; --muted: #576889; --muted-2: #8A99B5; --line: #E6ECF5; --line-2: #D6DFEC;
    --bg: #fff; --soft: #F6F8FC; --soft-2: #EEF3FA; --blue: #2D6BF0; --blue-deep: #1E54CC; --blue-bg: #EEF4FF;
    --mint: #16C79A; --mint-deep: #0FA37E; --mint-bg: #EFFAF6; --coral: #E4756B; --coral-text: #B84E44; --coral-bg: #FDF1EF;
    --amber: #D99A5B; --amber-text: #8A5A14; --amber-bg: #FFF8EC; --yellow: #E9B400; --yellow-bg: #FFFBEA; --violet: #7B61E0; --violet-bg: #EFE9FF; --violet-text: #5B3FD0;
    --font: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --row-fs: 14.5px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E8EDF6; --ink-sub: #B6C1D4; --muted: #94A2BB; --muted-2: #6F7D96; --line: #2A3446; --line-2: #354158;
      --bg: #141A24; --soft: #1A2230; --soft-2: #202A3A; --blue: #5B8CFF; --blue-deep: #8FB0FF; --blue-bg: #1B2A48;
      --mint: #2ED3A6; --mint-deep: #3BD9AE; --mint-bg: #163328; --coral: #F08B82; --coral-text: #F3A49C; --coral-bg: #3A2320;
      --amber: #E0A964; --amber-text: #F0C98B; --amber-bg: #342A17; --yellow: #F0C230; --yellow-bg: #332D14; --violet-bg: #2A2450; --violet-text: #B7A6FF;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 13.5px/1.5 var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; letter-spacing: -.1px; word-break: keep-all; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  b { font-weight: 800; }
  .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .i.dots { stroke-width: 2.6; }
  .clip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 머리줄 ── */
  #top { flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--soft); position: relative; z-index: 16; }
  .docBtn { flex: 0 1 240px; min-width: 72px; height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0 5px 0 9px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink); font: 700 13px var(--font); text-align: left; }
  .docBtn:hover, .docBtn[aria-expanded=true] { border-color: var(--muted-2); }
  .docBtn span { flex: 1; }
  .docBtn .i { width: 14px; height: 14px; color: var(--muted); }
  /* 문서 고르기 — 앱에 있는 문서 전부(이 세션 것 먼저) + 다른 HTML 불러오기 */
  .docMenu { position: absolute; left: 10px; top: 40px; z-index: 26; width: min(360px, calc(100vw - 20px)); max-height: min(72vh, 480px); overflow-y: auto; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 34px rgba(21,35,59,.18); padding: 5px; }
  .dm-l { padding: 7px 9px 3px; font-size: 12px; font-weight: 800; color: var(--muted); }
  .dm-i { width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 6px; align-items: center; padding: 6px 9px; border: 0; border-radius: 7px; background: none; text-align: left; }
  .dm-i:hover { background: var(--soft-2); }
  .dm-i .i { width: 14px; height: 14px; color: var(--blue); visibility: hidden; }
  .dm-i.on .i { visibility: visible; }
  .dm-i b { font-size: 13px; font-weight: 700; color: var(--ink); }
  .dm-i.on b { font-weight: 800; }
  .dm-i small { grid-column: 2; font-size: 12px; color: var(--muted); }
  .dm-add { width: 100%; display: flex; align-items: center; gap: 6px; height: 34px; margin-top: 4px; padding: 0 9px; border: 0; border-top: 1px solid var(--line); border-radius: 0 0 7px 7px; background: none; font-size: 13px; font-weight: 800; color: var(--blue-deep); text-align: left; }
  .dm-add:hover { background: var(--blue-bg); }
  .dm-add .i { width: 14px; height: 14px; }
  .pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 0 1 auto; min-width: 0; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: none; height: 28px; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink-sub); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .pill .n { font-size: 12px; font-weight: 800; border-radius: 5px; padding: 0 5px; background: rgba(255,255,255,.2); }
  .sp { flex: 1; min-width: 0; }
  .ib { flex: none; height: 28px; min-width: 28px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); color: var(--ink-sub); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
  .ib:hover:not(:disabled) { border-color: var(--muted-2); color: var(--ink); }
  .ib.ic { padding: 0; width: 28px; }
  .ib.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ib.pri:hover:not(:disabled) { color: var(--bg); filter: brightness(1.12); }
  .ib:disabled { opacity: .42; cursor: default; }
  .seg { display: inline-flex; flex: none; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--bg); }
  .seg button { height: 26px; padding: 0 9px; border: 0; background: transparent; color: var(--ink-sub); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .menu { position: absolute; right: 10px; top: 40px; z-index: 25; min-width: 220px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 34px rgba(21,35,59,.18); padding: 5px; display: grid; }
  .menu button { height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .menu button:hover { background: var(--soft-2); }
  .menu button.hot { color: var(--blue-deep); font-weight: 800; }

  /* 띠(알림 한 줄) */
  .strip { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; background: var(--blue-bg); color: var(--blue-deep); }
  .strip span { flex: 1; min-width: 0; }
  .strip.warn { background: var(--amber-bg); color: var(--amber-text); border-bottom: 1px solid var(--line); }
  .strip.in { border-radius: 8px; }

  /* ── 몸통: 배치는 둘(2열 cols · 2행 rows) — 고른 대로 선다. 좁은 폭(compact · 640 미만)은 촘촘하게만 한다 ── */
  #main { flex: 1; min-height: 0; }
  #left { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .leftIn { width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #right { min-width: 0; min-height: 0; background: var(--bg); display: flex; flex-direction: column; }
  /* 글 줄은 제 칸에서만 민다 — 장표(무대)와 따로 */
  .rowsScroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .rowsScroll::after { content: ""; display: block; height: var(--lively-inset-bottom, 0px); }   /* 호스트가 아래를 가리면(곁칸의 독) 마지막 줄이 그 위로 올라온다 */
  body.cols .stage > .canvas { margin-bottom: var(--lively-inset-bottom, 0px); }
  /* 2열: 왼쪽은 장이 세로로 이어진 칸(무대가 남는 높이를 다 쓴다), 오른쪽은 지금 장의 글 줄 */
  body.cols #main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 36%, 520px); }
  body.cols.big #main { grid-template-columns: minmax(0, 1fr) 320px; }
  body.cols.compact #main { grid-template-columns: minmax(92px, 36%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  body.cols.compact #sendBar { grid-column: 1 / -1; }   /* 바닥 막대는 두 칸을 다 쓴다 */
  body.cols.compact .under .nav { display: none; }       /* 좁은 2열은 장 목록이 곧 앞뒤 넘기기다 */
  body.cols #left { padding: 12px 14px 0; border-right: 1px solid var(--line); }
  body.cols.compact #left { padding: 6px 6px 0; }
  body.cols .leftIn { flex: 1; }
  body.cols .stage { flex: 1 1 0; min-height: 0; border-radius: 8px 8px 0 0; }
  body.cols:not(.compact) .rowsWrap { padding: 4px 0 96px; }
  /* 2행: 장표는 위에 서 있고, 글 줄만 그 아래에서 내려간다 */
  body.rows #main { display: flex; flex-direction: column; }
  body.rows #left { flex: none; padding: 12px 14px 10px; }
  body.rows.compact #left { padding: 6px 10px 8px; }
  body.rows #right { flex: 1; border-top: 1px solid var(--line); }
  body.rows:not(.compact) .rowsWrap { column-count: 2; column-gap: 20px; padding: 6px 14px 96px; }
  body.rows .rowsWrap > * { break-inside: avoid; }
  /* 좁은 폭: 머리줄 단추를 줄이고 보내기는 바닥 막대로 */
  body.compact .leftIn { gap: 6px; }
  body.compact .rowsWrap { padding: 2px 0 20px; }
  body.compact .rh, body.compact #sendBtn, body.compact #docCmBtn { display: none; }
  body.compact .pill .n { display: none; }
  body.compact .docBtn { flex: 1 1 72px; }
  body.compact .pills { flex: none; }
  body.compact #layoutSeg button { padding: 0 7px; }
  body.compact #layoutSeg button span { display: none; }

  /* 장 띠(번호 칩) — 몇 줄이든 다 보인다(좁으면 접어 내린다 · 숨은 가로 스크롤은 뒷장을 못 누르게 했다) */
  .chips { flex: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 6px 0 0; }
  body.compact .chips { max-height: 100px; overflow-y: auto; padding-top: 7px; }
  body.cols.compact .chips { display: none; }   /* 좁은 2열은 왼쪽의 장 목록이 곧 장 띠다(장마다 번호가 붙는다) */
  .chip { position: relative; flex: none; min-width: 28px; height: 26px; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); color: var(--ink-sub); font: 700 12px var(--mono); display: inline-grid; place-items: center; }
  .chip:hover { border-color: var(--muted-2); color: var(--ink); }
  .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .chip.chg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--violet); }
  .chip.on.chg::after { background: #fff; }
  .chip i { position: absolute; right: -6px; top: -7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font: 800 12px/16px var(--font); font-style: normal; color: #fff; background: var(--coral); display: grid; place-items: center; }
  .chip i.e { background: var(--yellow); color: #3A2D00; }

  /* 장표 무대 — 장들이 세로로 이어진 칸(제 스크롤). 캔버스 폭 = 장 폭(배율 = 캔버스 폭 ÷ 원본 폭), 캔버스 높이 = 이어 놓은 장 전체. */
  .stage { position: relative; flex: none; width: 100%; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; border-radius: 8px; background: var(--soft-2); box-shadow: 0 0 0 1px var(--line-2), 0 6px 22px rgba(21,35,59,.09); }
  body.rows .stage { scroll-snap-type: y proximity; }
  .stage.doc { background: #fff; }
  .canvas { position: relative; width: 100%; height: 180px; overflow: hidden; }
  .canvas iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; }
  .stage.doc .canvas iframe { background: #fff; }
  .hit { position: absolute; inset: 0; cursor: pointer; }
  body.compact .hit { cursor: zoom-in; }
  /* 지금 장 테두리 — 장이 여럿 보이는 2열에서만 */
  .curp { position: absolute; left: 0; pointer-events: none; border-radius: 2px; box-shadow: inset 0 0 0 2px var(--blue); z-index: 2; }
  body.rows .curp, .stage.doc .curp { display: none; }
  /* 장 번호 꼬리표 — 장 띠가 없는 좁은 2열에서만 */
  .pno { position: absolute; left: 3px; display: none; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 5px; font: 800 12px/16px var(--mono); color: #fff; background: rgba(21,35,59,.72); pointer-events: none; z-index: 3; text-align: center; }
  .pno.on { background: var(--blue); }
  .pno.has { background: var(--coral); }
  body.cols.compact .pno { display: block; }
  .snap { position: absolute; left: 0; width: 1px; height: 1px; pointer-events: none; scroll-snap-align: start; }
  .hl { position: absolute; pointer-events: none; border: 2px solid var(--blue); background: rgba(45,107,240,.10); border-radius: 4px; box-shadow: 0 0 0 3px rgba(45,107,240,.16); transition: all .08s; z-index: 4; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #576889; font-size: 13px; background: #F6F8FC; z-index: 5; min-height: 120px; }
  /* 좁은 폭에서 작은 장표를 누르면 크게 — 칸 가득 펴고 가로세로로 민다 */
  body.zoom .stage { position: fixed; left: 0; right: 0; top: 44px; bottom: 0; z-index: 15; border-radius: 0; overflow: auto; box-shadow: none; background: var(--soft-2); height: auto !important; max-height: none !important; scroll-snap-type: none; }
  body.zoom .hit { cursor: pointer; }
  #zoomClose { display: none; }
  body.zoom #zoomClose { display: inline-flex; position: fixed; right: 10px; top: 52px; z-index: 17; box-shadow: 0 4px 14px rgba(21,35,59,.2); }

  /* 장표 아래 한 줄: 「2 / 18 · 제목」 · 안 고르기 · ‹ › · 장 전체 의견 */
  .under { flex: none; display: flex; align-items: center; gap: 6px; min-height: 28px; font-size: 13px; }
  body.cols.compact .under .tt, body.cols.compact #cmToggle span { display: none; }
  .under .t { flex: 1; font-weight: 800; color: var(--ink); }
  .under .t small { font: 700 12px var(--mono); color: var(--muted); margin-right: 6px; }
  .vars { display: inline-flex; gap: 4px; align-items: center; flex: none; font-size: 12px; color: var(--muted); }

    items.forEach(function (it) { var b = el('button', it.hot ? 'hot' : '', it.label); b.type = 'button'; b.onclick = function () { box.hidden = true; it.run(); }; box.appendChild(b); });
  }
  $('moreBtn').addEventListener('click', function (e) { e.stopPropagation(); renderMenu(); $('menu').hidden = !$('menu').hidden; });
  document.addEventListener('click', function (e) {
    if (!$('menu').hidden && !$('menu').contains(e.target)) $('menu').hidden = true;
    if (!$('docMenu').hidden && !$('docMenu').contains(e.target) && !$('docBtn').contains(e.target)) closeDocMenu();
  });
  $('docBtn').addEventListener('click', function () {
    if (!$('docMenu').hidden) { closeDocMenu(); return; }
    renderDocMenu(); $('docMenu').hidden = false; $('docBtn').setAttribute('aria-expanded', 'true');
  });
  $('newVerBanner').querySelector('button').addEventListener('click', function () { var latest = st.vers[st.vers.length - 1]; if (latest) openVersion(latest).catch(fail); });
  window.addEventListener('resize', function () { if (applyLayout()) { applyPrefs(); var sc = st.sections[st.cur]; if (sc) { renderUnder(sc); renderVers(); } } });
  var fitT = 0; new ResizeObserver(function () { clearTimeout(fitT); fitT = setTimeout(fit, 30); }).observe($('main'));
  function fail(e) { toast('문제가 생겼어요: ' + (e && e.message ? e.message : e), 3500); console.error(e); }

  /* ───────────── 바깥에서 데이터가 바뀌면(세션의 AI 가 썼다) ───────────── */
  var reloadT = 0;
  sdk.store.onChange && sdk.store.onChange(function (ev) {
    if (ev && ev.source === 'app-ui') return;
    clearTimeout(reloadT);
    reloadT = setTimeout(async function () {
      try {
        var before = st.vers.slice(); await loadDocs();
        if (!st.doc) { boot(false); return; }                 // 불러오기 화면에 있었다 — 이 세션에 문서가 올라왔으면 곧바로 연다
        var me = docOf(st.doc); if (me && (me.title || me.doc) !== st.title) { st.title = me.title || me.doc; } renderDocBtn(); paintPickers();
        await loadVersionMeta(st.doc); await loadComments(st.doc);
        var latest = st.vers[st.vers.length - 1];
        if (latest && before.indexOf(latest) < 0 && latest !== st.ver) { var b = $('newVerBanner'); b.querySelector('span').textContent = '새 판 ' + latest + ' 이 올라왔습니다'; b.hidden = false; }
        // 지금 판에 안(variant)이 더 올라왔으면 장표를 다시 조립한다(고치던 줄은 데이터라 그대로)
        var key = st.doc + '#' + st.ver; var old = st.verCache[key]; delete st.verCache[key];
        var fresh = await loadVersion(st.doc, st.ver);
        var sig = function (v) { return v.slides.map(function (x) { return x.slide_id + '|' + (x.variant || ''); }).join(','); };
        if (old && sig(old) !== sig(fresh) && st.cur != null) { var fi = st.cur; await mount(assemble(fresh)); await showSlide(fi); toast('새 안이 올라왔습니다 · 장표 아래에서 고르세요'); }
        renderVers(); renderRows(); renderMenu();
      } catch (e) { console.error(e); }
    }, 600);
  });

  /* ───────────── 시작 ───────────── */
  /** 무엇을 열까 — 보던 문서(다시 그릴 때) > 이 세션에서 마지막에 보던 것 > 이 세션에서 올린 것 가운데 최신. 없으면 불러오기 화면. */
  async function boot(keepDoc) {
    if (!L.session) sdk.chat = null;   // 세션에 붙어 열린 화면이 아니면 보낼 곳이 없다 — 보내기는 「복사」가 된다
    if (!keepDoc) { try { st.prefs = (await sdk.prefs.get()) || {}; } catch (e) { st.prefs = {}; } }
    await loadDocs();
    applyPrefs();
    var want = keepDoc && st.doc && docOf(st.doc) ? st.doc : null;
    if (!want) {
      var last = L.session ? (pref('lastBySession') || {})[L.session] : pref('lastDoc');
      var mine = st.docs.filter(mineOf);
      if (last && docOf(last)) want = last;
      else if (mine.length) want = mine[0].doc;
      else if (!L.session && st.docs.length) want = st.docs[0].doc;   // 세션 없이 연 화면(앱 찾기에서 열었다)은 가장 최근 문서
    }
    if (!want) { showStart(); return; }
    await openDoc(want);
  }
  L.ready.then(function () { return boot(false); }).catch(fail);
})();
</script>
